name: Bug in the engine or a skill
description: Something in skills/, the engine, an export or a tool does not work as documented.
title: "Bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a wrong research value use "Research correction" instead. For security problems, use private reporting (see SECURITY.md), not this form.
        Tip: in a project that uses OpenDesigner, `python3 <skill>/scripts/engine.py feedback` pre-fills this form from your session. Nothing is posted until you submit it. Fixes go to the source files (`skills/`, `synthesis/`, `research/`), not the generated copies.
  - type: dropdown
    id: area
    attributes:
      label: Where is the problem?
      options:
        - Engine (skills/opendesigner/scripts/engine.py)
        - Exports (DTCG, CSS, Tailwind, Figma, Paper, Swift, Compose)
        - Interview skill (skills/opendesigner)
        - Reference intake skill (opendesigner-extract)
        - Extend skill (opendesigner-extend)
        - Visual templates
        - Repo tools (tools/od.py, tools/jev_nav.py, sync or build scripts)
        - Other
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: AI host and model
      description: For example "Claude Code 2.1.x, Opus", "Codex CLI", "ChatGPT Project", or "none, I ran the script myself".
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran or the last few turns of the conversation.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Paste the error, the wrong output, or attach a screenshot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`, or the release you installed.
  - type: input
    id: env
    attributes:
      label: Operating system and Python version
      placeholder: macOS 26, Python 3.12
