name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Python 3.11, no network)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Every JSON file parses
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          bad = []
          files = [p for p in pathlib.Path(".").rglob("*.json") if ".git" not in p.parts]
          for p in files:
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          print("\n".join(bad))
          print(f"{len(files)} JSON files, {len(bad)} invalid")
          sys.exit(1 if bad else 0)
          PY

      - name: Research citation integrity (tools/jev_nav.py check)
        run: |
          python3 tools/jev_nav.py check | tee check.txt
          grep -q "; 0 files with dangling references" check.txt

      - name: Engine tests
        run: |
          if [ -f skills/opendesigner/scripts/test_engine.py ]; then
            python3 skills/opendesigner/scripts/test_engine.py
          else
            echo "skills/opendesigner/scripts/test_engine.py not present yet; skipping"
          fi

      - name: Design evals (the engine on 18 fixed briefs; required checks must all pass)
        run: python3 tools/design_evals.py --check --no-save

      - name: Journey tracker tests (local log, anonymous report, consent texts)
        run: python3 skills/opendesigner/scripts/test_journey.py

      - name: User-workflow preference resolver
        run: python3 skills/opendesigner/scripts/test_preferences.py

      - name: Product vision stays grounded in the repo
        run: python3 tools/test_product_vision.py

      - name: Project status board exporter
        run: python3 tools/test_project_board.py

      - name: Reference extraction tests (css_scan.py, read_page.js with the runner's Node)
        run: python3 skills/opendesigner-extract/scripts/test_extract.py

      - name: Illustration skill tests (illustrate.py, offline)
        run: python3 skills/opendesigner-illustrate/scripts/test_illustrate.py

      - name: Painting bridge tests (paint.py, offline; the painting engine is not installed in CI)
        run: python3 skills/opendesigner-paint/scripts/test_paint.py
      - name: Preflight skill tests
        run: python3 skills/opendesigner-preflight/scripts/test_preflight.py

      - name: Review skill tests (review.py and probe.js guarantees, offline; the live-browser file skips without Playwright)
        run: |
          python3 skills/opendesigner-review/scripts/test_review.py
          python3 skills/opendesigner-review/scripts/test_probe_live.py

      - name: Learning wiki (tools/wiki.py check, standards, tests without OpenWiki)
        run: |
          python3 tools/wiki.py check
          python3 tools/wiki.py standards
          python3 tools/wiki.py map --check
          python3 tools/wiki.py proposals --check
          python3 tools/test_wiki.py

      - name: Generated skill copies match skills/
        run: |
          if [ -f tools/sync_skills.py ]; then
            python3 tools/sync_skills.py --check
          else
            echo "tools/sync_skills.py not present yet; skipping"
          fi

      - name: Skill frontmatter is portable (tools/build_dist.py --check)
        run: |
          if [ -f tools/build_dist.py ]; then
            python3 tools/build_dist.py --check
          else
            echo "tools/build_dist.py not present yet; skipping"
          fi

      - name: Standalone skill zips include visual templates
        run: python3 tools/test_build_dist.py

      - name: Relative Markdown links resolve (offline)
        run: python3 tools/check_links.py
