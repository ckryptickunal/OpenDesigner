<script>
document.querySelectorAll(".odl-habit-tracker").forEach((root) => {
  if (root.dataset.odlReady) return; // wire once, even if the file is pasted twice
  root.dataset.odlReady = "1";
  const TODAY = 3; // Thursday: the days after it are not yet
  const count = root.querySelector(".odl-count"), meter = root.querySelector(".odl-meter span");
  const update = () => {
    const habits = [...root.querySelectorAll(".odl-habit")];
    let today = 0;
    habits.forEach((h) => {
      const done = [...h.querySelectorAll(".odl-days button")].slice(0, TODAY + 1).map((b) => b.getAttribute("aria-pressed") === "true");
      if (done[TODAY]) today += 1;
      let i = done[TODAY] ? TODAY : TODAY - 1, n = 0;
      while (i >= 0 && done[i]) { n += 1; i -= 1; }
      if (i < 0) n += Number(h.dataset.base);
      h.querySelector(".odl-n").textContent = String(n);
      h.classList.toggle("is-cold", n === 0);
    });
    count.textContent = `${today} of ${habits.length}`;
    meter.style.inlineSize = (today / habits.length) * 100 + "%";
  };
  root.querySelectorAll(".odl-days button:not(:disabled)").forEach((b) => b.addEventListener("click", () => {
    b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true")); update();
  }));
  update();
});
</script>
