<script>
document.querySelectorAll(".odl-track-list").forEach((root) => {
  if (root.dataset.odlReady) return; // wire once, even if the file is pasted twice
  root.dataset.odlReady = "1";
  const play = root.querySelector(".odl-play"), rows = [...root.querySelectorAll("li")];
  const setPlaying = (on) => {
    root.classList.toggle("is-playing", on);
    const title = root.querySelector(".is-current .odl-t").textContent;
    play.setAttribute("aria-label", on ? `Pause ${title}` : "Play Postcards from Low Tide");
  };
  play.addEventListener("click", () => setPlaying(!root.classList.contains("is-playing")));
  rows.forEach((li) => {
    const pick = li.querySelector(".odl-pick");
    pick.setAttribute("aria-label", `Play ${li.querySelector(".odl-t").textContent}, track ${li.querySelector(".odl-n").textContent}, ${li.querySelector(".odl-d").textContent}`);
    pick.addEventListener("click", () => {
      rows.forEach((r) => { r.classList.remove("is-current"); r.removeAttribute("aria-current"); });
      li.classList.add("is-current"); li.setAttribute("aria-current", "true");
      setPlaying(true);
    });
  });
  root.querySelectorAll("[aria-pressed]").forEach((b) => b.addEventListener("click", () => {
    b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"));
  }));
});
</script>
