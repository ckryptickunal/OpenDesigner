<style>

.odl-setup-steps .odl-acts { display: flex; flex-wrap: wrap; gap: var(--ds-space-inline-xs); align-items: center; margin-block-start: var(--ds-space-stack-sm); }
.odl-setup-steps .odl-quiet { padding-inline: var(--ds-space-inset-sm); }
