<script>
document.querySelectorAll(".odl-video-player").forEach((root) => {
  if (root.dataset.odlReady) return; // wire once, even if the file is pasted twice
  root.dataset.odlReady = "1";
  const frame = root.querySelector(".odl-frame"), seek = root.querySelector(".odl-scrub"), now = root.querySelector(".odl-now");
  const play = root.querySelector(".odl-play"), big = root.querySelector(".odl-big"), cap = root.querySelector(".odl-caption span");

  const total = Number(seek.max);
  const cues = [[240, "The snow line moved forty metres up the valley this week."], [252, "Down here, the river already sounds different."],
    [266, "Louder. Faster. Colder than you would think."], [280, "We follow it from the first trickle to the lake."], [296, "It takes the water eleven hours."]];
  const clock = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const spoken = (s) => `${Math.floor(s / 60)} minutes ${s % 60} seconds`;
  let timer = null, buffered = 420;
  const show = () => {
    const s = Number(seek.value);
    buffered = Math.min(total, Math.max(buffered, s + 90));
    root.style.setProperty("--p", (s / total) * 100 + "%");
    root.style.setProperty("--b", (buffered / total) * 100 + "%");
    now.textContent = clock(s);
    seek.setAttribute("aria-valuetext", `${spoken(s)} of ${spoken(total)}`);
    const cue = cues.filter(([t]) => t <= s).pop();
    cap.textContent = cue && s - cue[0] < 14 ? cue[1] : "";
    cap.parentElement.hidden = !cap.textContent;
  };
  const stop = () => { clearInterval(timer); timer = null; frame.classList.remove("is-playing"); play.setAttribute("aria-label", "Play"); };
  const toggle = () => {
    if (timer) return stop();
    if (Number(seek.value) >= total) seek.value = 0;
    frame.classList.add("is-playing"); play.setAttribute("aria-label", "Pause");
    timer = setInterval(() => { seek.value = Number(seek.value) + 1; show(); if (Number(seek.value) >= total) stop(); }, 1000);
    if (document.activeElement === big) play.focus();

  big.addEventListener("click", toggle);
  seek.addEventListener("input", show);
  cc.addEventListener("click", () => { const on = cc.getAttribute("aria-pressed") !== "true"; cc.setAttribute("aria-pressed", String(on)); frame.classList.toggle("has-cc", on); });

  vol.addEventListener("input", () => { level(); const off = Number(vol.value) === 0; frame.classList.toggle("is-muted", off); mute.setAttribute("aria-pressed", String(off)); });
  mute.addEventListener("click", () => { const off = mute.getAttribute("aria-pressed") !== "true"; mute.setAttribute("aria-pressed", String(off)); frame.classList.toggle("is-muted", off); });
  full.addEventListener("click", () => {
    if (document.fullscreenElement === frame) document.exitFullscreen();
    else if (frame.requestFullscreen) frame.requestFullscreen().catch(() => {});
  });
  show(); level();
});
</script>
