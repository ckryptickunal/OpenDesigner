<script>
document.querySelectorAll(".odl-filter-bar").forEach((root) => {
  if (root.dataset.odlReady) return; root.dataset.odlReady = "1";
  const count = root.querySelector(".odl-count strong");
  root.querySelectorAll(".odl-x").forEach((x) => x.addEventListener("click", () => {
    const wrap = x.closest(".odl-active"), chip = wrap.querySelector(".odl-chip"), plus = root.querySelector(".odl-filters > .odl-chip svg").cloneNode(true);

});
