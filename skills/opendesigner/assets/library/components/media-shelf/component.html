<script>
document.querySelectorAll(".odl-media-shelf").forEach((root) => {
  if (root.dataset.odlReady) return; // wire once, even if the file is pasted twice
  root.dataset.odlReady = "1";
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  root.querySelectorAll(".odl-shelf").forEach((shelf) => {
    const list = shelf.querySelector("ul"), prev = shelf.querySelector(".odl-prev"), next = shelf.querySelector(".odl-next");
    const sync = () => {
      prev.disabled = list.scrollLeft <= 2;
      next.disabled = list.scrollLeft + list.clientWidth >= list.scrollWidth - 2;
    };
    const go = (dir) => list.scrollBy({ left: dir * list.clientWidth * 0.9, behavior: still.matches ? "auto" : "smooth" });
    prev.addEventListener("click", () => go(-1));
    next.addEventListener("click", () => go(1));
    list.addEventListener("scroll", sync, { passive: true });
    sync();
  });
});
</script>
