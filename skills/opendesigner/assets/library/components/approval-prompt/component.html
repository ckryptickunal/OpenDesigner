<style>

.odl-approval-prompt .odl-cancel { min-block-size: max(var(--ds-size-control-lg), var(--ds-size-target-min), 2.75rem); border: var(--ds-border-width-default) solid var(--ds-color-border-default);

/* Phone: the two buttons share the row, each half; a long label wraps inside its own button. */
@container (max-width: 26rem) {

  .odl-approval-prompt dl { padding: var(--ds-space-inset-md); }

  .odl-approval-prompt button { flex: 1 1 auto; }

/* Disabled or still loading: quiet but readable (AA), never the faint disabled pair. */

@media (prefers-reduced-motion: reduce) { .odl-approval-prompt, .odl-approval-prompt *, .odl-approval-prompt *::before { transition: none !important; animation: none !important; } }
