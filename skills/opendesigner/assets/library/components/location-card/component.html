<style>
.odl-location-card { box-sizing: border-box; inline-size: 100%; max-inline-size: 30rem; margin-inline: auto; container-type: inline-size; overflow: hidden; background: var(--ds-color-surface-raised); color: var(--ds-color-text-primary);
  border: var(--ds-border-width-default) solid var(--ds-color-border-subtle); border-radius: var(--ds-radius-container); box-shadow: var(--ds-elevation-raised); font: var(--ds-text-body-md); text-wrap: pretty; }
.odl-location-card *, .odl-location-card *::before { box-sizing: border-box; }
.odl-location-card svg { flex: none; }
/* The drawn placeholder: blocks and streets in the system's neutral colours, a pin in the middle. No map tiles. */
.odl-location-card .odl-map { position: relative; display: grid; place-items: center; aspect-ratio: 12 / 5; overflow: hidden; background: var(--ds-color-surface-sunken);
  border-block-end: var(--ds-border-width-default) solid var(--ds-color-border-subtle); }
.odl-location-card .odl-streets { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; }
.odl-location-card .odl-block { fill: var(--ds-color-bg-neutral-subtle); }
.odl-location-card .odl-block.is-soft { fill: var(--ds-color-bg-neutral-subtle-hover); }
.odl-location-card .odl-avenue { fill: none; stroke: var(--ds-color-surface-raised); stroke-width: 14; stroke-linecap: round; }
.odl-location-card .odl-pin { position: relative; display: grid; place-items: center; inline-size: var(--ds-size-control-lg); block-size: var(--ds-size-control-lg); border-radius: var(--ds-radius-full);
  background: var(--ds-color-surface-raised); color: var(--ds-color-icon-accent); box-shadow: var(--ds-elevation-floating); }
.odl-location-card .odl-pin svg { inline-size: var(--ds-size-icon-md); block-size: var(--ds-size-icon-md); fill: none; stroke: currentColor; stroke-width: var(--ds-icon-stroke-lg); }
.odl-location-card .odl-body { display: grid; gap: var(--ds-space-stack-lg); padding: var(--ds-space-inset-xl); }
.odl-location-card .odl-place { display: grid; gap: var(--ds-space-stack-xs); }
.odl-location-card h3 { margin: 0; font: var(--ds-text-title-md); overflow-wrap: anywhere; text-wrap: balance; }
.odl-location-card address { display: grid; font-style: normal; color: var(--ds-color-text-secondary); overflow-wrap: anywhere; }
.odl-location-card .odl-facts { display: grid; gap: var(--ds-space-stack-sm); margin: 0; padding: 0; list-style: none; }
.odl-location-card .odl-facts:not(:has(li)) { display: none; }
.odl-location-card .odl-facts li { display: flex; align-items: flex-start; gap: var(--ds-space-inline-md); overflow-wrap: anywhere; }
.odl-location-card .odl-facts svg { inline-size: var(--ds-size-icon-sm); block-size: var(--ds-size-icon-sm); margin-block-start: calc((1lh - var(--ds-size-icon-sm)) / 2); fill: none; stroke: currentColor;
  stroke-width: var(--ds-icon-stroke-md); color: var(--ds-color-icon-subtle); }
.odl-location-card button { display: inline-flex; align-items: center; justify-content: center; gap: var(--ds-space-inline-sm); justify-self: start; max-inline-size: 100%;
  min-block-size: max(var(--ds-size-control-md), var(--ds-size-target-min)); padding: var(--ds-space-inset-xs) var(--ds-space-inset-lg); border-radius: var(--ds-radius-control);
  border: var(--ds-border-width-default) solid transparent; background: var(--ds-color-bg-action-primary); color: var(--ds-color-text-on-action);
  font: var(--ds-text-label-lg); font-weight: var(--ds-font-weight-label); text-align: center; overflow-wrap: anywhere; cursor: pointer;
  transition: background-color var(--ds-motion-duration-short) var(--ds-motion-easing-standard); }
.odl-location-card button:hover { background: var(--ds-color-bg-action-primary-hover); }
.odl-location-card button svg { inline-size: var(--ds-size-icon-sm); block-size: var(--ds-size-icon-sm); fill: none; stroke: currentColor; stroke-width: var(--ds-icon-stroke-md); }
.odl-location-card button:focus-visible { outline: var(--ds-focus-ring-width) solid var(--ds-color-border-focus); outline-offset: var(--ds-focus-ring-offset); }
@container (max-width: 26rem) {
  .odl-location-card .odl-map { aspect-ratio: 2 / 1; }
  .odl-location-card .odl-body { padding: var(--ds-space-inset-lg); }
  .odl-location-card button { justify-self: stretch; }
}
@media (prefers-reduced-motion: reduce) { .odl-location-card, .odl-location-card *, .odl-location-card *::before { transition: none !important; animation: none !important; } }
</style>
