<style>

<script>
document.querySelectorAll(".odl-bar-chart").forEach((root) => {
  const chart = root.querySelector(".odl-chart"), cols = root.querySelector(".odl-cols");
  if (!chart || !cols) return;
  const items = [...cols.querySelectorAll(":scope > .odl-col")].filter((b) => !b.hasAttribute("data-od-template"));
  const key = root.querySelector(".odl-card").textContent.replace(/\s+/g, " ").trim();
  if (!items.length || root.dataset.odlKey === key) return; // drawn from these numbers already; new numbers redraw
  root.dataset.odlKey = key;
  const lang = root.closest("[lang]")?.getAttribute("lang") || undefined;
  const dec = (new Intl.NumberFormat(lang).formatToParts(1.5).find((p) => p.type === "decimal") || { value: "." }).value;
  const num = (t) => { t = (t || "").trim(); if (!/\d/.test(t)) return null;
    const n = Number(t.split(dec).map((x) => x.replace(/[^\d-]/g, "")).join(".")); return Number.isFinite(n) ? n : null; };
  const cur = (root.querySelector('[data-od-slot="currency"]')?.textContent || "").trim();
  const money = (v, whole) => {
    const o = { minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 };
    if (/^[A-Z]{3}$/.test(cur)) try { return new Intl.NumberFormat(lang, { style: "currency", currency: cur, ...o }).format(v); } catch (e) { /* unknown code: plain number below */ }
    return (cur && cur.length < 3 ? cur : "") + new Intl.NumberFormat(lang, o).format(v);
  };
  const symbol = money(0, true).replace(/[\d\s.,]/g, "");
  const short = (v) => (v === 0 ? money(0, true) : symbol + (v >= 1e6 ? +(v / 1e6).toFixed(1) + "M" : v >= 1e3 ? +(v / 1e3).toFixed(1) + "k" : v));
  const val = (row) => { const i = row && row.querySelector("i"); return row ? num(row.textContent.slice(i ? i.textContent.length : 0)) : null; };

  // each month's numbers, read from what is on screen
  const months = items.map((b) => {
    const rows = [...b.querySelectorAll(".odl-tip > span")];
    const fc = rows.length >= 3 ? val(rows[1]) : null;
    return { b, rows, label: (b.querySelector(".odl-tip b")?.textContent || "").trim(), spent: val(rows[0]), fc, short: (b.querySelector(".odl-short")?.textContent || "").trim() };
  });
  const budget = num(root.querySelector('[data-od-slot="budget"]')?.textContent);
  const top = Math.max(0, budget || 0, ...months.map((m) => Math.max(m.spent || 0, m.fc || 0)));
  let axis = num(root.querySelector('[data-od-slot="axis_max"]')?.textContent);
  if (!axis || axis < top) { // four even steps of 1, 2, 2.5 or 5 times a power of ten
    const raw = (top || 1) / 4, p = 10 ** Math.floor(Math.log10(raw));
    axis = 4 * p * ([1, 2, 2.5, 5, 10].find((m) => m * p >= raw) || 10);
  }
  chart.style.setProperty("--n", months.length);
  root.querySelectorAll(".odl-axis span").forEach((s, i, all) => { s.textContent = short((axis * i) / (all.length - 1)); });
  const line = root.querySelector(".odl-budget"), bslot = root.querySelector('[data-od-slot="budget"]');
  if (line && budget !== null) { line.style.insetBlockEnd = (budget / axis) * 100 + "%"; if (bslot) bslot.textContent = money(budget, budget % 1 === 0); }

  const pct = (v) => +((v / axis) * 100).toFixed(2);
  const put = (row, word, v) => { const i = document.createElement("i"); i.textContent = word; row.replaceChildren(i, document.createTextNode(money(v))); };
  months.forEach((m) => {
    if (m.spent === null) return;
    const now = m.fc !== null, end = now ? m.fc : m.spent;
    m.b.classList.toggle("is-current", now);
    m.b.style.setProperty("--v", pct(end));
    const act = m.b.querySelector(".odl-actual");
    if (act) { if (now) act.style.setProperty("--a", +((m.spent / m.fc) * 100).toFixed(2)); else act.style.removeProperty("--a"); }
    put(m.rows[0], now ? "So far" : "Spent", m.spent);
    if (now) put(m.rows[1], "Forecast", m.fc);
    const diff = m.rows[m.rows.length - 1];
    let says = "";
    if (budget === null && diff && m.rows.length > 1 && !diff.textContent.trim()) diff.hidden = true; // no budget: no over or under row
    if (budget !== null && diff && m.rows.length > 1) {
      const d = end - budget;
      put(diff, d > 0 ? "Over budget" : "Under budget", Math.abs(d));
      says = `, ${money(Math.abs(d))} ${d > 0 ? "over" : "under"} budget`;
    }
    m.b.setAttribute("aria-label", now ? `${m.label}, in progress: ${money(m.spent)} so far, forecast ${money(m.fc)}${says}`
      : `${m.label}: spent ${money(m.spent)}${says}`);
  });
  // the short names under the bars
  const x = root.querySelector(".odl-x");
  if (x && months.every((m) => m.short)) x.replaceChildren(...months.map((m) => { const li = document.createElement("li"); li.textContent = m.short; if (m.fc !== null) li.className = "is-current"; return li; }));
});
</script>
