<section class="odl-page-error" aria-label="Something went wrong">
  <span class="odl-art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg></span>

  <h2 data-od-slot="title">Something went wrong on our side</h2>
  <p class="odl-lead" data-od-slot="message">This page didn't load, but your work is saved. Try again in a moment. If it keeps happening, send us the code below.</p>

  <div class="odl-acts"><button type="button" class="odl-btn" data-od-action="retry"><svg class="odl-idle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg><svg class="odl-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Try again</button><a class="odl-btn is-text" href="#" data-od-action="support">Contact support</a></div>

<script>
document.querySelectorAll(".odl-page-error").forEach(function (root) {
  if (root.hasAttribute("data-odl-wired")) return;
  root.setAttribute("data-odl-wired", "");
  var retry = root.querySelector("[data-od-action='retry']"), copy = root.querySelector("[data-od-action='copy']"), live = root.querySelector(".odl-live"), code = root.querySelector(".odl-ref code");
  retry.addEventListener("click", function () {
    if (retry.getAttribute("aria-disabled") === "true") return;
    retry.setAttribute("aria-disabled", "true");
    retry.classList.add("is-busy");
    live.textContent = "Trying again…";
    setTimeout(function () {  // demo only: in an app, reload the request and keep this page only if it fails again
      retry.removeAttribute("aria-disabled");
      retry.classList.remove("is-busy");
      live.textContent = "Still not working. Your work is saved; try again in a few minutes.";
    }, 1400);
  });
  copy.addEventListener("click", function () {
    var done = function () { live.textContent = "Reference code copied."; };
    if (navigator.clipboard) navigator.clipboard.writeText(code.textContent).then(done, function () { live.textContent = "Select the code to copy it."; });
    else live.textContent = "Select the code to copy it.";
  });
});
</script>
