<style>
.odl-rewards-card { box-sizing: border-box; inline-size: 100%; max-inline-size: 26rem; margin-inline: auto; container-type: inline-size; color: var(--ds-color-text-primary); font: var(--ds-text-body-md); text-wrap: pretty; }
.odl-rewards-card *, .odl-rewards-card *::before, .odl-rewards-card *::after { box-sizing: border-box; }
.odl-rewards-card .odl-wrap { --odl-tap: var(--ds-size-target-touch); display: grid; gap: var(--ds-space-stack-lg); }
/* The card itself: a deep gradient from the accent ramp, soft rings for texture. */
.odl-rewards-card .odl-face { position: relative; display: grid; gap: var(--ds-space-stack-lg); padding: var(--ds-space-inset-lg); overflow: hidden; border-radius: var(--ds-radius-container); box-shadow: var(--ds-elevation-floating);
  background: radial-gradient(circle at 110% -10%, var(--ds-color-accent-dark-9) 0 30%, transparent 30.5%), radial-gradient(circle at 110% -10%, var(--ds-color-accent-dark-8) 0 46%, transparent 46.5%),
    linear-gradient(150deg, var(--ds-color-accent-dark-7), var(--ds-color-accent-dark-3)); color: var(--ds-color-white); }
.odl-rewards-card .odl-brand { display: flex; align-items: center; justify-content: space-between; gap: var(--ds-space-inline-sm); }
.odl-rewards-card .odl-brand p { display: flex; align-items: center; gap: var(--ds-space-inline-xs); margin: 0; font: var(--ds-text-label-lg); }
.odl-rewards-card .odl-brand svg { inline-size: var(--ds-size-icon-lg); block-size: var(--ds-size-icon-lg); }
.odl-rewards-card .odl-tier { display: inline-flex; align-items: center; gap: var(--ds-space-4); padding: var(--ds-space-2) var(--ds-space-8); border-radius: var(--ds-radius-control-sm);
  background: var(--ds-color-neutral-alpha-dark-4); color: var(--ds-color-white); font: var(--ds-text-label-sm); }
.odl-rewards-card .odl-pts { display: grid; gap: var(--ds-space-2); }
.odl-rewards-card .odl-pts p { margin: 0; }
.odl-rewards-card .odl-lbl { color: var(--ds-color-neutral-dark-11); font: var(--ds-text-label-md); }
.odl-rewards-card .odl-big { font: var(--ds-text-numeric-lg); font-variant-numeric: tabular-nums; }
.odl-rewards-card .odl-big small { font: var(--ds-text-label-lg); color: var(--ds-color-neutral-dark-11); }
.odl-rewards-card .odl-next { display: grid; gap: var(--ds-space-stack-xs); }
.odl-rewards-card .odl-next p { display: flex; justify-content: space-between; gap: var(--ds-space-inline-sm); margin: 0; font: var(--ds-text-body-sm); color: var(--ds-color-neutral-dark-11); }
.odl-rewards-card .odl-next b { color: var(--ds-color-white); font-weight: var(--ds-font-weight-label); }
.odl-rewards-card .odl-track { position: relative; block-size: var(--ds-space-8); border-radius: var(--ds-radius-full); background: var(--ds-color-neutral-alpha-dark-4); }
.odl-rewards-card .odl-track i { position: absolute; inset-block: 0; inset-inline-start: 0; inline-size: 62%; border-radius: var(--ds-radius-full); background: linear-gradient(90deg, var(--ds-color-warning-light-6), var(--ds-color-warning-light-8)); }
/* The code: drawn with tokens on a light panel so it scans in dark mode too. */
.odl-rewards-card .odl-code { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: var(--ds-space-inline-md); padding: var(--ds-space-inset-sm); border-radius: var(--ds-radius-nested);
  background: var(--ds-color-white); color: var(--ds-color-black); }
.odl-rewards-card .odl-qr { inline-size: calc(var(--ds-size-control-lg) * 2.3); aspect-ratio: 1; }
.odl-rewards-card .odl-qr svg { display: block; inline-size: 100%; block-size: 100%; shape-rendering: crispEdges; }
.odl-rewards-card .odl-qr path, .odl-rewards-card .odl-qr .odl-eye { fill: var(--ds-color-black); }
.odl-rewards-card .odl-qr .odl-eye-in { fill: var(--ds-color-white); }
.odl-rewards-card .odl-code p { margin: 0; }
.odl-rewards-card .odl-code b { display: block; font: var(--ds-text-label-lg); }
.odl-rewards-card .odl-code span { display: block; color: var(--ds-color-neutral-light-11); font: var(--ds-text-body-sm); }
.odl-rewards-card .odl-num { margin-block-start: var(--ds-space-4); font: var(--ds-text-code-sm); letter-spacing: var(--ds-text-label-sm-tracking); color: var(--ds-color-neutral-light-12); }
/* Offers */
.odl-rewards-card h3 { margin: 0 0 var(--ds-space-stack-sm); font: var(--ds-text-title-sm); }
.odl-rewards-card ul { display: grid; gap: var(--ds-space-stack-sm); margin: 0; padding: 0; list-style: none; }
.odl-rewards-card li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--ds-space-inline-md); padding: var(--ds-space-inset-sm) var(--ds-space-inset-sm) var(--ds-space-inset-sm) var(--ds-space-inset-sm);
  border: var(--ds-border-width-default) solid var(--ds-color-border-subtle); border-radius: var(--ds-radius-container); background: var(--ds-color-surface-raised); }
.odl-rewards-card .odl-ic { display: grid; place-items: center; inline-size: var(--ds-size-control-lg); block-size: var(--ds-size-control-lg); border-radius: var(--ds-radius-nested); background: var(--ds-color-warning-light-3); color: var(--ds-color-warning-light-11); }
.odl-rewards-card .odl-ic.is-b { background: var(--ds-color-success-light-3); color: var(--ds-color-success-light-11); }
.odl-rewards-card .odl-ic svg { inline-size: var(--ds-size-icon-lg); block-size: var(--ds-size-icon-lg); }
.odl-rewards-card .odl-offer p { margin: 0; }
.odl-rewards-card .odl-offer b { display: block; font: var(--ds-text-label-lg); }
.odl-rewards-card .odl-offer span { color: var(--ds-color-text-secondary); font: var(--ds-text-body-sm); }
.odl-rewards-card .odl-act { display: inline-flex; align-items: center; justify-content: center; gap: var(--ds-space-4); min-block-size: var(--odl-tap); padding: 0 var(--ds-space-inset-sm); border: 0; border-radius: var(--ds-radius-control);
  background: var(--ds-color-bg-action-primary); color: var(--ds-color-text-on-action); font: var(--ds-text-label-md); white-space: nowrap; cursor: pointer;
  transition: background-color var(--ds-motion-duration-short) var(--ds-motion-easing-standard); }
.odl-rewards-card .odl-act:hover { background: var(--ds-color-bg-action-primary-hover); }
.odl-rewards-card .odl-act svg { display: none; inline-size: var(--ds-size-icon-sm); block-size: var(--ds-size-icon-sm); }
.odl-rewards-card .odl-act[aria-pressed="true"] { background: var(--ds-color-bg-success-subtle); color: var(--ds-color-text-success); }
.odl-rewards-card .odl-act[aria-pressed="true"] svg { display: block; }
.odl-rewards-card button:focus-visible { outline: var(--ds-focus-ring-width) solid var(--ds-color-border-focus); outline-offset: var(--ds-focus-ring-offset); }
.odl-rewards-card .odl-sr { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@container (max-width: 22rem) { .odl-rewards-card .odl-face { padding: var(--ds-space-inset-md); } .odl-rewards-card .odl-qr { inline-size: calc(var(--ds-size-control-lg) * 2); } }
/* Phone: the button goes under the offer text, so a title never wraps beside it. */
@container (max-width: 24rem) { .odl-rewards-card li { grid-template-columns: auto minmax(0, 1fr); row-gap: var(--ds-space-stack-sm); }
  .odl-rewards-card .odl-ic { grid-row: span 2; }
  .odl-rewards-card .odl-act { grid-column: 2; justify-self: start; } }
@media (prefers-reduced-motion: reduce) { .odl-rewards-card, .odl-rewards-card *, .odl-rewards-card *::before { transition: none !important; animation: none !important; } }
</style>

<script>
document.querySelectorAll(".odl-rewards-card").forEach((root) => {
  if (root.dataset.odlReady) return; // wire once, even if the file is pasted twice
  root.dataset.odlReady = "1";
  root.querySelectorAll(".odl-act").forEach((b) => b.addEventListener("click", () => {
    const on = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", String(on)); b.querySelector(".odl-l").textContent = on ? "Active" : "Activate";
  }));
});
</script>
