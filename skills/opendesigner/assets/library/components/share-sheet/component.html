  const copy = root.querySelector(".odl-copy"), copyLabel = copy.querySelector(".odl-copy-label"), url = "https://" + copy.querySelector(".odl-url").textContent;
  let t = null;
  const say = (text) => { toast.textContent = text; toast.classList.add("is-on"); clearTimeout(t); t = setTimeout(() => toast.classList.remove("is-on"), 2400); };
  const names = () => [...boxes].filter((b) => b.checked).map((b) => b.closest("label").querySelector("span:last-child").textContent);
  boxes.forEach((b) => b.addEventListener("change", () => {
    const n = names();
    sendBtn.textContent = n.length > 1 ? `Send to ${n.length}` : "Send";
  }));
  root.querySelector(".odl-send").addEventListener("submit", (e) => {
    e.preventDefault();
    const n = names();
    say(n.length > 1 ? `Sent to ${n.length} people` : `Sent to ${n[0]}`);
    boxes.forEach((b) => { b.checked = false; }); e.currentTarget.querySelector("input").value = ""; sendBtn.textContent = "Send";
  });
  // Copy link confirms in place only when the copy worked; otherwise it says how to copy by hand.
  copy.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(url);
      copy.classList.add("is-copied"); copyLabel.textContent = "Link copied"; say("Link copied");
      setTimeout(() => { copy.classList.remove("is-copied"); copyLabel.textContent = "Copy link"; }, 2400);
    } catch (err) {
      say("Copying is blocked here: select the link and copy it");
    }
  });
});
</script>
