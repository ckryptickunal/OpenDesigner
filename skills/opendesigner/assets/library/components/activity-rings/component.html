<script>
document.querySelectorAll(".odl-activity-rings").forEach((root) => {
  if (root.dataset.odlReady) return; // wire once, even if the file is pasted twice
  root.dataset.odlReady = "1";
  // [move, exercise, stand] for Friday to today; goals are 560 kcal, 30 min and 12 h
  const days = [[580, 34, 10, "Friday, 17 Oct"], [602, 41, 12, "Saturday, 18 Oct"], [258, 6, 7, "Sunday, 19 Oct"], [493, 30, 11, "Monday, 20 Oct"],
    [611, 45, 12, "Tuesday, 21 Oct"], [375, 15, 10, "Wednesday, 22 Oct"], [412, 24, 9, "Thursday, 23 Oct"]];
  const goals = [560, 30, 12], units = ["calories", "minutes", "hours"], names = ["Move", "Exercise", "Stand"];
  const arcs = root.querySelectorAll(".odl-rings .odl-arc"), values = root.querySelectorAll("dd .odl-v");
  const art = root.querySelector(".odl-rings"), date = root.querySelector(".odl-date"), note = root.querySelector(".odl-nt");
  const show = (i) => {
    const d = days[i];
    d.slice(0, 3).forEach((v, k) => { arcs[k].setAttribute("stroke-dasharray", `${Math.min(100, (v / goals[k]) * 100).toFixed(1)} 100`); values[k].textContent = String(v); });
    date.textContent = d[3];
    art.setAttribute("aria-label", d.slice(0, 3).map((v, k) => `${names[k]} ${v} of ${goals[k]} ${units[k]}`).join(", "));
    const left = goals[0] - d[0];
    note.textContent = left > 0 ? (i === 6 ? `${left} kcal to close your Move ring. A 25-minute walk would do it.` : `Move ring ${left} kcal short.`) : "All of your Move goal, and then some.";
    root.querySelectorAll(".odl-week button").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.day) === i)));
  };
  root.querySelectorAll(".odl-week button").forEach((b) => b.addEventListener("click", () => show(Number(b.dataset.day))));
});
</script>
