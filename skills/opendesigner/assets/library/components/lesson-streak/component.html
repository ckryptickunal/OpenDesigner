<style>
.odl-lesson-streak { box-sizing: border-box; inline-size: 100%; max-inline-size: 28rem; margin-inline: auto; container-type: inline-size; color: var(--ds-color-text-primary); font: var(--ds-text-body-md); text-wrap: pretty; }
.odl-lesson-streak *, .odl-lesson-streak *::before, .odl-lesson-streak *::after { box-sizing: border-box; }
.odl-lesson-streak p, .odl-lesson-streak h3 { margin: 0; }
.odl-lesson-streak .odl-card { --pad: var(--ds-space-inset-lg); display: grid; gap: var(--ds-space-stack-lg); padding: var(--pad); background: var(--ds-color-surface-raised);
  border: var(--ds-border-width-default) solid var(--ds-color-border-subtle); border-radius: var(--ds-radius-container); box-shadow: var(--ds-elevation-raised); }
/* Stats: streak, XP and the daily goal ring */
.odl-lesson-streak .odl-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--ds-space-inline-xs); margin: 0; padding: 0; list-style: none; }
.odl-lesson-streak .odl-stats li { display: flex; align-items: center; justify-content: center; gap: var(--ds-space-inline-xs); min-block-size: var(--ds-size-control-md);
  padding: 0 var(--ds-space-inset-sm); border-radius: max(var(--ds-radius-4), calc(var(--ds-radius-container) - var(--pad))); background: var(--ds-color-bg-neutral-subtle); font: var(--ds-text-label-lg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.odl-lesson-streak .odl-stats svg { flex: none; inline-size: var(--ds-size-icon-lg); block-size: var(--ds-size-icon-lg); }
.odl-lesson-streak .odl-flame { color: var(--ds-color-warning-light-9); }
.odl-lesson-streak .odl-flame .odl-core { color: var(--ds-color-warning-light-6); }
.odl-lesson-streak .odl-gem { color: var(--ds-color-info-light-9); }
.odl-lesson-streak .odl-goal circle { fill: none; stroke-width: 4; }
.odl-lesson-streak .odl-goal .odl-t { stroke: var(--ds-color-border-default); }
.odl-lesson-streak .odl-goal .odl-a { stroke: var(--ds-color-bg-success-bold); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.odl-lesson-streak .odl-stats small { color: var(--ds-color-text-secondary); font: var(--ds-text-label-sm); }
/* Unit banner */
.odl-lesson-streak .odl-unit { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--ds-space-inline-sm); padding: var(--ds-space-inset-md);
  border-radius: var(--ds-radius-nested); background: var(--ds-color-bg-accent-bold); color: var(--ds-color-text-on-accent); }
.odl-lesson-streak .odl-unit p { opacity: 0.85; font: var(--ds-text-label-md); }
.odl-lesson-streak .odl-unit h3 { font: var(--ds-text-title-md); }
.odl-lesson-streak .odl-guide { display: grid; place-items: center; inline-size: var(--ds-size-target-touch); block-size: var(--ds-size-target-touch); padding: 0; border: var(--ds-border-width-emphasis) solid var(--ds-color-neutral-alpha-dark-6);
  border-radius: var(--ds-radius-nested); background: transparent; color: inherit; cursor: pointer; transition: background-color var(--ds-motion-duration-short) var(--ds-motion-easing-standard); }
.odl-lesson-streak .odl-guide:hover { background: var(--ds-color-neutral-alpha-dark-3); }
.odl-lesson-streak .odl-guide svg { inline-size: var(--ds-size-icon-md); block-size: var(--ds-size-icon-md); }
/* The path: nodes that zig-zag down the middle */
.odl-lesson-streak .odl-path { display: grid; justify-items: center; gap: var(--ds-space-stack-md); margin: 0; padding: var(--ds-space-stack-sm) 0 var(--ds-space-stack-md); list-style: none; --step: var(--ds-space-40); }
.odl-lesson-streak .odl-path > li { display: grid; justify-items: center; gap: var(--ds-space-stack-sm); transform: translateX(calc(var(--x, 0) * var(--step))); }
.odl-lesson-streak .odl-node { --face: var(--ds-color-bg-neutral-subtle); --lip: var(--ds-color-border-strong); --ink: var(--ds-color-text-tertiary);
  display: grid; place-items: center; inline-size: calc(var(--ds-size-control-lg) * 1.2); aspect-ratio: 1; padding: 0; border: 0; border-radius: var(--ds-radius-full);
  background: var(--face); color: var(--ink); cursor: pointer;
  transition: transform var(--ds-motion-duration-short) var(--ds-motion-easing-standard), box-shadow var(--ds-motion-duration-short) var(--ds-motion-easing-standard); }
.odl-lesson-streak .odl-node svg { inline-size: var(--ds-size-icon-lg); block-size: var(--ds-size-icon-lg); }
.odl-lesson-streak .odl-node:active:not(:disabled) { transform: scale(0.96); }
.odl-lesson-streak .is-done .odl-node { --face: var(--ds-color-bg-success-bold); --lip: var(--ds-color-success-light-11); --ink: var(--ds-color-text-on-success); }
.odl-lesson-streak .is-now .odl-node { --face: var(--ds-color-bg-accent-bold); --lip: var(--ds-color-accent-light-11); --ink: var(--ds-color-text-on-accent); }
.odl-lesson-streak .odl-node:disabled { cursor: not-allowed; }
.odl-lesson-streak .odl-node[aria-pressed="true"] { outline: var(--ds-border-width-selected) solid var(--face); outline-offset: var(--ds-space-6); }
.odl-lesson-streak .is-now .odl-node { position: relative; inline-size: calc(var(--ds-size-control-lg) * 1.4); }
.odl-lesson-streak .is-now .odl-node svg { inline-size: calc(var(--ds-size-icon-lg) * 1.3); block-size: calc(var(--ds-size-icon-lg) * 1.3); }
.odl-lesson-streak button:focus-visible { outline: var(--ds-focus-ring-width) solid var(--ds-color-border-focus); outline-offset: var(--ds-focus-ring-offset); }
.odl-lesson-streak .odl-node:focus-visible { outline-offset: var(--ds-space-8); }
/* The pop-over card for the chosen lesson; it moves under whichever node is chosen */
.odl-lesson-streak .odl-pop { position: relative; display: grid; gap: var(--ds-space-stack-sm); inline-size: min(calc(100cqi - var(--ds-space-8)), 18rem); margin-block-start: var(--ds-space-8);
  padding: var(--ds-space-inset-md); border-radius: var(--ds-radius-container); background: var(--ds-color-surface-raised); border: var(--ds-border-width-emphasis) solid var(--ds-color-border-default);
  box-shadow: var(--ds-elevation-floating); text-align: center; transform: translateX(calc(var(--x, 0) * -1 * var(--step))); }
.odl-lesson-streak .odl-pop::before { content: ""; position: absolute; inset-block-start: 0; inset-inline-start: calc(50% + var(--x, 0) * var(--step)); inline-size: var(--ds-space-16); aspect-ratio: 1;
  background: inherit; border-block-start: inherit; border-inline-start: inherit; transform: translate(-50%, -60%) rotate(45deg); }
.odl-lesson-streak .odl-pop b { font: var(--ds-text-title-sm); }
.odl-lesson-streak .odl-pop p { color: var(--ds-color-text-secondary); font: var(--ds-text-body-sm); }
.odl-lesson-streak .odl-start { min-block-size: max(var(--ds-size-control-md), var(--ds-size-target-touch)); border: 0; border-radius: var(--ds-radius-control);
  background: var(--ds-color-bg-action-primary); color: var(--ds-color-text-on-action); font: var(--ds-text-label-lg); cursor: pointer; transition: background-color var(--ds-motion-duration-short) var(--ds-motion-easing-standard); }
.odl-lesson-streak .odl-start:hover { background: var(--ds-color-bg-action-primary-hover); }
.odl-lesson-streak .odl-sr { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@container (max-width: 22rem) {
  .odl-lesson-streak .odl-card { --pad: var(--ds-space-inset-md); }
  .odl-lesson-streak .odl-stats li { padding: 0 var(--ds-space-inset-xs); }
  .odl-lesson-streak .odl-path { --step: var(--ds-space-32); }
}
@media (prefers-reduced-motion: reduce) { .odl-lesson-streak, .odl-lesson-streak *, .odl-lesson-streak *::before { transition: none !important; animation: none !important; } }
</style>

<script>
document.querySelectorAll(".odl-lesson-streak").forEach((root) => {
  if (root.dataset.odlReady) return; // wire once, even if the file is pasted twice
  root.dataset.odlReady = "1";
  const pop = root.querySelector(".odl-pop"), title = pop.querySelector(".odl-pt"), sub = pop.querySelector(".odl-ps"), start = pop.querySelector(".odl-start");
  root.querySelectorAll(".odl-node:not(:disabled)").forEach((node) => node.addEventListener("click", () => {
    root.querySelectorAll(".odl-node").forEach((n) => n.setAttribute("aria-pressed", String(n === node)));
    node.parentElement.appendChild(pop); // the card follows the chosen lesson
    title.textContent = node.dataset.title; sub.textContent = node.dataset.sub; start.textContent = node.dataset.cta;
  }));
});
</script>
