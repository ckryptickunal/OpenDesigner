<section class="odl-toast-undo odl-card" aria-label="Inbox">
  <ul data-od-list="messages"><li data-od-item><p><strong class="odl-name" data-od-slot="from">Quorbin Studio</strong><span data-od-slot="subject">Revised quote for the spring catalogue</span></p><button type="button" class="odl-btn is-quiet" data-od-action="archive" data-od-effect="change">Archive</button></li><li data-od-item><p><strong class="odl-name" data-od-slot="from">Oren Balliwick</strong><span data-od-slot="subject">Re: approval for invoice 2041</span></p><button type="button" class="odl-btn is-quiet" data-od-action="archive" data-od-effect="change">Archive</button></li><li data-od-item><p><strong class="odl-name" data-od-slot="from">Tessaline Foods</strong><span data-od-slot="subject">Your November order is on its way</span></p><button type="button" class="odl-btn is-quiet" data-od-action="archive" data-od-effect="change">Archive</button></li></ul>
  <div class="odl-toast" role="group" aria-label="Archived" hidden><p data-od-slot="message">Archived</p><button type="button" class="odl-btn" data-od-action="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>Undo</button><button type="button" class="odl-close" aria-label="Close" data-od-action="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
  <p class="odl-sr odl-live" role="status"></p>
</section>
<script>
document.querySelectorAll(".odl-toast-undo").forEach(function (root) {
  if (root.hasAttribute("data-odl-wired")) return;
  root.setAttribute("data-odl-wired", "");
  var list = root.querySelector("ul"), toast = root.querySelector(".odl-toast"), msg = toast.querySelector("[data-od-slot='message']"), last = null;
  function hide() { toast.hidden = true; last = null; }
  root.addEventListener("click", function (e) {
    var arch = e.target.closest("[data-od-action='archive']"), undo = e.target.closest("[data-od-action='undo']"), close = e.target.closest("[data-od-action='close']");
    if (arch) {
      var li = arch.closest("li");
      last = { li: li, next: li.nextElementSibling };
      li.hidden = true;  // hidden, not deleted: Undo puts it back where it was
      msg.textContent = "Archived “" + li.querySelector(".odl-name").textContent + "”";
      toast.hidden = false;
      root.querySelector(".odl-live").textContent = msg.textContent + ". Undo puts it back.";  // a live region that is always there, so it's read
      toast.querySelector("[data-od-action='undo']").focus();
    }
    if (undo && last) { last.li.hidden = false; var b = last.li.querySelector("button"); hide(); b.focus(); root.querySelector(".odl-live").textContent = "Restored."; }
    if (close) { var first = list.querySelector("li:not([hidden]) button"); hide(); if (first) first.focus(); }
  });
  toast.addEventListener("keydown", function (e) { if (e.key === "Escape") toast.querySelector("[data-od-action='close']").click(); });
});
</script>
