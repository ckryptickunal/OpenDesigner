  border: var(--ds-border-width-default) solid var(--ds-color-border-default); border-radius: var(--ds-radius-full); background: var(--ds-color-surface-raised); font: var(--ds-text-label-md); }
.odl-empty-filtered .odl-chips button { display: grid; place-items: center; inline-size: var(--ds-size-target-min); block-size: var(--ds-size-target-min); padding: 0; border: 0; border-radius: var(--ds-radius-full); background: transparent; color: var(--ds-color-icon-subtle); cursor: pointer; }

<section class="odl-empty-filtered" aria-label="Invoices">
  <span class="odl-art" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.013 3H2l8 9.46V19l4 2v-8.54l.9-1.055"/><path d="m22 3-5 5"/><path d="m17 3 5 5"/></svg></span>
  <h2 data-od-slot="title">No invoices match these filters</h2>
  <p class="odl-lead odl-hint" data-od-slot="message">Your filters hide all 46 invoices. Remove one, or clear them all.</p>
  <ul class="odl-chips" aria-label="Filters on" data-od-list="filters">
    <li data-od-item><span data-od-slot="label">Status: Overdue</span><button type="button" aria-label="Remove filter Status: Overdue" data-od-action="remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></li>
    <li data-od-item><span>Owner: Me</span><button type="button" aria-label="Remove filter Owner: Me" data-od-action="remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></li>
    <li data-od-item><span>Over $10,000</span><button type="button" aria-label="Remove filter Over $10,000" data-od-action="remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></li>
  </ul>
  <div class="odl-acts"><button type="button" class="odl-btn" data-od-action="clear">Clear all filters</button></div>
  <p class="odl-live" role="status"></p>
</section>
<script>
document.querySelectorAll(".odl-empty-filtered").forEach(function (root) {
  if (root.hasAttribute("data-odl-wired")) return;
  root.setAttribute("data-odl-wired", "");
  var live = root.querySelector(".odl-live"), chips = root.querySelector(".odl-chips");
  function left() { return chips.querySelectorAll("li").length; }
  root.addEventListener("click", function (e) {
    var x = e.target.closest("[data-od-action='remove']"), all = e.target.closest("[data-od-action='clear']");
    if (x) {
      var li = x.closest("li"), next = li.nextElementSibling || li.previousElementSibling;
      live.textContent = "Removed " + li.querySelector("span").textContent + ".";
      li.remove();
      (next ? next.querySelector("button") : root.querySelector("[data-od-action='clear']")).focus();
    }
    if (all) { chips.textContent = ""; live.textContent = "All filters cleared. Showing all 46 invoices."; }
    if (!left()) root.querySelector(".odl-hint").textContent = "No filters on. In an app, the full list shows here.";
  });
});
</script>
