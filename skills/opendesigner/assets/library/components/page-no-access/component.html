<script>
document.querySelectorAll(".odl-page-no-access").forEach(function (root) {
  if (root.hasAttribute("data-odl-wired")) return;
  root.setAttribute("data-odl-wired", "");
  var form = root.querySelector("form"), live = root.querySelector(".odl-live"), owner = root.querySelector("[data-od-slot='owner']");
  form.addEventListener("submit", function (e) {
    e.preventDefault();  // demo only: in an app, send the request, then show this
    form.hidden = true;
    live.textContent = "Request sent to " + owner.textContent + ". You'll get an email when they answer.";
