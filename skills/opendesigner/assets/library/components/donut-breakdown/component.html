<style>
.odl-donut-breakdown { box-sizing: border-box; inline-size: 100%; max-inline-size: 45rem; margin-inline: auto; container-type: inline-size; text-wrap: pretty; }
.odl-donut-breakdown *, .odl-donut-breakdown *::before { box-sizing: border-box; }
.odl-donut-breakdown .odl-card { display: grid; gap: var(--ds-space-stack-xl); padding: var(--ds-space-inset-xl); background: var(--ds-color-surface-raised); color: var(--ds-color-text-primary);
  border: var(--ds-border-width-default) solid var(--ds-color-border-subtle); border-radius: var(--ds-radius-container); box-shadow: var(--ds-elevation-raised); font: var(--ds-text-body-md); }
.odl-donut-breakdown .odl-head { display: grid; justify-items: start; gap: var(--ds-space-stack-xs); }
.odl-donut-breakdown h3 { margin: 0; font: var(--ds-text-title-md); }
.odl-donut-breakdown .odl-sub { margin: 0; color: var(--ds-color-text-secondary); font: var(--ds-text-label-md); font-variant-numeric: tabular-nums; }
.odl-donut-breakdown .odl-body { display: grid; gap: var(--ds-space-stack-xl); justify-items: center; }
.odl-donut-breakdown figure { position: relative; display: grid; place-items: center; inline-size: 100%; max-inline-size: 12.5rem; margin: 0; aspect-ratio: 1; }
.odl-donut-breakdown svg { grid-area: 1 / 1; inline-size: 100%; block-size: 100%; overflow: visible; }
.odl-donut-breakdown circle { fill: none; stroke-width: 15; transition: stroke-width var(--ds-motion-duration-short) var(--ds-motion-easing-standard), opacity var(--ds-motion-duration-short) var(--ds-motion-easing-standard); }
.odl-donut-breakdown .odl-s1 { stroke: var(--ds-color-bg-accent-bold); }
.odl-donut-breakdown .odl-s2 { stroke: var(--ds-color-text-primary); }
.odl-donut-breakdown .odl-s3 { stroke: var(--ds-color-bg-warning-bold); }
.odl-donut-breakdown .odl-s4 { stroke: var(--ds-color-border-strong); }
.odl-donut-breakdown .odl-total { grid-area: 1 / 1; display: grid; justify-items: center; gap: var(--ds-space-stack-xs); text-align: center; }
.odl-donut-breakdown .odl-total b { font: var(--ds-text-numeric-lg); font-variant-numeric: tabular-nums; }
.odl-donut-breakdown .odl-total span { color: var(--ds-color-text-secondary); font: var(--ds-text-label-md); }
.odl-donut-breakdown ul { inline-size: 100%; margin: 0; padding: 0; list-style: none; display: grid; font-variant-numeric: tabular-nums; }
.odl-donut-breakdown li { display: grid; grid-template-columns: var(--ds-space-12) minmax(0, 1fr) auto 5ch; align-items: center; column-gap: var(--ds-space-inline-md);
  min-block-size: max(var(--ds-size-control-lg), var(--ds-size-target-min)); padding: var(--ds-space-inset-xs) var(--ds-space-inset-sm); border-radius: var(--ds-radius-nested);
  transition: background-color var(--ds-motion-duration-short) var(--ds-motion-easing-standard); }
.odl-donut-breakdown ul { gap: var(--ds-space-2); }
.odl-donut-breakdown li:hover { background: var(--ds-color-bg-neutral-subtle); }
.odl-donut-breakdown .odl-sw { inline-size: var(--ds-space-12); block-size: var(--ds-space-12); border-radius: var(--ds-radius-full); }
.odl-donut-breakdown .odl-k1 { background: var(--ds-color-bg-accent-bold); }
.odl-donut-breakdown .odl-k2 { background: var(--ds-color-text-primary); }
.odl-donut-breakdown .odl-k3 { background: var(--ds-color-bg-warning-bold); }
.odl-donut-breakdown .odl-k4 { background: var(--ds-color-border-strong); }
.odl-donut-breakdown .odl-name { display: grid; gap: var(--ds-space-2); min-inline-size: 0; }
.odl-donut-breakdown .odl-name small { color: var(--ds-color-text-tertiary); font: var(--ds-text-label-md); }
.odl-donut-breakdown .odl-amt { text-align: end; }
.odl-donut-breakdown .odl-pct { color: var(--ds-color-text-secondary); font: var(--ds-text-label-md); text-align: end; }
.odl-donut-breakdown:has(li:hover) circle { opacity: 0.3; }
.odl-donut-breakdown:has(.odl-r1:hover) .odl-s1, .odl-donut-breakdown:has(.odl-r2:hover) .odl-s2,
.odl-donut-breakdown:has(.odl-r3:hover) .odl-s3, .odl-donut-breakdown:has(.odl-r4:hover) .odl-s4 { opacity: 1; stroke-width: 19; }
.odl-donut-breakdown .odl-foot { margin: 0; padding-block-start: var(--ds-space-stack-lg); border-block-start: var(--ds-border-width-default) solid var(--ds-color-border-subtle); color: var(--ds-color-text-secondary); font: var(--ds-text-label-md); }
.odl-donut-breakdown [hidden] { display: none !important; }
@container (min-width: 30rem) {
  .odl-donut-breakdown .odl-body { grid-template-columns: 12rem minmax(0, 1fr); align-items: center; gap: calc(var(--ds-space-inset-xl) * 1.5); }
}
@container (max-width: 26rem) {
  .odl-donut-breakdown .odl-card { padding: var(--ds-space-inset-lg); gap: var(--ds-space-stack-lg); }
  .odl-donut-breakdown figure { max-inline-size: 10.5rem; }
  .odl-donut-breakdown li { padding-inline: var(--ds-space-inset-xs); }
}
@media (prefers-reduced-motion: reduce) { .odl-donut-breakdown, .odl-donut-breakdown *, .odl-donut-breakdown *::before { transition: none !important; animation: none !important; } }
</style>
<section class="odl-donut-breakdown" aria-label="Usage by category" data-od-label="title">
  <div class="odl-card">
    <div class="odl-head">
      <h3 data-od-slot="title">Usage by category</h3>
      <p class="odl-sub" data-od-slot="period" data-od-optional>Oct 1 to Oct 14, 2026</p>
    </div>
    <div class="odl-body">
      <figure aria-hidden="true">
        <svg viewBox="0 0 120 120">
          <g transform="rotate(-90 60 60)">
            <circle class="odl-s1" cx="60" cy="60" r="48" pathLength="100" stroke-dasharray="55 45" stroke-dashoffset="0"/>
            <circle class="odl-s2" cx="60" cy="60" r="48" pathLength="100" stroke-dasharray="26.4 73.6" stroke-dashoffset="-55.8"/>
            <circle class="odl-s3" cx="60" cy="60" r="48" pathLength="100" stroke-dasharray="9.8 90.2" stroke-dashoffset="-83"/>
            <circle class="odl-s4" cx="60" cy="60" r="48" pathLength="100" stroke-dasharray="5.6 94.4" stroke-dashoffset="-93.6"/>
          </g>
        </svg>
        <div class="odl-total"><b data-od-slot="total">$6,932</b><span data-od-slot="total_caption" data-od-optional>usage to date</span></div>
      </figure>
      <ul aria-label="Usage to date, $6,932.38, by category" data-od-list="categories">
        <li class="odl-r1" data-od-item><span class="odl-sw odl-k1" aria-hidden="true"></span><span class="odl-name">GPU instances<small>1,842.5 GPU-h</small></span><span class="odl-amt">$3,869.25</span><span class="odl-pct">55.8%</span></li>
        <li class="odl-r2" data-od-item><span class="odl-sw odl-k2" aria-hidden="true"></span><span class="odl-name">CPU and batch<small>21,406 vCPU-h</small></span><span class="odl-amt">$1,882.37</span><span class="odl-pct">27.2%</span></li>
        <li class="odl-r3" data-od-item><span class="odl-sw odl-k3" aria-hidden="true"></span><span class="odl-name">Storage<small>48.2 TB-month</small></span><span class="odl-amt">$734.90</span><span class="odl-pct">10.6%</span></li>
        <li class="odl-r4" data-od-item><span class="odl-sw odl-k4" aria-hidden="true"></span><span class="odl-name">Networking<small>5.1 TB out</small></span><span class="odl-amt">$445.86</span><span class="odl-pct">6.4%</span></li>
        <li data-od-item data-od-template hidden><span class="odl-sw" aria-hidden="true"></span><span class="odl-name"><span data-od-slot="name"></span><small data-od-slot="note" data-od-optional></small></span><span class="odl-amt" data-od-slot="amount"></span><span class="odl-pct"><span data-od-slot="share"></span>%</span></li>
      </ul>
    </div>
    <p class="odl-foot" data-od-slot="foot" data-od-optional>Before the $1,000.00 included credit. GPU use is up 18% on September.</p>
  </div>
</section>
<script>
document.querySelectorAll(".odl-donut-breakdown").forEach((root) => {
  const g = root.querySelector("figure svg g"), list = root.querySelector("ul");
  if (!g || !list) return;
  const items = [...list.querySelectorAll(":scope > li")].filter((li) => !li.hasAttribute("data-od-template") && !li.classList.contains("od-empty")).slice(0, 4);
  const lang = root.closest("[lang]")?.getAttribute("lang") || undefined;
  const dec = (new Intl.NumberFormat(lang).formatToParts(1.5).find((p) => p.type === "decimal") || { value: "." }).value;
  const num = (t) => { t = (t || "").trim(); if (!/\d/.test(t)) return null;
    const n = Number(t.split(dec).map((x) => x.replace(/[^\d-]/g, "")).join(".")); return Number.isFinite(n) ? n : null; };
  const shares = items.map((li) => num(li.querySelector(".odl-pct")?.textContent));
  const key = items.map((li) => li.textContent.trim()).join("|");
  if (root.dataset.odlKey === key) return; // drawn from these shares already; new shares redraw
  root.dataset.odlKey = key;
  // colour classes by order, so a row and its segment always match
  items.forEach((li, i) => {
    li.classList.remove("odl-r1", "odl-r2", "odl-r3", "odl-r4");
    li.classList.add("odl-r" + (i + 1));
    const sw = li.querySelector(".odl-sw");
    if (sw) { sw.classList.remove("odl-k1", "odl-k2", "odl-k3", "odl-k4"); sw.classList.add("odl-k" + (i + 1)); }
  });
  // the ring: one arc per category, its length its share of the whole, with a small gap between arcs
  const sum = shares.reduce((a, v) => a + (v > 0 ? v : 0), 0);
  g.replaceChildren();
  let at = 0;
  if (sum > 0) shares.forEach((v, i) => {
    if (!(v > 0)) return;
    const len = (v / sum) * 100, c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    const r = (x) => String(+x.toFixed(2));
    c.setAttribute("class", "odl-s" + (i + 1));
    [["cx", 60], ["cy", 60], ["r", 48], ["pathLength", 100]].forEach(([k, x]) => c.setAttribute(k, x));
    c.setAttribute("stroke-dasharray", `${r(Math.max(0, len - 0.8))} ${r(100 - Math.max(0, len - 0.8))}`);
    c.setAttribute("stroke-dashoffset", r(-at));
    g.append(c);
    at += len;
  });
  // the list's name says the total, for a screen reader
  const total = (root.querySelector(".odl-total b")?.textContent || "").trim();
  const cap = (root.querySelector(".odl-total span")?.textContent || root.querySelector("h3")?.textContent || "").trim();
  if (total) list.setAttribute("aria-label", `${cap.charAt(0).toUpperCase() + cap.slice(1)}, ${total}, by category`);
});
</script>
