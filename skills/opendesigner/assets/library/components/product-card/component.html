<style>
.odl-product-card { box-sizing: border-box; inline-size: 100%; max-inline-size: 22.5rem; margin-inline: auto; container-type: inline-size; text-wrap: pretty; }
.odl-product-card *, .odl-product-card *::before { box-sizing: border-box; }
.odl-product-card .odl-card { display: grid; overflow: hidden; background: var(--ds-color-surface-raised); color: var(--ds-color-text-primary);
  border: var(--ds-border-width-default) solid var(--ds-color-border-subtle); border-radius: var(--ds-radius-container); box-shadow: var(--ds-elevation-raised); font: var(--ds-text-body-md); }
.odl-product-card .odl-cover { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 10; overflow: hidden; background: var(--ds-color-bg-accent-subtle);
  border-block-end: var(--ds-border-width-default) solid var(--ds-color-border-subtle); }
.odl-product-card .odl-cover::before { content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 120%, var(--ds-color-bg-accent-subtle-hover) 0 46%, transparent 46.5%), radial-gradient(circle at 50% 120%, var(--ds-color-bg-accent-subtle-pressed) 0 30%, transparent 30.5%); }
.odl-product-card .odl-cover svg { position: relative; inline-size: 74%; max-inline-size: 15rem; overflow: visible; }
.odl-product-card .odl-sheet { fill: var(--ds-color-surface-raised); stroke: var(--ds-color-border-subtle); stroke-width: 1; }
.odl-product-card .odl-sheet.is-back { fill: var(--ds-color-surface-sunken); }
.odl-product-card .odl-dot { fill: var(--ds-color-bg-accent-bold); }
.odl-product-card .odl-dot.is-muted { fill: var(--ds-color-border-default); }
.odl-product-card .odl-ln { fill: var(--ds-color-bg-neutral-subtle-pressed); }
.odl-product-card .odl-ln.is-strong { fill: var(--ds-color-border-strong); }
.odl-product-card .odl-seal { fill: var(--ds-color-bg-accent-bold); }
.odl-product-card .odl-seal-mark { fill: none; stroke: var(--ds-color-icon-on-accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.odl-product-card .odl-tag { position: absolute; inset-block-start: var(--ds-space-inset-sm); inset-inline-start: var(--ds-space-inset-sm); display: inline-flex; align-items: center; min-block-size: var(--ds-size-control-sm); padding: 0 var(--ds-space-inset-xs);
  border-radius: calc(var(--ds-radius-container) - var(--ds-space-inset-sm)); background: var(--ds-color-surface-raised); color: var(--ds-color-text-primary); font: var(--ds-text-label-sm); box-shadow: var(--ds-elevation-raised); }
/* The heart's visible circle lines up with the tag; its larger hit area hangs outside that circle. */
.odl-product-card .odl-fav { --odl-hang: calc((max(var(--ds-size-control-sm), var(--ds-size-target-min)) - var(--ds-size-control-sm)) / 2);
  position: absolute; inset-block-start: calc(var(--ds-space-inset-sm) - var(--odl-hang)); inset-inline-end: calc(var(--ds-space-inset-sm) - var(--odl-hang)); display: grid; place-items: center;
  inline-size: max(var(--ds-size-control-sm), var(--ds-size-target-min)); block-size: max(var(--ds-size-control-sm), var(--ds-size-target-min)); padding: 0; border: 0; background: transparent; cursor: pointer; color: var(--ds-color-text-secondary); }
.odl-product-card .odl-fav span { display: grid; place-items: center; inline-size: var(--ds-size-control-sm); block-size: var(--ds-size-control-sm); border-radius: var(--ds-radius-full);
  background: var(--ds-color-surface-raised); box-shadow: var(--ds-elevation-raised); transition: color var(--ds-motion-duration-short) var(--ds-motion-easing-standard); }
.odl-product-card .odl-fav:hover { color: var(--ds-color-text-primary); }
.odl-product-card .odl-fav svg { inline-size: var(--ds-size-icon-sm); block-size: var(--ds-size-icon-sm); }
.odl-product-card .odl-fav[aria-pressed="true"] { color: var(--ds-color-text-danger); }
.odl-product-card .odl-fav[aria-pressed="true"] path { fill: currentColor; }
.odl-product-card .odl-body { display: grid; gap: var(--ds-space-stack-sm); padding: var(--ds-space-inset-md) var(--ds-space-inset-lg) var(--ds-space-inset-lg); }
.odl-product-card .odl-kind { margin: 0; color: var(--ds-color-text-accent); font: var(--ds-text-label-md); }
.odl-product-card h3 { margin: 0; font: var(--ds-text-title-md); }
.odl-product-card .odl-desc { margin: 0; color: var(--ds-color-text-secondary); font: var(--ds-text-body-sm); }
.odl-product-card .odl-rate { display: flex; align-items: center; gap: var(--ds-space-inline-xs); margin: 0; color: var(--ds-color-text-secondary); font: var(--ds-text-body-sm); font-variant-numeric: tabular-nums; }
.odl-product-card .odl-rate b { color: var(--ds-color-text-primary); font-weight: var(--ds-font-weight-label); }
.odl-product-card .odl-stars { display: inline-flex; gap: var(--ds-space-2); color: var(--ds-color-text-warning); }
.odl-product-card .odl-stars svg { inline-size: var(--ds-size-icon-sm); block-size: var(--ds-size-icon-sm); fill: currentColor; }
.odl-product-card .odl-stars svg:last-child { fill: none; stroke: currentColor; stroke-width: 1.25; }
.odl-product-card .odl-buy { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--ds-space-stack-sm) var(--ds-space-inline-sm);

.odl-product-card .odl-price { display: grid; gap: var(--ds-space-2); font-variant-numeric: tabular-nums; }
.odl-product-card .odl-price p { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--ds-space-inline-xs); margin: 0; }
.odl-product-card .odl-price strong { font: var(--ds-text-numeric-md); font-weight: var(--ds-font-weight-heading); }
.odl-product-card .odl-price span { color: var(--ds-color-text-secondary); font: var(--ds-text-body-sm); }
.odl-product-card .odl-price s { color: var(--ds-color-text-tertiary); font: var(--ds-text-body-sm); }
.odl-product-card .odl-save { padding: 0 var(--ds-space-6); border-radius: var(--ds-radius-full); background: var(--ds-color-bg-success-subtle); color: var(--ds-color-text-success); font: var(--ds-text-label-sm); }
.odl-product-card .odl-add { display: inline-flex; align-items: center; justify-content: center; gap: var(--ds-space-inline-xs); min-inline-size: 6.5rem;
  min-block-size: max(var(--ds-size-control-md), var(--ds-size-target-min)); padding: 0 var(--ds-space-inset-md); border: var(--ds-border-width-default) solid transparent; border-radius: var(--ds-radius-control);
  background: var(--ds-color-bg-action-primary); color: var(--ds-color-text-on-action); font: var(--ds-text-label-lg); font-weight: var(--ds-font-weight-label); cursor: pointer;
  transition: background-color var(--ds-motion-duration-short) var(--ds-motion-easing-standard); }
.odl-product-card .odl-add:hover { background: var(--ds-color-bg-action-primary-hover); }
.odl-product-card .odl-add:active { background: var(--ds-color-bg-action-primary-pressed); }
.odl-product-card .odl-add svg { inline-size: var(--ds-size-icon-sm); block-size: var(--ds-size-icon-sm); }
.odl-product-card .odl-add .is-on, .odl-product-card .odl-add[aria-pressed="true"] .is-off { display: none; }
.odl-product-card .odl-add[aria-pressed="true"] .is-on { display: inline-flex; align-items: center; gap: var(--ds-space-inline-xs); }
.odl-product-card .odl-add[aria-pressed="true"] { background: var(--ds-color-bg-success-subtle); color: var(--ds-color-text-success); border-color: var(--ds-color-border-success); }
.odl-product-card .odl-add .is-off { display: inline-flex; align-items: center; gap: var(--ds-space-inline-xs); }
.odl-product-card button:focus-visible { outline: var(--ds-focus-ring-width) solid var(--ds-color-border-focus); outline-offset: var(--ds-focus-ring-offset); }
.odl-product-card .odl-sr { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@container (max-width: 18rem) {
  .odl-product-card .odl-body { padding: var(--ds-space-inset-sm) var(--ds-space-inset-md) var(--ds-space-inset-md); }
  .odl-product-card .odl-add { inline-size: 100%; }
}
@media (prefers-reduced-motion: reduce) { .odl-product-card, .odl-product-card *, .odl-product-card *::before { transition: none !important; animation: none !important; } }
</style>

<script>
document.querySelectorAll(".odl-product-card").forEach((root) => {
  if (root.dataset.odlReady) return; // wire once, even if the file is pasted twice
  root.dataset.odlReady = "1";
  root.querySelectorAll(".odl-add, .odl-fav").forEach((b) => b.addEventListener("click", () => {
    const on = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", String(on));
  }));
});
</script>
