<script>
document.querySelectorAll(".odl-menu-item").forEach((root) => {
  if (root.dataset.odlReady) return; // wire once, even if the file is pasted twice
  root.dataset.odlReady = "1";
  const form = root.querySelector("form"), base = Number(form.dataset.base), out = root.querySelector("output"), minus = root.querySelector(".odl-minus");
  const extras = [...root.querySelectorAll(".odl-extras input")], req = root.querySelector(".odl-base .odl-req"), label = root.querySelector(".odl-go-label");
  const update = () => {
    const q = Number(out.textContent), pick = root.querySelector(".odl-base input:checked");
    const each = base + (pick ? Number(pick.value) : 0) + extras.filter((x) => x.checked).reduce((s, x) => s + Number(x.value), 0);
    root.querySelector(".odl-total").textContent = "$" + (each * q).toFixed(2);
    minus.disabled = q <= 1;
    const full = extras.filter((x) => x.checked).length >= 3;
    extras.forEach((x) => { x.disabled = full && !x.checked; });
    req.classList.toggle("is-ok", !!pick); req.textContent = pick ? "Done" : "Required";
    label.textContent = q > 1 ? `Add ${q} to order` : "Add to order";
  };
  form.addEventListener("change", update);
  root.querySelector(".odl-plus").addEventListener("click", () => { out.textContent = Number(out.textContent) + 1; update(); });
  minus.addEventListener("click", () => { out.textContent = Math.max(1, Number(out.textContent) - 1); update(); });
  form.addEventListener("submit", (e) => { e.preventDefault(); if (!root.querySelector(".odl-base input:checked")) { root.querySelector(".odl-base input").focus(); return; } label.textContent = "Added"; });
  update();
});
</script>
