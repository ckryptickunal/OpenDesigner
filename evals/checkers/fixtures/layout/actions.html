<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actions fixture</title>
<!-- Checker eval fixture for site/check_layout.py. Planted, at 390 px: (1) 'Skip today' stacked above its primary action in a .x-actions column; (2) a .dialog-actions row with the primary 'Save' on the left of 'Cancel' (owner feedback item 17).
     The planted defects and where each must be found are listed in evals/checkers/manifest.json. -->
<style>
*, *::before, *::after { box-sizing: border-box; }
html { font: 16px/1.5 system-ui, -apple-system, sans-serif; color: #1c1c1e; background: #ffffff; }
body { margin: 0; }
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 16px; text-wrap: balance; }
h2 { font-size: 20px; line-height: 1.3; margin: 24px 0 8px; text-wrap: balance; }
p { margin: 0 0 16px; text-wrap: pretty; }
.x-card { border: 1px solid #d1d1d6; border-radius: 12px; padding: 16px; background: #f7f7f8; }
button { font: inherit; font-size: 15px; min-height: 40px; padding: 0 16px; border: 1px solid #8e8e93; border-radius: 8px; background: #ffffff; color: #1c1c1e; }
button.primary { background: #1f4fd8; border-color: #1f4fd8; color: #ffffff; }
.x-actions { display: flex; flex-direction: column; gap: 8px; margin: 0 0 24px; }
.dialog-actions { display: flex; gap: 8px; justify-content: space-between; }
</style>
</head>
<body>
<main>
<h1>Actions fixture</h1>
<div class="x-actions" id="stacked"><button id="skip">Skip today</button><button class="primary" id="done">Mark today done</button></div>
<div class="dialog-actions" id="reversed"><button class="primary" id="save">Save</button><button id="cancel">Cancel</button></div>
</main>
</body>
</html>
