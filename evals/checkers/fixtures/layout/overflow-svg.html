<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overflow fixture (svg)</title>
<!-- Checker eval fixture for site/check_layout.py. Planted: an inline svg chart with a fixed 400 px width; at 320 px it makes the page scroll sideways.
     The planted defects and where each must be found are listed in evals/checkers/manifest.json. -->
<style>
*, *::before, *::after { box-sizing: border-box; }
html { font: 16px/1.5 system-ui, -apple-system, sans-serif; color: #1c1c1e; background: #ffffff; }
body { margin: 0; }
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 16px; text-wrap: balance; }
h2 { font-size: 20px; line-height: 1.3; margin: 24px 0 8px; text-wrap: balance; }
p { margin: 0 0 16px; text-wrap: pretty; }
.x-card { border: 1px solid #d1d1d6; border-radius: 12px; padding: 16px; background: #f7f7f8; }
button { font: inherit; font-size: 15px; min-height: 40px; padding: 0 16px; border: 1px solid #8e8e93; border-radius: 8px; background: #ffffff; color: #1c1c1e; }
button.primary { background: #1f4fd8; border-color: #1f4fd8; color: #ffffff; }

</style>
</head>
<body>
<main>
<h1>Overflow fixture</h1>
<p>Monthly signups, drawn as an inline chart.</p>
<svg id="wide-svg" width="400" height="120" viewBox="0 0 400 120" role="img" aria-label="Signups rose from 40 to 90 a month">
  <rect width="400" height="120" fill="#dfe6f7"/>
  <path d="M0 100 L80 60 L160 80 L240 30 L320 50 L400 20" stroke="#1f4fd8" stroke-width="4" fill="none"/>
</svg>
<p>Source: the fixture's own numbers.</p>
</main>
</body>
</html>
