<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge fixture</title>
<!-- Checker eval fixture for site/check_layout.py. Planted: three cards stacked in one column; the middle one keeps a leftover margin-left of 12 px, so the left edges are ragged.
     The planted defects and where each must be found are listed in evals/checkers/manifest.json. -->
<style>
*, *::before, *::after { box-sizing: border-box; }
html { font: 16px/1.5 system-ui, -apple-system, sans-serif; color: #1c1c1e; background: #ffffff; }
body { margin: 0; }
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 16px; text-wrap: balance; }
h2 { font-size: 20px; line-height: 1.3; margin: 24px 0 8px; text-wrap: balance; }
p { margin: 0 0 16px; text-wrap: pretty; }
.x-card { border: 1px solid #d1d1d6; border-radius: 12px; padding: 16px; background: #f7f7f8; }
button { font: inherit; font-size: 15px; min-height: 40px; padding: 0 16px; border: 1px solid #8e8e93; border-radius: 8px; background: #ffffff; color: #1c1c1e; }
button.primary { background: #1f4fd8; border-color: #1f4fd8; color: #ffffff; }
#steps { display: flex; flex-direction: column; gap: 12px; max-width: 560px; }
#step-2 { margin-left: 12px; }
</style>
</head>
<body>
<main>
<h1>Edge fixture</h1>
<div id="steps">
  <div class="x-card" id="step-1"><strong>Sketch</strong><p>Five answers.</p></div>
  <div class="x-card" id="step-2"><strong>Build</strong><p>Tokens and exports.</p></div>
  <div class="x-card" id="step-3"><strong>Review</strong><p>Every width.</p></div>
</div>
</main>
</body>
</html>
