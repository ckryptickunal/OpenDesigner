<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label break fixture</title>
<!-- Checker eval fixture for site/check_layout.py. Planted, at 320 px: (1) a 'Default' chip squeezed by a long title in a flex row, with overflow-wrap: anywhere, so it breaks inside the word (owner feedback item 16: 'Defaul / t'); (2) a 'Read only' chip with a fixed 56 px width that wraps onto two lines.
     The planted defects and where each must be found are listed in evals/checkers/manifest.json. -->
<style>
*, *::before, *::after { box-sizing: border-box; }
html { font: 16px/1.5 system-ui, -apple-system, sans-serif; color: #1c1c1e; background: #ffffff; }
body { margin: 0; }
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 16px; text-wrap: balance; }
h2 { font-size: 20px; line-height: 1.3; margin: 24px 0 8px; text-wrap: balance; }
p { margin: 0 0 16px; text-wrap: pretty; }
.x-card { border: 1px solid #d1d1d6; border-radius: 12px; padding: 16px; background: #f7f7f8; }
button { font: inherit; font-size: 15px; min-height: 40px; padding: 0 16px; border: 1px solid #8e8e93; border-radius: 8px; background: #ffffff; color: #1c1c1e; }
button.primary { background: #1f4fd8; border-color: #1f4fd8; color: #ffffff; }
.row { display: flex; gap: 8px; align-items: center; margin: 0 0 16px; }
.row .title { font-weight: 600; }
.chip, .x-chip { display: inline-block; padding: 2px 8px; border: 1px solid #8e8e93; border-radius: 999px; font-size: 13px; line-height: 18px; }
#chip-default { min-width: 0; overflow-wrap: anywhere; }
#chip-readonly { width: 56px; }
</style>
</head>
<body>
<main>
<h1>Label break fixture</h1>
<div class="row" id="plan-row"><span class="title">Starter plan for small teams with shared billing</span><span class="chip" id="chip-default">Default</span></div>
<div class="row" id="perm-row"><span class="title">Viewer</span><span class="x-chip" id="chip-readonly">Read only</span></div>
</main>
</body>
</html>
