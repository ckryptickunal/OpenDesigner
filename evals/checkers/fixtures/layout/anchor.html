<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchor fixture</title>
<!-- Checker eval fixture for site/check_layout.py. Planted: (1) a Copy button pinned 8 px from the top of a code box whose code starts 48 px down, so the button floats in an empty band above the code (owner feedback item 13); (2) a Copy button centred on the first line but 16 px from the top and 4 px from the side (unequal insets, a warning).
     The planted defects and where each must be found are listed in evals/checkers/manifest.json. -->
<style>
*, *::before, *::after { box-sizing: border-box; }
html { font: 16px/1.5 system-ui, -apple-system, sans-serif; color: #1c1c1e; background: #ffffff; }
body { margin: 0; }
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 16px; text-wrap: balance; }
h2 { font-size: 20px; line-height: 1.3; margin: 24px 0 8px; text-wrap: balance; }
p { margin: 0 0 16px; text-wrap: pretty; }
.x-card { border: 1px solid #d1d1d6; border-radius: 12px; padding: 16px; background: #f7f7f8; }
button { font: inherit; font-size: 15px; min-height: 40px; padding: 0 16px; border: 1px solid #8e8e93; border-radius: 8px; background: #ffffff; color: #1c1c1e; }
button.primary { background: #1f4fd8; border-color: #1f4fd8; color: #ffffff; }
.code { position: relative; border: 1px solid #d1d1d6; border-radius: 12px; background: #f7f7f8; margin: 0 0 24px; }
.code pre { margin: 0; font: 14px/24px ui-monospace, Menlo, monospace; white-space: pre-wrap; }
.copy { position: absolute; min-height: 0; height: 24px; padding: 0 10px; font-size: 13px; line-height: 22px; border-radius: 6px; }
#band { padding: 48px 16px 16px; }
#band .copy { top: 8px; right: 8px; }
#inset { padding: 16px 96px 16px 16px; }
#inset .copy { top: 16px; right: 4px; }
</style>
</head>
<body>
<main>
<h1>Anchor fixture</h1>
<div class="code" id="band"><button class="copy" id="copy-band">Copy</button><pre>python3 engine.py build</pre></div>
<div class="code" id="inset"><button class="copy" id="copy-inset">Copy</button><pre>python3 engine.py validate</pre></div>
</main>
</body>
</html>
