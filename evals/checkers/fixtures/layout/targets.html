<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Targets fixture</title>
<!-- Checker eval fixture for site/check_layout.py. Planted: two 20 x 20 px zoom buttons 2 px apart (each inside the other's 24 px circle). Not a defect: a lone 20 x 20 px button with clear space all round (the WCAG 2.5.8 spacing exception), which must not be flagged.
     The planted defects and where each must be found are listed in evals/checkers/manifest.json. -->
<style>
*, *::before, *::after { box-sizing: border-box; }
html { font: 16px/1.5 system-ui, -apple-system, sans-serif; color: #1c1c1e; background: #ffffff; }
body { margin: 0; }
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 16px; text-wrap: balance; }
h2 { font-size: 20px; line-height: 1.3; margin: 24px 0 8px; text-wrap: balance; }
p { margin: 0 0 16px; text-wrap: pretty; }
.x-card { border: 1px solid #d1d1d6; border-radius: 12px; padding: 16px; background: #f7f7f8; }
button { font: inherit; font-size: 15px; min-height: 40px; padding: 0 16px; border: 1px solid #8e8e93; border-radius: 8px; background: #ffffff; color: #1c1c1e; }
button.primary { background: #1f4fd8; border-color: #1f4fd8; color: #ffffff; }
.icon { min-height: 0; width: 20px; height: 20px; padding: 0; font-size: 13px; line-height: 18px; border-radius: 4px; }
#toolbar { display: flex; gap: 2px; margin: 0 0 32px; }
#lonely-wrap { padding: 24px 0; }
</style>
</head>
<body>
<main>
<h1>Targets fixture</h1>
<div id="toolbar">
  <button class="icon" id="zoom-in" aria-label="Zoom in">+</button>
  <button class="icon" id="zoom-out" aria-label="Zoom out">-</button>
</div>
<p>A help button with clear space around it.</p>
<div id="lonely-wrap"><button class="icon" id="lonely" aria-label="Help">?</button></div>
</main>
</body>
</html>
