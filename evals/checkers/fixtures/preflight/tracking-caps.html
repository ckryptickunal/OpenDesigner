<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tracking fixture</title>
<!-- Checker eval fixture for preflight.py html (M5, owner review of a private B2B landing page, 2026-11-05): an uppercase
     eyebrow tracked at -0.03em, and a 40 px title tracked looser (0.8 px = +0.02em) than the 14 px lede under it (-0.01em). -->
<style>
body { font: 16px/1.5 system-ui, sans-serif; }
.eyebrow { text-transform: uppercase; letter-spacing: -0.03em; font-size: 12px; }
.lede { font-size: 14px; letter-spacing: -0.01em; }
.title { font-size: 40px; letter-spacing: 0.8px; }
</style>
</head>
<body><p class="eyebrow">For teams</p><h1 class="title">Invoices in one place</h1><p class="lede">Receipts and invoices.</p></body>
</html>
