<h1>Questions</h1>
<h2>Which banks does Ledgerly read?</h2><p>Any bank with an open-banking feed in the UK. Others can upload a statement file once a week.</p>
<h2>Can I export my invoices?</h2><p>Yes: every invoice and payment exports as CSV, and the PDF of each invoice stays downloadable.</p>
