<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=205, initial-scale=1">
<title>Headway: next tram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Overpass:wght@500..700&display=block" rel="stylesheet">
<link rel="stylesheet" href="opendesigner/build/css/tokens.css">
<style>
  /* Round 4: one glanceable thing, the minutes to the next tram. No badges, stop line, rules or rotated labels.
     One face (Overpass), two weights. Hardware, not design tokens: the 49 mm-class display is 205 x 251 pt with rounded corners. */
  :root { --display-w: 205px; --display-h: 251px; --display-r: 48px; }
  /* Type roles, watchOS text styles at xLarge: Caption 2 15, Headline 17, Title 3 20 (engine 21), and one data numeral (124, outside the HIG styles on purpose). */
  :root {
    --t-caption: 15px;                    /* HIG Caption 2; the engine scale steps 14 and 17 */
    --t-headline: var(--ds-font-size-17);
    --t-title3: var(--ds-font-size-21);
    --t-display: 124px;
    --signal: var(--ds-color-brand-seed); /* the one colour: the departure that is about to leave */
  }
  /* System chrome: watchOS draws the title and the time itself, in San Francisco; Inter (SIL OFL) stands in, the same in every watch piece. */
  :root { --t-sys: 600 17px/1 "Inter", system-ui, sans-serif; }
  html, body { margin: 0; background: var(--ds-color-black); }
  .display {
    position: relative; width: var(--display-w); height: var(--display-h); overflow: hidden;
    border-radius: var(--display-r); background: var(--ds-color-surface-base);
    color: var(--ds-color-white); font-family: var(--ds-font-family-text);
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  .status { position: absolute; top: var(--ds-space-12); left: 20px; right: 22px; display: flex; justify-content: space-between; font: var(--t-sys); font-variant-numeric: tabular-nums; }
  .status .stop { color: var(--ds-color-text-secondary); }

  .route { position: absolute; top: 58px; left: var(--ds-space-16); font: 700 var(--t-headline)/1 var(--ds-font-family-text); }
  .count { position: absolute; top: 74px; left: 12px; display: flex; align-items: baseline; gap: var(--ds-space-6); color: var(--signal); }
  .count .num { font: 700 var(--t-display)/1 var(--ds-font-family-text); letter-spacing: -0.04em; }
  .count .unit { font: 700 var(--t-title3)/1 var(--ds-font-family-text); }
  .then { position: absolute; top: 186px; left: var(--ds-space-16); font: 600 var(--t-caption)/1.2 var(--ds-font-family-text); color: var(--ds-color-text-secondary); }
  .then b { font-weight: 600; color: var(--ds-color-white); }
</style>
</head>
<body>
<main class="display" aria-label="Headway at Wharf Rd: tram 7 to Saltgrove in 2 minutes, then 9 and 14 minutes">
  <div class="status"><span class="stop">Wharf Rd</span><span class="clock">8:04</span></div>
  <div class="route">Tram 7 to Saltgrove</div>
  <div class="count"><span class="num">2</span><span class="unit">min</span></div>
  <div class="then">Then <b>9</b> and <b>14</b> min</div>
</main>
</body>
</html>
