<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=205, initial-scale=1">
<title>Thrum: heart rate in zone 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Bricolage+Grotesque:opsz,wght@12..96,500..600&display=block" rel="stylesheet">
<link rel="stylesheet" href="opendesigner/build/css/tokens.css">
<style>
  /* Round 4: one glanceable thing, the heart rate, and the one zone it sits in. One face (Bricolage Grotesque), two weights.
     Hardware, not design tokens: the 49 mm-class display is 205 x 251 pt with rounded corners. */
  :root { --display-w: 205px; --display-h: 251px; --display-r: 48px; }
  /* Type roles, watchOS text styles at xLarge: Caption 2 15, Headline 17, and one data numeral (92, outside the HIG styles on purpose). */
  :root {
    --t-caption: 15px;                    /* HIG Caption 2; the engine scale steps 13 and 17 */
    --t-headline: var(--ds-font-size-17);
    --t-display: 92px;
    --zone: var(--ds-color-brand-seed);   /* the one colour: the zone you are in */
    --track: var(--ds-color-neutral-dark-6);
  }
  /* System chrome: watchOS draws the title and the time itself, in San Francisco; Inter (SIL OFL) stands in, the same in every watch piece. */
  :root { --t-sys: 600 17px/1 "Inter", system-ui, sans-serif; }
  html, body { margin: 0; background: var(--ds-color-black); }
  .display {
    position: relative; width: var(--display-w); height: var(--display-h); overflow: hidden;
    border-radius: var(--display-r); background: var(--ds-color-surface-base);
    color: var(--ds-color-white); font-family: var(--ds-font-family-text);
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  .status { position: absolute; top: var(--ds-space-12); left: 20px; right: 22px; display: flex; justify-content: space-between; font: var(--t-sys); font-variant-numeric: tabular-nums; }
  .status .rep { color: var(--ds-color-text-secondary); }

  .hr { position: absolute; top: 62px; left: 14px; right: 16px; display: flex; align-items: baseline; gap: var(--ds-space-6); }
  .hr .num { font: 600 var(--t-display)/0.86 var(--ds-font-family-text); font-variation-settings: "opsz" 96; letter-spacing: -0.015em; }
  .hr .unit { font: 500 var(--t-headline)/1 var(--ds-font-family-text); color: var(--ds-color-text-secondary); }

  .zones { position: absolute; top: 158px; left: var(--ds-space-16); right: var(--ds-space-16); display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--ds-space-4); }
  .zones i { height: 6px; border-radius: var(--ds-radius-full); background: var(--track); }
  .zones i.on { background: var(--zone); }
  .zone { position: absolute; top: 178px; left: var(--ds-space-16); right: var(--ds-space-16); display: flex; justify-content: space-between; align-items: baseline; }
  .zone b { font: 600 var(--t-headline)/1 var(--ds-font-family-text); }
  .zone span { font: 500 var(--t-caption)/1 var(--ds-font-family-text); color: var(--ds-color-text-secondary); }
</style>
</head>
<body>
<main class="display" aria-label="Thrum interval 3 of 6: heart rate 162 beats per minute, zone 4 of 5, threshold, 152 to 167">
  <div class="status"><span class="rep">Rep 3 of 6</span><span class="clock">6:15</span></div>

  <div class="hr"><span class="num">162</span><span class="unit">bpm</span></div>

  <div class="zones" aria-hidden="true"><i></i><i></i><i></i><i class="on"></i><i></i></div>
  <div class="zone"><b>Zone 4</b><span>152–167</span></div>
</main>
</body>
</html>
