<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=205, initial-scale=1">
<title>Tidemark: dawn tide face</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=block" rel="stylesheet">
<link rel="stylesheet" href="opendesigner/build/css/tokens.css">
<style>
  :root { --display-w: 205px; --display-h: 251px; --display-r: 48px; }  /* hardware shape */
  /* Type roles: watchOS text styles at xLarge (49 mm default). Footnote 1 14 and Body 17 are engine tokens;
     Title 3 20 is the HIG value (the engine scale steps 17 -> 21); the face's time is the one display size. */
  :root { --t-footnote: var(--ds-font-size-14); --t-body: var(--ds-font-size-17); --t-title3: 20px; --t-display: 72px; }
  html, body { margin: 0; background: var(--ds-color-black); }
  .display {
    position: relative; width: var(--display-w); height: var(--display-h); overflow: hidden; border-radius: var(--display-r);
    background: var(--ds-color-surface-base); color: var(--ds-color-text-primary); font-family: var(--ds-font-family-text);
    font-variant-numeric: tabular-nums;
  }
  canvas { position: absolute; inset: 0; width: 205px; height: 251px; }
  .comp { position: absolute; top: 14px; display: flex; align-items: center; gap: 5px; font: 600 var(--t-body)/1 var(--ds-font-family-text); letter-spacing: .03em; }
  .date { left: 28px; color: var(--ds-color-accent-dark-11); text-transform: uppercase; }
  .wx { right: 26px; color: var(--ds-color-text-primary); }
  .wx svg { width: 17px; height: 17px; }
  .time {
    /* the face's one display size, above the type scale on purpose */
    position: absolute; left: 0; right: 0; top: 36px; text-align: center;
    font-weight: 200; font-size: var(--t-display); line-height: 1; letter-spacing: -0.04em; color: var(--ds-color-white);
  }
  .tide-now { position: absolute; left: 0; right: 0; top: 116px; text-align: center; display: flex; justify-content: center; align-items: baseline; gap: var(--ds-space-6); }
  .tide-now .v { font: 600 var(--t-title3)/1 var(--ds-font-family-text); letter-spacing: -0.01em; }
  .tide-now .k { font: 500 var(--t-body)/1 var(--ds-font-family-text); color: var(--ds-color-accent-dark-11); letter-spacing: .02em; }
  .mark { position: absolute; font: 600 var(--t-body)/1 var(--ds-font-family-text); color: var(--ds-color-text-primary); text-align: center; transform: translateX(-50%); white-space: nowrap; }
  .mark small { display: block; margin-top: 3px; font: 500 var(--t-footnote)/1 var(--ds-font-family-text); letter-spacing: .08em; text-transform: uppercase; color: var(--ds-color-text-secondary); }
</style>
</head>
<body>
<main class="display" aria-label="Tidemark watch face: 6:18, 12 degrees, tide rising at 2.1 metres, high water 9:42">
  <canvas id="sky" width="615" height="753" aria-hidden="true"></canvas>
  <div class="comp date">Tue 14</div>
  <div class="comp wx"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 12.5h7a3 3 0 0 0 .3-6 4 4 0 0 0-7.6 1A2.5 2.5 0 0 0 4.5 12.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>12°</div>
  <div class="time">6:18</div>
  <div class="tide-now"><span class="v">2.1 m</span><span class="k">rising</span></div>
  <div class="mark" id="high">9:42<small>High</small></div>
</main>
<script>
/* Generative dawn: seeded stars fading into a cool horizon glow, thin lit cloud strata, a dark sea, and the tide curve. */
(function () {
  const c = document.getElementById('sky'), x = c.getContext('2d'), S = 3, W = 205, H = 251;
  x.scale(S, S);
  const cs = getComputedStyle(document.documentElement), tok = n => cs.getPropertyValue(n).trim();
  const tint = tok('--ds-color-brand-seed'), deep = tok('--ds-color-accent-dark-5'), mid = tok('--ds-color-accent-dark-7');
  const HZ = 158;  // horizon
  let s = 1234; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  // sky
  const g = x.createLinearGradient(0, 0, 0, HZ);
  g.addColorStop(0, '#000'); g.addColorStop(.38, '#01060c'); g.addColorStop(.72, deep); g.addColorStop(.93, mid); g.addColorStop(1, '#2b7fae');
  x.fillStyle = g; x.fillRect(0, 0, W, HZ);
  // horizon glow
  const hg = x.createRadialGradient(132, HZ, 2, 132, HZ, 120);
  hg.addColorStop(0, 'rgba(160,226,255,.55)'); hg.addColorStop(.35, 'rgba(92,200,255,.18)'); hg.addColorStop(1, 'rgba(92,200,255,0)');
  x.fillStyle = hg; x.fillRect(0, 0, W, HZ);
  // stars, fading toward the horizon
  for (let i = 0; i < 120; i++) {
    const sx = r() * W, sy = Math.pow(r(), 1.6) * (HZ - 30);
    const a = (1 - sy / (HZ - 20)) * (0.25 + r() * 0.75), rad = r() < .06 ? 0.9 : 0.35 + r() * 0.35;
    x.fillStyle = `rgba(225,240,255,${a.toFixed(2)})`; x.beginPath(); x.arc(sx, sy, rad, 0, 7); x.fill();
  }
  // crescent moon
  x.save(); x.translate(30, 147);
  x.beginPath(); x.arc(0, 0, 4.4, 0, 7); x.clip();
  x.beginPath(); x.arc(0, 0, 4.4, 0, 7); x.arc(2, -1.1, 4, 0, 7);
  x.fillStyle = 'rgba(214,236,255,.9)'; x.fill('evenodd'); x.restore();
  // cloud strata lit from below: clusters of soft ellipses, brighter and denser near the horizon
  x.filter = 'blur(2.2px)';
  for (let k = 0; k < 6; k++) {
    const by = HZ - 6 - Math.pow(r(), 1.3) * 46, bx = r() * W, spread = 30 + r() * 60;
    const near = 1 - (HZ - by) / 54;
    for (let j = 0; j < 9; j++) {
      const cx = bx + (r() - .5) * spread * 2, cy = by + (r() - .5) * 4, w = 10 + r() * 26, h = 1.2 + r() * 2.2;
      x.fillStyle = `rgba(${185 + 40 * near | 0},${228 + 20 * near | 0},255,${(0.05 + 0.16 * near * r()).toFixed(3)})`;
      x.beginPath(); x.ellipse(cx, cy, w, h, 0, 0, 7); x.fill();
      // the lit underside
      x.fillStyle = `rgba(220,245,255,${(0.04 + 0.12 * near).toFixed(3)})`;
      x.beginPath(); x.ellipse(cx, cy + h * .7, w * .8, h * .45, 0, 0, 7); x.fill();
    }
  }
  x.filter = 'none';
  // sea
  const sg = x.createLinearGradient(0, HZ, 0, H);
  sg.addColorStop(0, '#0a2436'); sg.addColorStop(.25, '#03101a'); sg.addColorStop(1, '#000');
  x.fillStyle = sg; x.fillRect(0, HZ, W, H - HZ);
  // glints on the water under the glow
  x.filter = 'blur(.5px)';
  for (let i = 0; i < 26; i++) {
    const gy = HZ + 2 + Math.pow(r(), 2.2) * 22, gx = 132 + (r() - .5) * (30 + (gy - HZ) * 2.4), gw = 2 + r() * 8;
    x.fillStyle = `rgba(175,230,255,${(0.55 * (1 - (gy - HZ) / 26)).toFixed(2)})`; x.fillRect(gx, gy, gw, 0.7);
  }
  x.filter = 'none';
  // tide curve
  // the curve shows 03:00 to 17:00 across the width
  const T0 = 172, A = 36, t0 = 3, span = 14, hr = h => (h - t0) / span, now = hr(6.3), high = hr(9.7), period = 12.42 / span;
  const y = t => T0 + 40 - A * (0.5 + 0.5 * Math.cos(2 * Math.PI * (t - high) / period));
  const ptsAll = []; for (let i = 0; i <= 120; i++) { const t = i / 120; ptsAll.push([t * W, y(t)]); }
  const path = arr => { x.beginPath(); arr.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); };
  // water body under the curve
  path(ptsAll); x.lineTo(W, H); x.lineTo(0, H); x.closePath();
  const wg = x.createLinearGradient(0, T0 - 10, 0, H);
  wg.addColorStop(0, 'rgba(92,200,255,.30)'); wg.addColorStop(1, 'rgba(92,200,255,0)');
  x.fillStyle = wg; x.fill();
  const nowI = Math.round(now * 120);
  x.lineWidth = 2; x.lineJoin = 'round'; x.strokeStyle = tint;
  path(ptsAll.slice(0, nowI + 1)); x.stroke();
  x.setLineDash([1.5, 3.5]); x.lineCap = 'round'; x.strokeStyle = 'rgba(165,222,255,.75)';
  path(ptsAll.slice(nowI)); x.stroke(); x.setLineDash([]);
  // high-water tick and label
  let hi = nowI; for (let i = nowI; i < 90; i++) if (ptsAll[i][1] < ptsAll[hi][1]) hi = i;
  const [hx, hy] = ptsAll[hi];
  x.fillStyle = 'rgba(215,240,255,.95)'; x.beginPath(); x.arc(hx, hy, 2.2, 0, 7); x.fill();
  const m = document.getElementById('high'); m.style.left = hx + 'px'; m.style.top = (hy + 8) + 'px';
  // now marker
  const [nx, ny] = ptsAll[nowI];
  x.fillStyle = 'rgba(92,200,255,.25)'; x.beginPath(); x.arc(nx, ny, 7, 0, 7); x.fill();
  x.fillStyle = '#000'; x.strokeStyle = tint; x.lineWidth = 2; x.beginPath(); x.arc(nx, ny, 3.6, 0, 7); x.fill(); x.stroke();
})();
</script>
</body>
</html>
