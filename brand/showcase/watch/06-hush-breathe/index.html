<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=205, initial-scale=1">
<title>Hush: breathe in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,100..900,0..100&display=block" rel="stylesheet">
<link rel="stylesheet" href="opendesigner/build/css/tokens.css">
<style>
  :root { --display-w: 205px; --display-h: 251px; --display-r: 48px; --lav: var(--ds-color-brand-seed); }  /* hardware shape; lav = exact brand lavender */
  html, body { margin: 0; background: var(--ds-color-black); }
  .display {
    position: relative; width: var(--display-w); height: var(--display-h); overflow: hidden; border-radius: var(--display-r);
    background: var(--ds-color-surface-base); color: var(--ds-color-text-primary); font-family: var(--ds-font-family-text);
  }
  canvas { position: absolute; inset: 0; width: 205px; height: 251px; }
  /* Type roles: watchOS text styles at xLarge (49 mm default). Headline 17 is an engine token; Caption 2 15 and
     Title 2 30 are HIG values (the engine scale steps 14, 17, 21, 27, 33). Three sizes, all upright. */
  :root { --t-caption: 15px; --t-body: var(--ds-font-size-17); --t-title2: 30px; }
  .status { position: absolute; top: var(--ds-space-12); left: 28px; right: var(--ds-space-24); display: flex; justify-content: space-between; align-items: baseline; }
  .app { font: 600 var(--t-body)/1 var(--ds-font-family-text); font-variation-settings: "opsz" 24, "SOFT" 100; color: var(--lav); }
  .clock { font: 400 var(--t-caption)/1 var(--ds-font-family-text); font-variation-settings: "opsz" 14; font-variant-numeric: lining-nums tabular-nums; color: var(--ds-color-text-secondary); }
  .cue { position: absolute; left: 0; right: 0; top: 182px; text-align: center; }
  .cue .word {
    /* the one instruction, light and upright: the calm comes from size and air, not weight */
    display: block; font: 300 var(--t-title2)/1 var(--ds-font-family-text); letter-spacing: -0.015em;
    font-variation-settings: "opsz" 72, "SOFT" 100; color: var(--ds-color-white);
  }
  .cue .count { display: block; margin-top: var(--ds-space-8); font: 400 var(--t-caption)/1 var(--ds-font-family-text); font-variation-settings: "opsz" 14; letter-spacing: .04em; color: var(--ds-color-text-secondary); font-variant-numeric: lining-nums; }
  @media (prefers-reduced-motion: no-preference) {
    /* the orb breathes on a 4 s in / 6 s out rhythm; the still frame is the inhale peak */
  }
</style>
</head>
<body>
<main class="display" aria-label="Hush: breathe in, breath 4 of 7">
  <canvas id="orb" width="615" height="753" aria-hidden="true"></canvas>
  <div class="status"><span class="app">Hush</span><span class="clock">10:30</span></div>
  <div class="cue"><span class="word">Breathe in</span><span class="count">4 of 7</span></div>
</main>
<script>
/* The orb: layered radial light with film grain, breath ripples, and the phase dot on a hairline ring. */
(function () {
  const c = document.getElementById('orb'), x = c.getContext('2d'), S = 3, W = 205, H = 251;
  x.scale(S, S);
  const cs = getComputedStyle(document.documentElement), tok = n => cs.getPropertyValue(n).trim();
  const lav = tok('--ds-color-brand-seed'), pale = tok('--ds-color-accent-dark-12'), deep = tok('--ds-color-accent-dark-7');
  const cx = 102.5, cy = 104, R = 52;
  // halo
  let g = x.createRadialGradient(cx, cy, R * .6, cx, cy, R * 2.1);
  g.addColorStop(0, 'rgba(185,166,255,.30)'); g.addColorStop(.45, 'rgba(185,166,255,.08)'); g.addColorStop(1, 'rgba(185,166,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // ripples
  [1.32, 1.62].forEach((k, i) => { x.strokeStyle = `rgba(208,197,255,${(.26 - i * .07).toFixed(2)})`; x.lineWidth = .7; x.beginPath(); x.arc(cx, cy, R * k, 0, 7); x.stroke(); });
  // body
  // soft body: a diffuse light, feathered at the rim so it reads as breath, not a ball
  x.save(); x.filter = 'blur(1.2px)';
  g = x.createRadialGradient(cx - R * .16, cy - R * .26, R * .08, cx, cy, R * 1.04);
  g.addColorStop(0, '#f6f2ff'); g.addColorStop(.36, pale); g.addColorStop(.7, lav); g.addColorStop(.94, deep); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.beginPath(); x.arc(cx, cy, R * 1.04, 0, 7); x.fill(); x.restore();
  // inner bloom, offset low-right, a second light inside the orb
  g = x.createRadialGradient(cx + R * .3, cy + R * .35, 1, cx + R * .3, cy + R * .35, R * .7);
  g.addColorStop(0, 'rgba(255,214,240,.35)'); g.addColorStop(1, 'rgba(255,214,240,0)');
  x.save(); x.beginPath(); x.arc(cx, cy, R, 0, 7); x.clip(); x.fillStyle = g; x.fillRect(0, 0, W, H);
  // grain, only inside the orb
  const img = x.getImageData((cx - R) * S | 0, (cy - R) * S | 0, 2 * R * S | 0, 2 * R * S | 0);
  let s = 77; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < img.data.length; i += 4) { const n = (r() - .5) * 22; img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n; }
  x.putImageData(img, (cx - R) * S | 0, (cy - R) * S | 0);
  x.restore();
  // phase ring and dot: 40% through the inhale
  const rr = R * 1.32, ph = -Math.PI / 2 + 2 * Math.PI * .4;
  x.strokeStyle = pale; x.lineWidth = 1.6; x.lineCap = 'round';
  x.beginPath(); x.arc(cx, cy, rr, -Math.PI / 2, ph); x.stroke();
  x.fillStyle = '#fff'; x.shadowColor = lav; x.shadowBlur = 8;
  x.beginPath(); x.arc(cx + rr * Math.cos(ph), cy + rr * Math.sin(ph), 3, 0, 7); x.fill();
})();
</script>
</body>
</html>
