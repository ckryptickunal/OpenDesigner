<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=205, initial-scale=1">
<title>Fellrise: pace on the climb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Archivo:wdth,wght@100,500..600&display=block" rel="stylesheet">
<link rel="stylesheet" href="opendesigner/build/css/tokens.css">
<style>
  /* Round 4: one glanceable thing, the pace. Lime has one job: the pace and the part of the route already run.
     App face: Archivo, normal width, upright, two weights. Hardware, not design tokens: the 49 mm-class display is 205 x 251 pt. */
  :root { --display-w: 205px; --display-h: 251px; --display-r: 48px; }
  /* Type roles, watchOS text styles at xLarge: Caption 2 15, and one data numeral (64, outside the HIG styles on purpose). */
  :root {
    --t-caption: 15px;                    /* HIG Caption 2; the engine scale steps 13 and 17 */
    --t-display: 64px;
    --lime: var(--ds-color-brand-seed);
  }
  /* System chrome: watchOS draws the title and the time itself, in San Francisco; Inter (SIL OFL) stands in, the same in every watch piece. */
  :root { --t-sys: 600 17px/1 "Inter", system-ui, sans-serif; }
  html, body { margin: 0; background: var(--ds-color-black); }
  .display {
    position: relative; width: var(--display-w); height: var(--display-h); overflow: hidden;
    border-radius: var(--display-r); background: var(--ds-color-surface-base);
    color: var(--ds-color-white); font-family: var(--ds-font-family-text); font-stretch: 100%;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  .status { position: absolute; top: var(--ds-space-12); left: 20px; right: 22px; display: flex; justify-content: space-between; font: var(--t-sys); font-variant-numeric: tabular-nums; }
  .status .dist { color: var(--ds-color-text-secondary); }

  .pace { position: absolute; top: 48px; left: var(--ds-space-20); }
  .pace .num { margin-left: -3px; }
  .pace .num { display: block; font: 600 var(--t-display)/0.9 var(--ds-font-family-text); letter-spacing: -0.02em; color: var(--lime); }
  .pace .pr { margin: 0 0.03em 0 0.02em; }
  .pace .sub { display: block; margin-top: var(--ds-space-8); font: 500 var(--t-caption)/1.2 var(--ds-font-family-text); color: var(--ds-color-text-secondary); }


  .profile { position: absolute; left: var(--ds-space-20); width: 165px; top: 140px; height: 62px; }
  .profile svg { display: block; width: 100%; height: 100%; overflow: visible; }
</style>
</head>
<body>
<main class="display" aria-label="Fellrise trail run: 14.2 km done, pace 6 minutes 24 seconds per km, 6 seconds ahead of plan; the summit is 2.4 km and 212 m of climb ahead">
  <div class="status"><span class="dist">14.2 km</span><span class="clock">6:47</span></div>

  <section class="pace">
    <span class="num">6<span class="pr">′</span>24<span class="pr">″</span></span>
    <span class="sub">per km · 6 s ahead</span>
  </section>

  <div class="profile" aria-hidden="true"><svg id="profile" viewBox="0 0 165 62"></svg></div>
</main>

<script>
/* The whole route's elevation as one line, inset from the display corners. The route is 25.4 km: the runner is at 14.2 km (56%),
   the summit 2.4 km on at 16.6 km (65%), then the descent to the finish. Run so far in lime, the rest grey, a white dot for the runner. */
(function () {
  const svg = document.getElementById('profile');
  const css = getComputedStyle(document.documentElement);
  const lime = css.getPropertyValue('--ds-color-brand-seed').trim();
  const grey = css.getPropertyValue('--ds-color-neutral-dark-8').trim();
  const W = 165, H = 62, N = 120, YOU = 14.2 / 25.4, TOP = 16.6 / 25.4;
  const bump = (x, c, w, h) => h * Math.exp(-((x - c) * (x - c)) / (2 * w * w));
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const x = i / N;
    const y = 0.12 + 0.06 * Math.sin(x * 11) + bump(x, 0.22, 0.06, 0.16) + bump(x, TOP, 0.075, 0.72) - 0.10 * Math.max(0, x - 0.8);
    pts.push([x * W, H - 4 - y * 54]);
  }
  const NS = 'http://www.w3.org/2000/svg';
  const add = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  const k = Math.round(N * YOU);
  const d = (a, b) => pts.slice(a, b + 1).map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  add('path', { d: d(k, N), fill: 'none', stroke: grey, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
  add('path', { d: d(0, k), fill: 'none', stroke: lime, 'stroke-width': 2.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
  add('circle', { cx: pts[k][0], cy: pts[k][1], r: 4.5, fill: '#fff', stroke: '#000', 'stroke-width': 2 });
})();
</script>
</body>
</html>
