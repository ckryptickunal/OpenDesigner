<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=205, initial-scale=1">
<title>Ridgeline: pace and climb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=block" rel="stylesheet">
<link rel="stylesheet" href="opendesigner/build/css/tokens.css">
<style>
  /* Hardware, not design tokens: the 49mm-class display is 205 x 251 pt with rounded corners. */
  :root { --display-w: 205px; --display-h: 251px; --display-r: 48px; }
  /* Type roles: watchOS text styles at xLarge (the default for 44/45/49 mm), mapped to engine tokens.
     Four sizes: Footnote 2 13, Body 17, Title 2 30, and one data display numeral (outside the HIG styles on purpose). */
  :root {
    --t-footnote: var(--ds-font-size-13);
    --t-body: var(--ds-font-size-17);
    --t-title2: var(--ds-font-size-30);
    --t-display: 68px;
  }
  html, body { margin: 0; background: var(--ds-color-black); }
  .display {
    position: relative; width: var(--display-w); height: var(--display-h); overflow: hidden;
    border-radius: var(--display-r); background: var(--ds-color-surface-base);
    color: var(--ds-color-text-primary); font-family: var(--ds-font-family-text);
    font-variant-numeric: tabular-nums;
  }
  /* status row: a highlight by fill box on the left, time right (platform convention) */
  .status { position: absolute; top: var(--ds-space-12); left: 26px; right: 22px; display: flex; justify-content: space-between; align-items: center; }
  .tag {
    font: 700 var(--t-body)/1 var(--ds-font-family-text); font-stretch: 104%; letter-spacing: .01em;
    color: var(--ds-color-black); background: var(--ds-color-brand-seed);
    padding: 3px 9px 3px var(--ds-space-6); clip-path: polygon(0 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
  }
  .clock { font: 500 var(--t-body)/1 var(--ds-font-family-text); }

  .pace { position: absolute; top: var(--ds-space-40); left: 14px; right: 10px; }
  .pace .num {
    /* the data numeral: heavy italic on purpose, the one loud thing on the screen, read mid-stride */
    display: block; font-weight: 900; font-style: italic; font-stretch: 104%; font-size: var(--t-display); line-height: .86;
    letter-spacing: -0.045em; color: var(--ds-color-brand-seed);
  }
  .pace .num .tick { font-stretch: 62%; font-weight: 800; letter-spacing: -0.01em; margin-left: 1px; }
  .pace .row { margin-top: var(--ds-space-8); display: flex; gap: var(--ds-space-8); align-items: baseline; padding-left: var(--ds-space-4); }
  .k { font: 600 var(--t-footnote)/1 var(--ds-font-family-text); font-stretch: 110%; letter-spacing: .06em; text-transform: uppercase; color: var(--ds-color-text-secondary); }
  .pace .delta { font: 400 var(--t-body)/1 var(--ds-font-family-text); color: var(--ds-color-text-primary); }
  .pace .delta b { color: var(--ds-color-brand-seed); font-weight: 700; }

  .terrain { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; }
  .terrain svg { display: block; width: 100%; height: 100%; }
  .callout { position: absolute; left: 22px; top: 135px; display: flex; flex-direction: column; gap: var(--ds-space-4); }
  .callout .v { font: 400 var(--t-title2)/1 var(--ds-font-family-text); letter-spacing: -0.02em; white-space: nowrap; }
  .callout .v small { font: 400 var(--t-body)/1 var(--ds-font-family-text); color: var(--ds-color-text-secondary); letter-spacing: 0; }
  .callout .v .sub { font: 700 var(--t-body)/1 var(--ds-font-family-text); color: var(--ds-color-brand-seed); letter-spacing: 0; margin-left: var(--ds-space-4); }
</style>
</head>
<body>
<main class="display" aria-label="Ridgeline run: pace and elevation">
  <div class="status"><span class="tag">KM 14.2</span><span class="clock">7:42</span></div>

  <section class="pace">
    <span class="num" aria-label="4 minutes 52 seconds per kilometre">4<span class="tick">'</span>52<span class="tick">"</span></span>
    <div class="row"><span class="k">Pace / km</span><span class="delta"><b>−0:08</b> plan</span></div>
  </section>

  <div class="callout" id="callout"><span class="k">To summit</span><span class="v">+312<small> m</small> <span class="sub">2.1 km</span></span></div>

  <div class="terrain" aria-hidden="true"><svg id="terrain" viewBox="0 0 205 128" preserveAspectRatio="none"></svg></div>
</main>

<script>
/* Elevation profile drawn in code: the run so far in the tint with hatching, the rest as contour echoes. */
(function () {
  const svg = document.getElementById('terrain');
  const css = getComputedStyle(document.documentElement);
  const tint = css.getPropertyValue('--ds-color-brand-seed').trim();
  const dim = css.getPropertyValue('--ds-color-neutral-dark-7').trim();
  const mid = css.getPropertyValue('--ds-color-neutral-dark-10').trim();
  const W = 205, H = 104, N = 96, TOP = 251 - H;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let s = 11; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const bump = (x, c, w, h) => h * Math.exp(-((x - c) * (x - c)) / (2 * w * w));
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const x = i / N;
    let y = 0.10 + 0.45 * x + bump(x, 0.42, 0.07, 0.36) + bump(x, 0.80, 0.07, 0.30) - bump(x, 0.58, 0.05, 0.10)
          + 0.035 * Math.sin(x * 37 + 0.7) + (rnd() - 0.5) * 0.03;
    pts.push([x * W, H - 6 - y * 62]);
  }
  const NS = 'http://www.w3.org/2000/svg';
  const add = (parent, n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); parent.appendChild(e); return e; };
  const el = (n, a) => add(svg, n, a);
  const path = (dy) => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + (p[1] + dy).toFixed(1)).join(' ');
  const line = path(0);
  const youI = Math.round(N * 0.6), you = pts[youI];
  const defs = el('defs', {});
  const clip = (id, x0, x1) => add(add(defs, 'clipPath', { id }), 'rect', { x: x0, y: 0, width: x1 - x0, height: H });
  clip('done', 0, you[0]); clip('ahead', you[0], W);
  const pat = add(defs, 'pattern', { id: 'hatch', width: 3.6, height: 3.6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(-35)' });
  add(pat, 'rect', { width: 1.1, height: 3.6, fill: tint, opacity: .5 });
  const g = add(defs, 'linearGradient', { id: 'fade', x1: 0, y1: 0, x2: 0, y2: 1 });
  add(g, 'stop', { offset: 0, 'stop-color': tint, 'stop-opacity': .5 });
  add(g, 'stop', { offset: 1, 'stop-color': tint, 'stop-opacity': 0 });
  const area = line + ` L ${W} ${H} L 0 ${H} Z`;
  for (let k = 1; k <= 8; k++)
    el('path', { d: path(k * 5.5), fill: 'none', stroke: dim, 'stroke-width': .9, 'clip-path': 'url(#ahead)', opacity: (1 - k / 11).toFixed(2) });
  el('path', { d: area, fill: 'url(#fade)', 'clip-path': 'url(#done)' });
  el('path', { d: area, fill: 'url(#hatch)', 'clip-path': 'url(#done)' });
  el('path', { d: line, fill: 'none', stroke: mid, 'stroke-width': 1.8, 'stroke-dasharray': '1.5 3.2', 'stroke-linecap': 'round', 'clip-path': 'url(#ahead)' });
  el('path', { d: line, fill: 'none', stroke: tint, 'stroke-width': 2.6, 'stroke-linejoin': 'round', 'clip-path': 'url(#done)' });
  // summit flag (highest point ahead of the runner)
  const top = pts.slice(youI).reduce((a, b) => (b[1] < a[1] ? b : a));
  el('line', { x1: top[0], y1: top[1] - 2, x2: top[0], y2: top[1] - 15, stroke: '#fff', 'stroke-width': 1.3 });
  el('path', { d: `M ${top[0]} ${top[1] - 15} l 8 3 l -8 3 z`, fill: '#fff' });
  // runner: drop line, halo, ring
  el('line', { x1: you[0], y1: you[1], x2: you[0], y2: H, stroke: tint, 'stroke-width': 1, opacity: .8 });
  el('circle', { cx: you[0], cy: you[1], r: 9, fill: tint, opacity: .16 });
  el('circle', { cx: you[0], cy: you[1], r: 4, fill: '#000', stroke: tint, 'stroke-width': 2.4 });
  // the climb callout sits left of the flag, above the line
  })();
</script>
</body>
</html>
