<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calamondin Tapes · Listening room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opendesigner/build/css/tokens.css">
<style>
  /* Type roles (three sizes): caption 13, body 16, headline 25. Weights 400 / 500 / 600 / 700. */
  /* Outside the tokens, on purpose: the room takes a deep tint of the cover's darkest green, and the cover's two greens
     (the seedlings and the tray) are drawn colours, not tokens. The cover is the label's own art, drawn in code below. */
  :root { --room: rgb(12 16 13); --edge: 92px; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: var(--ds-text-body-md); color: var(--ds-color-text-primary); background: var(--room); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .ic { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid var(--ds-color-border-focus); outline-offset: 2px; }

  .top { height: 64px; display: flex; align-items: center; gap: var(--ds-space-16); padding: 0 var(--edge); }
  .brand { display: flex; align-items: center; gap: var(--ds-space-8); font-weight: 700; letter-spacing: -0.01em; }
  .brand svg { width: 22px; height: 22px; }
  .top .room { color: var(--ds-color-text-secondary); }
  .top .vr { width: 1px; height: 16px; background: var(--ds-color-neutral-alpha-dark-5); }
  .top .right { margin-left: auto; display: flex; align-items: center; gap: var(--ds-space-8); }
  .top .left { color: var(--ds-color-text-secondary); font-size: var(--ds-font-size-13); margin: 0 var(--ds-space-4) 0 var(--ds-space-8); }
  .pill { display: inline-flex; align-items: center; height: 36px; padding: 0 var(--ds-space-16); border-radius: var(--ds-radius-full); box-shadow: inset 0 0 0 1px var(--ds-color-neutral-alpha-dark-6); font-weight: 600; font-size: var(--ds-font-size-13); }
  .iconbtn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--ds-radius-full); color: var(--ds-color-text-secondary); }
  .iconbtn .ic { width: 18px; height: 18px; }

  .stage { display: grid; grid-template-columns: 400px 1fr; column-gap: 64px; padding: 32px var(--edge) 0; }
  .cover { width: 400px; height: 400px; border-radius: var(--ds-radius-8); overflow: hidden; position: relative; }
  .cover svg { width: 100%; height: 100%; display: block; }

  .side { display: flex; flex-direction: column; }
  .kicker { font-size: var(--ds-font-size-13); line-height: 20px; color: var(--ds-color-text-secondary); font-weight: 500; }
  .title-row { display: flex; align-items: center; gap: var(--ds-space-12); margin-top: var(--ds-space-8); }
  h1 { margin: 0; font-size: var(--ds-font-size-25); line-height: 32px; font-weight: 700; letter-spacing: -0.02em; }
  .by { margin-top: var(--ds-space-4); color: var(--ds-color-text-secondary); line-height: 24px; }
  .by a { color: var(--ds-color-text-primary); text-decoration: none; font-weight: 500; }
  .save { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--ds-radius-full); box-shadow: inset 0 0 0 1px var(--ds-color-neutral-alpha-dark-6); color: var(--ds-color-text-primary); }
  .save .ic { width: 18px; height: 18px; fill: currentColor; stroke: none; }

  .controls { display: flex; align-items: center; gap: var(--ds-space-16); margin-top: var(--ds-space-32); }
  .ctl { width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--ds-radius-full); color: var(--ds-color-text-primary); }
  .ctl .ic { fill: currentColor; stroke: none; width: 22px; height: 22px; }
  .ctl.line .ic { fill: none; stroke: currentColor; color: var(--ds-color-text-secondary); width: 20px; height: 20px; }
  .play { width: 56px; height: 56px; border-radius: var(--ds-radius-full); background: var(--ds-color-neutral-dark-12); display: grid; place-items: center; }
  .play .ic { width: 22px; height: 22px; fill: var(--ds-color-neutral-dark-1); stroke: none; }
  .ctl.on { position: relative; margin-left: var(--ds-space-8); }
  .ctl.on .ic { stroke: var(--ds-color-text-primary); }
  .ctl.on::after { content: ""; position: absolute; bottom: 2px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--ds-color-text-primary); }
  .vol { margin-left: var(--ds-space-32); display: flex; align-items: center; gap: var(--ds-space-12); color: var(--ds-color-text-secondary); font-size: var(--ds-font-size-13); }
  .vol .ic { width: 18px; height: 18px; }
  .vol .track { width: 112px; height: 4px; border-radius: 2px; background: var(--ds-color-neutral-alpha-dark-6); position: relative; }
  .vol .track i { position: absolute; left: 0; top: 0; bottom: 0; width: 64%; border-radius: 2px; background: var(--ds-color-neutral-dark-11); }

  .liner { margin: var(--ds-space-32) 0 0; max-width: 520px; color: var(--ds-color-text-secondary); line-height: 24px; }
  .queue { margin-top: auto; }
  .qh { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: var(--ds-space-8); border-bottom: 1px solid var(--ds-color-neutral-alpha-dark-4); }
  .qh b { font-weight: 600; }
  .qh span, .sub { font-size: var(--ds-font-size-13); color: var(--ds-color-text-secondary); }
  .sub { display: flex; justify-content: space-between; align-items: flex-end; height: 36px; padding-bottom: var(--ds-space-6); border-bottom: 1px solid var(--ds-color-neutral-alpha-dark-3); }
  .row { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; height: 40px; border-bottom: 1px solid var(--ds-color-neutral-alpha-dark-3); color: var(--ds-color-text-secondary); font-size: var(--ds-font-size-13); }
  .row:last-child { border-bottom: 0; }
  .row .n { font-size: var(--ds-font-size-13); color: var(--ds-color-text-tertiary); }
  .row .d { font-size: var(--ds-font-size-13); color: var(--ds-color-text-secondary); }

  /* The scrubber is the whole side of the tape: you hear a cassette a side at a time. */
  .tape { padding: 48px var(--edge) 0; }
  .labels { position: relative; height: 32px; font-size: var(--ds-font-size-25); line-height: 32px; font-weight: 500; letter-spacing: -0.01em; color: var(--ds-color-text-secondary); }
  .labels span { position: absolute; top: 0; white-space: nowrap; }
  .labels span b { font-weight: 500; color: var(--ds-color-text-tertiary); margin-right: var(--ds-space-6); }
  .labels span.cur { color: var(--ds-color-text-primary); font-weight: 700; }
  .wave { position: relative; height: 176px; margin-top: var(--ds-space-16); }
  .wave canvas { width: 100%; height: 100%; display: block; }
  .head { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--ds-color-text-primary); }
  .times { display: flex; justify-content: space-between; margin-top: var(--ds-space-12); font-size: var(--ds-font-size-16); color: var(--ds-color-text-secondary); }
  .times b { color: var(--ds-color-text-primary); font-weight: 500; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 20 20"><path d="M12 4.5 6.5 10l5.5 5.5"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 20 20"><path d="M3 6h2.5c3.5 0 4.5 8 9 8H17M3 14h2.5c1.3 0 2.2-1 3-2.3M11.3 8.2C12 7 12.9 6 14.5 6H17M15 4l2 2-2 2M15 12l2 2-2 2"/></symbol>
  <symbol id="i-prev" viewBox="0 0 20 20"><rect x="4" y="4.5" width="2" height="11" rx="1"/><path d="M16 5.3v9.4a.7.7 0 0 1-1.1.6L8.2 10.6a.7.7 0 0 1 0-1.2l6.7-4.7a.7.7 0 0 1 1.1.6Z"/></symbol>
  <symbol id="i-next" viewBox="0 0 20 20"><rect x="14" y="4.5" width="2" height="11" rx="1"/><path d="M4 5.3v9.4a.7.7 0 0 0 1.1.6l6.7-4.7a.7.7 0 0 0 0-1.2L5.1 4.7a.7.7 0 0 0-1.1.6Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 20 20"><rect x="5" y="4" width="3.5" height="12" rx="1"/><rect x="11.5" y="4" width="3.5" height="12" rx="1"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 20 20"><path d="M4 9V8a2.5 2.5 0 0 1 2.5-2.5H16M13.5 3 16 5.5 13.5 8M16 11v1a2.5 2.5 0 0 1-2.5 2.5H4M6.5 17 4 14.5 6.5 12"/></symbol>
  <symbol id="i-vol" viewBox="0 0 20 20"><path d="M3.5 8v4h3l4 3.5v-11l-4 3.5h-3ZM13.5 7.5a3.5 3.5 0 0 1 0 5M15.5 5.5a6.5 6.5 0 0 1 0 9"/></symbol>
  <symbol id="i-heart" viewBox="0 0 20 20"><path d="M10 16.5s-6.5-3.8-6.5-8.6A3.4 3.4 0 0 1 10 6.1a3.4 3.4 0 0 1 6.5 1.8c0 4.8-6.5 8.6-6.5 8.6Z"/></symbol>
  <symbol id="i-speaker" viewBox="0 0 20 20"><rect x="5" y="2.5" width="10" height="15" rx="2"/><circle cx="10" cy="11.5" r="3"/><path d="M10 6h.01" stroke-width="2"/></symbol>
  <symbol id="i-more" viewBox="0 0 20 20"><path d="M5 10h.01M10 10h.01M15 10h.01" stroke-width="2.4"/></symbol>
  <symbol id="i-notes" viewBox="0 0 20 20"><path d="M6 3h6l3 3v10.5a.5.5 0 0 1-.5.5h-8.5a.5.5 0 0 1-.5-.5v-13A.5.5 0 0 1 6 3Z"/><path d="M12 3v3h3M7.5 10h5M7.5 13h3.5"/></symbol>
</svg>

<header class="top">
  <span class="brand"><svg viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="10.5" fill="var(--ds-color-accent-dark-9)"/><circle cx="11" cy="11" r="8.6" fill="#ffe2bf"/><g fill="var(--ds-color-accent-dark-9)"><path d="M11 11 L18.00 8.59 A7.4 7.4 0 0 1 18.00 13.41 Z" transform="translate(1.10 0.00)"/><path d="M11 11 L17.65 14.24 A7.4 7.4 0 0 1 14.24 17.65 Z" transform="translate(0.78 0.78)"/><path d="M11 11 L13.41 18.00 A7.4 7.4 0 0 1 8.59 18.00 Z" transform="translate(0.00 1.10)"/><path d="M11 11 L7.76 17.65 A7.4 7.4 0 0 1 4.35 14.24 Z" transform="translate(-0.78 0.78)"/><path d="M11 11 L4.00 13.41 A7.4 7.4 0 0 1 4.00 8.59 Z" transform="translate(-1.10 0.00)"/><path d="M11 11 L4.35 7.76 A7.4 7.4 0 0 1 7.76 4.35 Z" transform="translate(-0.78 -0.78)"/><path d="M11 11 L8.59 4.00 A7.4 7.4 0 0 1 13.41 4.00 Z" transform="translate(-0.00 -1.10)"/><path d="M11 11 L14.24 4.35 A7.4 7.4 0 0 1 17.65 7.76 Z" transform="translate(0.78 -0.78)"/></g></svg>Calamondin Tapes</span>
  <span class="vr" aria-hidden="true"></span>
  <span class="room">Listening room</span>
  <div class="right">
    <button class="pill" type="button">Buy the cassette, $12</button>
  </div>
</header>

<main aria-label="Now playing">
  <div class="stage">
    <div class="cover"><svg id="cover" viewBox="0 0 464 464" role="img" aria-label="Cover of Heat Lamp Lullabies: nine seedlings in a row of a seed tray under an orange heat lamp"></svg></div>

    <section class="side">
      <div class="kicker">Side A · track 3 of 9 · 1:47 of 3:53</div>
      <div class="title-row"><h1>Sodium Summer</h1><button class="save" type="button" aria-label="Saved to your library" aria-pressed="true"><svg class="ic"><use href="#i-heart"/></svg></button></div>
      <div class="by"><a href="#">Juniper Static</a> · Heat Lamp Lullabies · 2026</div>

      <div class="controls">
        <button class="ctl" type="button" aria-label="Previous track"><svg class="ic"><use href="#i-prev"/></svg></button>
        <button class="play" type="button" aria-label="Pause"><svg class="ic"><use href="#i-pause"/></svg></button>
        <button class="ctl" type="button" aria-label="Next track"><svg class="ic"><use href="#i-next"/></svg></button>
        <button class="ctl line on" type="button" aria-label="Repeat the tape" aria-pressed="true"><svg class="ic"><use href="#i-repeat"/></svg></button>
        <div class="vol">
          <svg class="ic"><use href="#i-vol"/></svg>
          <div class="track" role="slider" aria-label="Volume" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100"><i></i></div>
        </div>
      </div>


      <div class="queue">
        <div class="qh"><b>Then side B</b><span>14:18</span></div>
        <div class="row"><span class="n">6</span><span class="t">Glass Orchard</span><span class="d">4:07</span></div>
        <div class="row"><span class="n">7</span><span class="t">Second Week of March</span><span class="d">3:36</span></div>
        <div class="row"><span class="n">8</span><span class="t">Warm Front</span><span class="d">3:19</span></div>
        <div class="row"><span class="n">9</span><span class="t">Last Frost</span><span class="d">3:16</span></div>
      </div>
    </section>
  </div>

  <section class="tape" aria-label="Side A">
    <div class="labels" id="labels" aria-hidden="true"></div>
    <div class="wave" role="slider" aria-label="Seek within side A" aria-valuemin="0" aria-valuemax="1194" aria-valuenow="588" aria-valuetext="9 minutes 48 seconds of 19 minutes 54 seconds" tabindex="0"><canvas id="wave"></canvas><span class="head" id="head"></span></div>
    <div class="times"><span><b>9:48</b> into side A</span><span>−10:06 · side A 19:54</span></div>
  </section>
</main>

<script>
  // The cover, drawn: the label's own art. One heat lamp over one row of the seed tray, seen from the side. There are nine
  // cells, one per track, and each seedling's height is its track's length (2:58 to 5:02); a thicker wall parts side A from
  // side B. Two inks, green and the lamp's pale light; the seedlings turn dark green where they stand in front of the lamp.
  // Orange is kept for the player (what has played), so the cover does not use it.
  (() => {
    const svg = document.getElementById("cover"), NS = "http://www.w3.org/2000/svg", S = 464;
    const mk = (tag, a, parent = svg, text) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (text) e.textContent = text; parent.appendChild(e); return e; };
    let sd = 1931; const rn = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
    const LEN = [221, 260, 233, 178, 302, 247, 216, 199, 196];
    const GROUND = 372, X0 = 36, X1 = 428, SIDE_GAP = 10;
    const pitch = (X1 - X0 - SIDE_GAP) / 9;
    const lamp = { x: 236, y: 196, r: 118 };
    const C = { field: "#0e1a12", tray: "#0a120c", wall: "#1c2b20", leaf: "#5b8f4e", dark: "#123a1f", light: "#e9edd8", paper: "#e9edd8" };
    mk("rect", { width: S, height: S, fill: C.field });
    mk("circle", { cx: lamp.x, cy: lamp.y, r: lamp.r, fill: C.light });
    // the tray row: soil line, nine cells, the side wall
    mk("rect", { x: X0 - 8, y: GROUND, width: X1 - X0 + 16, height: 52, rx: 4, fill: C.tray });
    for (let i = 0; i <= 9; i++) {
      const x = X0 + i * pitch + (i > 5 ? SIDE_GAP : i === 5 ? SIDE_GAP / 2 : 0);
      mk("rect", { x: (x - (i === 5 ? 3 : 1)).toFixed(1), y: GROUND, width: i === 5 ? 6 : 2, height: 52, fill: C.wall });
    }
    mk("rect", { x: X0 - 8, y: GROUND - 2, width: X1 - X0 + 16, height: 3, rx: 1.5, fill: C.wall });
    // a seed leaf: narrow at the stem, round at its outer end
    const leafD = (L, W) => `M0 0C${L * 0.25} ${-W * 0.5} ${L * 0.55} ${-W} ${L * 0.82} ${-W * 0.8}C${L * 1.06} ${-W * 0.58} ${L * 1.06} ${W * 0.58} ${L * 0.82} ${W * 0.8}C${L * 0.55} ${W} ${L * 0.25} ${W * 0.5} 0 0Z`;
    const plants = LEN.map((len, i) => {
      const cx = X0 + (i + 0.5) * pitch + (i >= 5 ? SIDE_GAP : 0);
      const h = 92 + (len - 178) / (302 - 178) * 128, lean = (rn() - 0.5) * 18;
      return { cx, h, lean, tilt: (rn() - 0.5) * 14, a1: 28 + rn() * 16, a2: 30 + rn() * 16, s: 0.92 + rn() * 0.2, tall: len > 240 };
    });
    function draw(color, parent) {
      const g = mk("g", { fill: color, stroke: color }, parent);
      plants.forEach((p) => {
        const tx = p.cx + p.lean, ty = GROUND - p.h;
        mk("path", { d: `M${p.cx} ${GROUND}Q${p.cx - p.lean * 0.4} ${GROUND - p.h * 0.55} ${tx} ${ty}`, fill: "none", "stroke-width": 3.2, "stroke-linecap": "round" }, g);
        const top = mk("g", { transform: `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) rotate(${p.tilt.toFixed(1)}) scale(${p.s.toFixed(2)})`, stroke: "none" }, g);
        mk("path", { d: leafD(24, 10), transform: `rotate(${(-p.a1).toFixed(1)})` }, top);
        mk("path", { d: leafD(22, 9.5), transform: `rotate(${(180 + p.a2).toFixed(1)})` }, top);
        if (p.tall) { mk("path", { d: leafD(11, 5), transform: "rotate(-70)" }, top); mk("path", { d: leafD(10, 4.6), transform: "rotate(-112)" }, top); }
      });
    }
    draw(C.leaf, svg);
    const defs = mk("defs", {}); const cp = mk("clipPath", { id: "lamp" }, defs); mk("circle", { cx: lamp.x, cy: lamp.y, r: lamp.r }, cp);
    draw(C.dark, mk("g", { "clip-path": "url(#lamp)" }));
    // the sleeve lettering, set like a J-card
    const t = { "font-family": "Manrope, sans-serif", fill: C.paper };
    mk("text", { ...t, x: 32, y: 44, "font-size": 16, "font-weight": 700, "letter-spacing": "-0.01em" }, svg, "Juniper Static");
    mk("text", { ...t, x: 32, y: 66, "font-size": 16, "font-weight": 400, opacity: 0.78 }, svg, "Heat Lamp Lullabies");
    mk("text", { ...t, x: 432, y: 44, "font-size": 13, "font-weight": 600, "text-anchor": "end", opacity: 0.6 }, svg, "CT 014");
  })();

  // Side A of the tape, track by track (seconds). The bars are drawn loudness, not decoded audio.
  const TRACKS = [["Low Bulb", 221], ["Neon Tidepool", 260], ["Sodium Summer", 233], ["Brooder", 178], ["Afterglow, Slowly", 302]];
  const LEN = TRACKS.reduce((a, t) => a + t[1], 0), POS = 221 + 260 + 107;   // 1194 s; 9:48
  const starts = []; TRACKS.reduce((a, t) => (starts.push(a), a + t[1]), 0);
  const c = document.getElementById("wave"), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  // geometry: bars of 3 px every 5 px, with a 16 px gap before each track after the first
  const bw = 3, step = 5, GAP = 16;
  const usable = r.width - GAP * (TRACKS.length - 1);
  const xOf = t => { const k = starts.filter(st => t >= st).length - 1; return t / LEN * usable + k * GAP; };
  const le = document.getElementById("labels");
  TRACKS.forEach(([name], i) => {
    const s = document.createElement("span");
    s.innerHTML = `<b>${i + 1}</b>${name}`;
    s.style.left = xOf(starts[i]) + "px";
    if (i === 2) s.className = "cur";
    le.appendChild(s);
  });
  document.getElementById("head").style.left = xOf(POS) + "px";
  let seed = 41;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const css = getComputedStyle(document.documentElement);
  const ahead = css.getPropertyValue("--ds-color-neutral-alpha-dark-8").trim();
  const accent = css.getPropertyValue("--ds-color-accent-dark-9").trim();
  // drawn loudness, not decoded audio: each track has its own shape (intro, swell, fade), with seeded variation.
  // Colour: what has played is orange, the rest of the side is grey.
  const SHAPE = [
    [[0, .14], [.22, .42], [.55, .6], [.82, .52], [1, .16]],
    [[0, .3], [.28, .74], [.42, .32], [.56, .38], [.8, .86], [1, .22]],
    [[0, .22], [.18, .34], [.27, .8], [.48, .84], [.57, .38], [.72, .92], [.92, .7], [1, .26]],
    [[0, .26], [.1, .4], [.88, .43], [1, .14]],
    [[0, .36], [.16, .82], [.32, .7], [1, .07]],
  ];
  const env = (k, u) => { const pts = SHAPE[k]; for (let i = 1; i < pts.length; i++) if (u <= pts[i][0]) { const [a, va] = pts[i - 1], [b, vb] = pts[i]; const f = (u - a) / (b - a); return va + (vb - va) * (0.5 - Math.cos(f * Math.PI) / 2); } return pts[pts.length - 1][1]; };
  let walk = 0;
  TRACKS.forEach(([, len], k) => {
    const x0 = xOf(starts[k]), w = len / LEN * usable, bars = Math.floor(w / step);
    for (let j = 0; j < bars; j++) {
      const u = j / bars, t = starts[k] + u * len;
      walk = walk * 0.75 + (rnd() - 0.5) * 0.34;
      const h = Math.max(3, Math.min(1, env(k, u) * (0.88 + walk + (rnd() - 0.5) * 0.16)) * r.height);
      g.fillStyle = t > POS ? ahead : accent;
      g.beginPath(); g.roundRect(x0 + j * step, (r.height - h) / 2, bw, h, 1.5); g.fill();
    }
  });
</script>
</body>
</html>
