<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parlo: speaking feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opendesigner/build/css/tokens.css">
<style>
  /* Round 4: a speaking exercise after the learner's attempt. Italian in Spectral, the interface in IBM Plex Sans.
     One accent (vermilion, --ds-color-accent-light-*) with one job: what to fix. */
  :root {
    --ink: var(--ds-color-text-primary);
    --ink-2: var(--ds-color-text-secondary);
    --fix: var(--ds-color-accent-light-9);
    --rule: var(--ds-color-border-subtle);
    --gutter: var(--ds-space-20);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ds-color-surface-raised); }
  body { width: 390px; height: 844px; overflow: hidden; position: relative; color: var(--ink);
    font: 400 var(--ds-font-size-17)/22px var(--ds-font-family-text); -webkit-font-smoothing: antialiased; }
  button { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--ds-space-8); }
  button:focus-visible { outline: 2px solid var(--ds-color-border-focus); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .it { font-family: var(--ds-font-family-display); }

  .status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: var(--ds-space-4) 30px 0 46px; }
  .status time { font: 600 var(--ds-font-size-17)/1 var(--ds-font-family-text); letter-spacing: -0.01em; }
  .status .sys { display: flex; gap: var(--ds-space-6); align-items: center; }
  .status svg { display: block; fill: var(--ink); }

  /* The close glyph's ink starts on the 20 pt text edge. */
  .top { position: absolute; top: 54px; left: 4px; right: var(--gutter); height: 44px; display: flex; align-items: center; gap: var(--ds-space-12); }
  .top .close { width: 44px; height: 44px; color: var(--ink); }
  .top .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--ds-color-neutral-light-4); overflow: hidden; }
  .top .bar i { display: block; width: 60%; height: 100%; background: var(--ink); border-radius: 3px; }
  .top .count { font: 500 var(--ds-font-size-13)/18px var(--ds-font-family-text); color: var(--ink-2); }

  .prompt { position: absolute; top: 126px; left: var(--gutter); right: var(--gutter); }
  .prompt p { font: 500 var(--ds-font-size-17)/22px var(--ds-font-family-text); }
  .prompt p span { font-weight: 400; color: var(--ink-2); }

  .said { position: absolute; top: 204px; left: var(--gutter); right: var(--gutter); }
  .said .line { font: 400 var(--ds-font-size-22)/30px var(--ds-font-family-display); }
  .said .line u { text-decoration: underline 2px var(--fix); text-underline-offset: 5px; }

  .said .play { margin-top: var(--ds-space-8); margin-left: -12px; display: flex; gap: var(--ds-space-8); }
  .tb { height: 44px; padding: 0 var(--ds-space-12); font: 600 var(--ds-font-size-15)/1 var(--ds-font-family-text); color: var(--ink); gap: var(--ds-space-6); }
  .tb span { font-weight: 400; color: var(--ink-2); }

  .score { position: absolute; top: 344px; left: var(--gutter); right: var(--gutter); font: 600 var(--ds-font-size-17)/22px var(--ds-font-family-text); }
  .score span { font-weight: 400; color: var(--ink-2); }

  .fix { position: absolute; top: 400px; left: var(--gutter); right: var(--gutter); }
  .fix header { display: flex; justify-content: space-between; align-items: center; }
  .fix h2 { font: 400 var(--ds-font-size-34)/40px var(--ds-font-family-display); }
  .fix .slow { margin-right: -12px; }
  .fix h2 small { margin-left: var(--ds-space-8); font: 400 var(--ds-font-size-17)/22px var(--ds-font-family-text); color: var(--ink-2); }
  .fix p { margin-top: var(--ds-space-8); font: 400 var(--ds-font-size-17)/22px var(--ds-font-family-text); color: var(--ink-2); }
  .fix p b { color: var(--ink); font-weight: 500; }

  /* Loudness across the word, both recordings on one baseline, the loudest moment of each marked. */
  .curve { margin-top: var(--ds-space-40); }
  .curve svg { display: block; overflow: visible; }
  .curve text { font: 400 var(--ds-font-size-13)/1 var(--ds-font-family-text); fill: var(--ink-2); }
  .curve .syl { font: 400 var(--ds-font-size-17)/1 var(--ds-font-family-display); fill: var(--ink); }

  .actions { position: absolute; left: var(--gutter); right: var(--gutter); bottom: 42px; display: grid; grid-template-columns: 1fr 1fr; gap: var(--ds-space-12); }
  .actions button { height: 52px; border-radius: var(--ds-radius-full); font: 600 var(--ds-font-size-17)/1 var(--ds-font-family-text); }
  .actions .again { background: var(--ds-color-neutral-light-3); color: var(--ink); }
  .actions .next { background: var(--ink); color: var(--ds-color-text-inverse); }

  .home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--ink); }
</style>
</head>
