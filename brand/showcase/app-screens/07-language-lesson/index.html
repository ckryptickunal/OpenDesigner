<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parlo: speaking feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opendesigner/build/css/tokens.css">
<style>
  /* Round 4: a speaking exercise after the learner's attempt. Italian in Spectral, the interface in IBM Plex Sans.
     One accent (vermilion, --ds-color-accent-light-*) with one job: what to fix. */
  :root {
    --ink: var(--ds-color-text-primary);
    --ink-2: var(--ds-color-text-secondary);
    --fix: var(--ds-color-accent-light-9);
    --rule: var(--ds-color-border-subtle);
    --gutter: var(--ds-space-20);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ds-color-surface-raised); }
  body { width: 390px; height: 844px; overflow: hidden; position: relative; color: var(--ink);
    font: 400 var(--ds-font-size-17)/22px var(--ds-font-family-text); -webkit-font-smoothing: antialiased; }
  button { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--ds-space-8); }
  button:focus-visible { outline: 2px solid var(--ds-color-border-focus); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .it { font-family: var(--ds-font-family-display); }

  .status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: var(--ds-space-4) 30px 0 46px; }
  .status time { font: 600 var(--ds-font-size-17)/1 var(--ds-font-family-text); letter-spacing: -0.01em; }
  .status .sys { display: flex; gap: var(--ds-space-6); align-items: center; }
  .status svg { display: block; fill: var(--ink); }

  /* The close glyph's ink starts on the 20 pt text edge. */
  .top { position: absolute; top: 54px; left: 4px; right: var(--gutter); height: 44px; display: flex; align-items: center; gap: var(--ds-space-12); }
  .top .close { width: 44px; height: 44px; color: var(--ink); }
  .top .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--ds-color-neutral-light-4); overflow: hidden; }
  .top .bar i { display: block; width: 60%; height: 100%; background: var(--ink); border-radius: 3px; }
  .top .count { font: 500 var(--ds-font-size-13)/18px var(--ds-font-family-text); color: var(--ink-2); }

  /* Round 5: one subject, the stress in caffè, set in type. Each recording is drawn as its two syllables at the size
     of their loudness, so the learner's caf is large and the native speaker's fè is large. The sentence and the score
     are context, set smaller above. Spectral (Italian): 81 and 34 for the syllables, 22 for the sentence. */
  .said { position: absolute; top: 120px; left: var(--gutter); right: var(--gutter); }
  .said .line { font: 400 var(--ds-font-size-22)/30px var(--ds-font-family-display); }
  .said .line u { text-decoration: underline 2px var(--fix); text-underline-offset: 5px; }
  .said .score { margin-top: var(--ds-space-8); font: 400 var(--ds-font-size-15)/20px var(--ds-font-family-text); color: var(--ink-2); }

  .fix { position: absolute; top: 246px; left: var(--gutter); right: var(--gutter); }
  .fix h2 { font: 600 var(--ds-font-size-22)/28px var(--ds-font-family-text); letter-spacing: -0.01em; }
  .fix .ipa { margin-top: var(--ds-space-4); font: 400 var(--ds-font-size-17)/22px var(--ds-font-family-text); color: var(--ink-2); }
  .takes { margin-top: var(--ds-space-16); }
  .take { display: grid; grid-template-columns: 44px 1fr; column-gap: var(--ds-space-16); align-items: end; padding: var(--ds-space-20) 0; }
  .take .play { margin-bottom: var(--ds-space-20); }
  .take + .take { padding-top: var(--ds-space-8); }
  .take .who { font: 500 var(--ds-font-size-13)/18px var(--ds-font-family-text); color: var(--ink-2); }
  .take .syl { display: flex; flex-wrap: wrap; align-content: flex-end; align-items: baseline; gap: 0 var(--ds-space-8); font-family: var(--ds-font-family-display); font-weight: 400; color: var(--ink-2); line-height: 1; height: 124px; padding-bottom: var(--ds-space-16); border-bottom: 1.5px solid var(--ds-color-neutral-light-5); } /* both syllables sit on one drawn baseline, set at the size of their loudness */
  .take .syl .lo { font-size: var(--ds-font-size-34); }
  .take .syl .hi { font-size: var(--ds-font-size-81); letter-spacing: -0.01em; color: var(--ink); }
  .take .syl .hi.wrong { color: var(--fix); }
  .take .syl .lo + .hi { letter-spacing: 0.04em; } /* clears the f's hook from the grave accent at display size */
  .play { width: 44px; height: 44px; border-radius: var(--ds-radius-full); background: var(--ds-color-neutral-light-3); color: var(--ink); }
  .fix .why { margin-top: var(--ds-space-20); font: 400 var(--ds-font-size-17)/22px var(--ds-font-family-text); color: var(--ink-2); }
  .fix .why b { color: var(--ink); font-weight: 500; }

  .actions { position: absolute; left: var(--gutter); right: var(--gutter); bottom: 42px; display: grid; grid-template-columns: 1fr 1fr; gap: var(--ds-space-12); }
  .actions button { height: 52px; border-radius: var(--ds-radius-full); font: 600 var(--ds-font-size-17)/1 var(--ds-font-family-text); }
  .actions .again { background: var(--ds-color-neutral-light-3); color: var(--ink); }
  .actions .next { background: var(--ink); color: var(--ds-color-text-inverse); }

  .home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--ink); }
</style>
</head>
<body>
<div class="status" aria-hidden="true">
  <time>07:48</time>
  <div class="sys">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.3c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8 .7 10.2 10.2 0 0 0 .9 3.5L2 4.7a8.6 8.6 0 0 1 6-2.4Zm0 3.3c1.4 0 2.7.5 3.7 1.4l1.1-1.2A7 7 0 0 0 8 3.9a7 7 0 0 0-4.8 1.9l1.1 1.2A5.4 5.4 0 0 1 8 5.6Zm0 3.2c.6 0 1.1.2 1.5.6L8 11 6.5 9.4c.4-.4.9-.6 1.5-.6Z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" stroke-opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2.5"/><path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2Z" fill-opacity=".4"/></svg>
  </div>
</div>

<div class="top">
  <button class="close" aria-label="End lesson"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="bar" role="progressbar" aria-label="Exercise 6 of 10" aria-valuemin="0" aria-valuemax="10" aria-valuenow="6"><i></i></div>
  <span class="count num" aria-hidden="true">6 of 10</span>
</div>

<main>
  <div class="said">
    <p class="line it" lang="it">Vorrei un <u>caffè</u> e un&nbsp;cornetto, per&nbsp;favore.</p>
    <p class="score num">7 of 8 words clear · 1 to practise</p>
  </div>

  <section class="fix" aria-labelledby="fix-word">
    <h2 id="fix-word">Stress the last syllable</h2>
    <div class="takes">
      <div class="take">
        <button class="play" aria-label="Play your caffè"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5Z"/></svg></button>
        <div><p class="who">You</p><p class="syl it" lang="it" aria-label="You stressed caf"><span class="hi wrong">caf</span><span class="lo">fè</span></p></div>
      </div>
      <div class="take">
        <button class="play" aria-label="Play the native speaker’s caffè"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5Z"/></svg></button>
        <div><p class="who">Native speaker</p><p class="syl it" lang="it" aria-label="The native speaker stresses fè"><span class="lo">caf</span><span class="hi">fè</span></p></div>
      </div>
    </div>
    <p class="why"><span class="it" lang="it">caffè</span> is /kafˈfɛ/. You leaned on <b class="it" lang="it">caf</b>, as in English “coffee”.</p>
  </section>

  <div class="actions">
    <button class="again"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></svg>Try again</button>
    <button class="next">Continue</button>
  </div>
</main>
<div class="home-ind" aria-hidden="true"></div>
</body>
</html>
