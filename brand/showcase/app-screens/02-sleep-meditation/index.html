<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lullwater: sleep story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opendesigner/build/css/tokens.css">
<style>
  /* Round 4: a photo-led player. One face (Albert Sans) and one confident number (the time left). One accent (peach, --ds-color-accent-dark-*) with one job: the sleep timer. */
  :root {
    --bg: var(--ds-color-neutral-dark-1);
    --ink: var(--ds-color-text-primary);
    --ink-2: var(--ds-color-text-secondary);
    --timer: var(--ds-color-accent-dark-11);
    --gutter: var(--ds-space-24);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { width: 390px; height: 844px; overflow: hidden; position: relative; color: var(--ink);
    font: 400 var(--ds-font-size-17)/22px var(--ds-font-family-text); -webkit-font-smoothing: antialiased; }
  button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; place-items: center; color: inherit; }
  button:focus-visible { outline: 2px solid var(--ds-color-border-focus); outline-offset: 2px; border-radius: var(--ds-radius-full); }
  .num { font-variant-numeric: tabular-nums; }
  svg [stroke], svg[stroke] * { vector-effect: non-scaling-stroke; }

  /* Story artwork: blue hour over still water, graded toward night. The two gradients carry legibility, not decoration. */
  .art { position: absolute; inset: 0 0 auto 0; height: 400px; overflow: hidden; }
  .art img { width: 390px; height: 400px; object-fit: cover; display: block; filter: brightness(.74) saturate(.7) contrast(1.06); }
  .art::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 170px; background: linear-gradient(rgb(0 0 0 / .6), rgb(0 0 0 / .4) 100px, rgb(0 0 0 / 0)); z-index: 1; }
  .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 0, transparent 205px, color-mix(in oklab, var(--bg) 60%, transparent) 280px, color-mix(in oklab, var(--bg) 90%, transparent) 345px, var(--bg) 400px); }

  .status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: var(--ds-space-4) 30px 0 46px; z-index: 2; }
  .status time { font: 600 var(--ds-font-size-17)/1 var(--ds-font-family-text); letter-spacing: -0.01em; }
  .status .sys { display: flex; gap: var(--ds-space-6); align-items: center; }
  .status svg { display: block; fill: var(--ink); }

  /* Nav glyphs sit on the 24 pt text edges: the chevron's ink starts at x = 24, the dots end at x = 366. */
  .nav { position: absolute; top: 54px; left: 0; right: 0; height: 44px; z-index: 2; }
  .nav button { position: absolute; top: 0; width: 44px; height: 44px; filter: drop-shadow(0 1px 2px rgb(0 0 0 / .35)); }
  .nav .down { left: 8px; } .nav .more { right: 9px; }
  .nav p { position: absolute; left: 0; right: 0; top: 13px; text-align: center; font: 600 var(--ds-font-size-13)/18px var(--ds-font-family-text); text-shadow: 0 1px 2px rgb(0 0 0 / .35); }
  .nav p span { font-weight: 400; opacity: .86; }

  .story { position: absolute; top: 288px; left: var(--gutter); right: var(--gutter); }
  .story .kind { font: 400 var(--ds-font-size-13)/18px var(--ds-font-family-text); color: var(--ink-2); }
  .story h1 { margin-top: var(--ds-space-4); font: 500 var(--ds-font-size-28)/34px var(--ds-font-family-text); letter-spacing: -0.015em; }
  .story .by { margin-top: var(--ds-space-2); color: var(--ink-2); }

  .timer { position: absolute; top: 404px; left: var(--gutter); right: var(--gutter); }
  .timer .t { display: flex; align-items: baseline; gap: var(--ds-space-12); font: 300 var(--ds-font-size-112)/112px var(--ds-font-family-display); letter-spacing: -0.03em; margin-left: -6px; }
  .timer .t small { font: 400 var(--ds-font-size-17)/22px var(--ds-font-family-text); letter-spacing: 0; color: var(--ink-2); }
  .timer .l { margin-top: var(--ds-space-8); font: 500 var(--ds-font-size-17)/22px var(--ds-font-family-text); color: var(--timer); }

  .scrub { position: absolute; top: 586px; left: var(--gutter); right: var(--gutter); }
  .scrub .track { position: relative; height: 4px; border-radius: 2px; background: var(--ds-color-neutral-alpha-dark-7); }
  .scrub .fill { width: 43.78%; height: 100%; border-radius: 2px; background: var(--ink); }

  /* Transport: five controls on equal centres (33, 114, 195, 276, 357), the outer glyphs' ink on the text edges. */
  .transport { position: absolute; top: 626px; left: 0; right: 0; height: 68px; }
  .transport button { position: absolute; top: 50%; transform: translate(-50%, -50%); }
  .transport .side { width: 44px; height: 44px; color: var(--ink-2); }
  .transport .side.on { color: var(--timer); }
  .transport .side.out { color: var(--ink); }
  .transport .skip { width: 44px; height: 44px; }
  .transport .skip em { position: absolute; inset: 0; display: grid; place-items: center; padding-top: 5px; font: 600 var(--ds-font-size-11)/1 var(--ds-font-family-text); font-style: normal; }
  .transport .play { width: 68px; height: 68px; border-radius: var(--ds-radius-full); background: var(--ink); color: var(--bg); }
  .transport .s1 { left: 33px; } .transport .s2 { left: 114px; } .transport .play { left: 195px; } .transport .s3 { left: 276px; } .transport .s4 { left: 357px; }

  .mix { position: absolute; top: 734px; left: var(--gutter); right: var(--gutter); height: 52px; display: flex; align-items: center; gap: var(--ds-space-12); border-top: 1px solid var(--ds-color-border-subtle); font: 400 var(--ds-font-size-17)/22px var(--ds-font-family-text); color: var(--ink-2); }
  .mix .name { flex: 1; color: var(--ink); }
  .mix svg { flex: none; }
  .mix .lvl { position: relative; width: 120px; height: 4px; border-radius: 2px; background: var(--ds-color-neutral-alpha-dark-7); }
  .mix .lvl i { display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--ink); }
  .mix .lvl b { position: absolute; top: 50%; left: 40%; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: var(--ds-radius-full); background: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .4); }

  .home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--ink); }
</style>
</head>
<body>
<div class="art" aria-hidden="true">
  <!-- Photo: Jörg Angeli, "Body of water at night", Unsplash (free licence), photo-1546273735-bea2e41924f1; cropped so the horizon sits at about 200 pt -->
  <img src="https://images.unsplash.com/photo-1546273735-bea2e41924f1?rect=0,592,2668,2736&w=1170&h=1200&fit=crop&q=80&auto=format" alt="">
</div>

<div class="status" aria-hidden="true">
  <time>23:22</time>
  <div class="sys">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.3c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8 .7 10.2 10.2 0 0 0 .9 3.5L2 4.7a8.6 8.6 0 0 1 6-2.4Zm0 3.3c1.4 0 2.7.5 3.7 1.4l1.1-1.2A7 7 0 0 0 8 3.9a7 7 0 0 0-4.8 1.9l1.1 1.2A5.4 5.4 0 0 1 8 5.6Zm0 3.2c.6 0 1.1.2 1.5.6L8 11 6.5 9.4c.4-.4.9-.6 1.5-.6Z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" style="stroke: var(--ink-2)"/><rect x="2" y="2" width="12" height="9" rx="2.5"/><path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2Z" style="fill: var(--ink-2)"/></svg>
  </div>
</div>

<div class="nav">
  <button class="down" aria-label="Minimise player"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
  <p>Wind Down <span>· Night 3 of 7</span></p>
  <button class="more" aria-label="More"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg></button>
</div>

<main>
  <div class="story">
    <p class="kind">Sleep story</p>
    <h1>Low tide at Merrow Bay</h1>
    <p class="by">Told by Oona Prentice</p>
  </div>

  <div class="timer" role="timer" aria-label="16 minutes 52 seconds left; the story fades out by 23:40">
    <div class="t"><span class="num">16:52</span><small>left</small></div>
    <p class="l">Fades out by 23:40</p>
  </div>

  <div class="scrub">
    <div class="track" role="slider" aria-label="Position" aria-valuemin="0" aria-valuemax="1800" aria-valuenow="788" aria-valuetext="13 minutes 8 seconds of 30 minutes" tabindex="0"><div class="fill"></div></div>
      </div>

  <div class="transport">
    <button class="side on s1" aria-label="Sleep timer: fades out by 23:40"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></button>
    <button class="skip s2" aria-label="Back 15 seconds"><svg width="36" height="36" viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a11 11 0 1 1-9.53 5.5"/><path d="M19.4 5 15.9 8.5l3.5 3.5"/></svg><em>15</em></button>
    <button class="play" aria-label="Pause"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4" width="4.2" height="16" rx="1.4"/><rect x="14.3" y="4" width="4.2" height="16" rx="1.4"/></svg></button>
    <button class="skip s3" aria-label="Forward 15 seconds"><svg width="36" height="36" viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a11 11 0 1 0 9.53 5.5"/><path d="M16.6 5 20.1 8.5l-3.5 3.5"/></svg><em>15</em></button>
    <button class="side out s4" aria-label="Play on: bedroom speaker"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 16.8a7.5 7.5 0 1 1 9.6 0"/><path d="M9.4 14.4a4.2 4.2 0 1 1 5.2 0"/><path d="m12 14.2 4 5.3H8Z"/></svg></button>
  </div>

  <div class="mix" role="group" aria-label="Sound mix">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 14.5a4 4 0 0 0-.6-8 5.5 5.5 0 0 0-10.6 1.6A3.3 3.3 0 0 0 7 14.5"/><path d="M8 17.5 7 20M12 16.5 11 19M16 17.5 15 20"/></svg>
    <span class="name">Rain on the reed beds</span>
    <span class="lvl" role="slider" aria-label="Rain volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" aria-valuetext="40%" tabindex="0"><i></i><b></b></span>
  </div>
</main>
<div class="home-ind" aria-hidden="true"></div>
</body>
</html>
