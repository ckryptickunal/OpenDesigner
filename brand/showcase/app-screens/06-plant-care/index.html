<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loam: Gus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opendesigner/build/css/tokens.css">
<style>
  /* Round 4: one plant's page. One face (Onest), one accent (moss, --ds-color-accent-light-*) with one job: watering (the events in the chart and the button). */
  :root {
    --ink: var(--ds-color-text-primary);
    --ink-2: var(--ds-color-text-secondary);
    --rule: var(--ds-color-border-subtle);
    --water: var(--ds-color-accent-light-9);
    --gutter: var(--ds-space-20);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ds-color-surface-raised); }
  body { width: 390px; height: 844px; overflow: hidden; position: relative; color: var(--ink);
    font: 400 var(--ds-font-size-17)/22px var(--ds-font-family-text); -webkit-font-smoothing: antialiased; }
  button { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  button:focus-visible { outline: 2px solid var(--ds-color-border-focus); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  /* The owner's own photo of the plant (here a free Unsplash photo), full bleed under the status bar. */
  .photo { position: absolute; top: 0; left: 0; width: 390px; height: 272px; overflow: hidden; background: var(--ds-color-neutral-light-3); }
  .photo img { display: block; width: 390px; height: 272px; object-fit: cover; }

  .status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: var(--ds-space-4) 30px 0 46px; z-index: 2; }
  .status time { font: 600 var(--ds-font-size-17)/1 var(--ds-font-family-text); letter-spacing: -0.01em; }
  .status .sys { display: flex; gap: var(--ds-space-6); align-items: center; }
  .status svg { display: block; fill: var(--ink); }

  .nav { position: absolute; top: 54px; left: var(--gutter); right: var(--gutter); height: 44px; display: flex; justify-content: space-between; z-index: 2; }
  .nav button { width: 44px; height: 44px; border-radius: var(--ds-radius-full); background: rgb(255 255 255 / .86); box-shadow: inset 0 0 0 1px var(--ds-color-neutral-alpha-light-5); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: var(--ink); }
  .nav .pair { display: flex; gap: var(--ds-space-8); }

  .head { position: absolute; top: 292px; left: var(--gutter); right: var(--gutter); }
  .head h1 { font: 600 var(--ds-font-size-28)/34px var(--ds-font-family-display); letter-spacing: -0.015em; }
  .head p { margin-top: var(--ds-space-2); font: 400 var(--ds-font-size-15)/20px var(--ds-font-family-text); color: var(--ink-2); }
  
  /* The reading leads: one big number, the instruction beside it. */
  .reading { position: absolute; top: 368px; left: var(--gutter); right: var(--gutter); display: flex; align-items: center; gap: var(--ds-space-16); }
  .reading .v { font: 500 var(--ds-font-size-64)/64px var(--ds-font-family-display); letter-spacing: -0.03em; }
  .reading .v span { font-size: var(--ds-font-size-34); letter-spacing: -0.01em; margin-left: 2px; }
  .reading .t small { display: block; font: 400 var(--ds-font-size-13)/18px var(--ds-font-family-text); color: var(--ink-2); }
  .reading .t b { display: block; font: 600 var(--ds-font-size-17)/22px var(--ds-font-family-text); color: var(--ds-color-text-accent); }
  .reading .t span { display: block; margin-top: var(--ds-space-2); font: 600 var(--ds-font-size-17)/22px var(--ds-font-family-text); color: var(--ink); }

  .chart { position: absolute; top: 472px; left: var(--gutter); width: 350px; height: 140px; }
  .chart svg { display: block; overflow: visible; }
  .chart text { font: 400 var(--ds-font-size-11)/1 var(--ds-font-family-text); fill: var(--ink-2); }
  .chart .w { fill: var(--ds-color-text-accent); font-weight: 500; }

  .ledger { position: absolute; top: 628px; left: var(--gutter); right: var(--gutter); }
  .ledger div { display: flex; justify-content: space-between; align-items: center; height: 44px; border-top: 1px solid var(--rule); font: 400 var(--ds-font-size-17)/22px var(--ds-font-family-text); }
  .ledger dt { color: var(--ink-2); }
  .ledger dd { font-weight: 500; }

  .action { position: absolute; left: var(--gutter); right: var(--gutter); bottom: 44px; display: flex; }
  .action .log { flex: 1; height: 52px; border-radius: var(--ds-radius-12); background: var(--water); color: var(--ds-color-text-on-accent); font: 600 var(--ds-font-size-17)/1 var(--ds-font-family-text); gap: var(--ds-space-8); }

  .home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--ink); }
</style>
</head>
<body>
<div class="photo">
  <!-- Photo: Rumman Amin, "Green rubber fig in pot", Unsplash (free licence), photo-1544474921-9df05bc76d66, cropped to the leaves, above the pot -->
  <img src="https://images.unsplash.com/photo-1544474921-9df05bc76d66?rect=0,280,4000,2790&w=1170&h=816&fit=crop&q=90&auto=format" alt="Gus, a young rubber fig, in morning sun by the east window">
</div>

<div class="status" aria-hidden="true">
  <time>08:14</time>
  <div class="sys">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.3c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8 .7 10.2 10.2 0 0 0 .9 3.5L2 4.7a8.6 8.6 0 0 1 6-2.4Zm0 3.3c1.4 0 2.7.5 3.7 1.4l1.1-1.2A7 7 0 0 0 8 3.9a7 7 0 0 0-4.8 1.9l1.1 1.2A5.4 5.4 0 0 1 8 5.6Zm0 3.2c.6 0 1.1.2 1.5.6L8 11 6.5 9.4c.4-.4.9-.6 1.5-.6Z"/></svg>

  </div>
</div>

<nav class="nav">
  <button aria-label="Back to Plants"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></button>
  <div class="pair">
    <button aria-label="Add a photo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5Z"/><circle cx="12" cy="12.75" r="3.25"/></svg></button>
    <button aria-label="More"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg></button>
  </div>
</nav>

<main>
  <div class="head">
    <h1>Gus</h1>
    <p>Ficus elastica · Living room, east window</p>
  </div>

  <section class="reading" aria-label="Soil moisture">

    <div class="t">
      <small>Soil moisture, read at 08:10</small>
      <span>Below 20% since Tue 22:30</span>
    </div>
  </section>

      <g stroke="var(--water)" stroke-width="1"><line x1="19.8" x2="19.8" y1="121" y2="125"/><line x1="119.9" x2="119.9" y1="121" y2="125"/><line x1="220.4" x2="220.4" y1="121" y2="125"/></g>
      <line x1="311.5" x2="311.5" y1="121" y2="125" stroke="var(--ds-color-border-default)"/>
      <text class="w" x="19.8" y="138" text-anchor="middle">10 Sep</text><text class="w" x="119.9" y="138" text-anchor="middle">22 Sep</text><text class="w" x="220.4" y="138" text-anchor="middle">4 Oct</text><text x="312" y="138" text-anchor="end" style="fill: var(--ink); font-weight: 500">Today</text>
    </svg>
  </figure>

  <dl class="ledger">
    <div><dt>Last watered</dt><dd>11 days ago</dd></div>
    <div><dt>Usually watered</dt><dd>Every 12 days</dd></div>
  </dl>

  <div class="action">
    <button class="log"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5s-6 6.6-6 10.9a6 6 0 0 0 12 0C18 10.1 12 3.5 12 3.5Z"/></svg>Log 250 ml</button>
  </div>
</main>
<div class="home-ind" aria-hidden="true"></div>
</body>
</html>
