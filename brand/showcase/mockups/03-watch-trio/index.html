<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three watch faces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400..700&display=block" rel="stylesheet">
<link rel="stylesheet" href="opendesigner/build/css/tokens.css">
<style>
  /* Scene: three generic watch cases, close up, lit like a product shot: one soft key light above,
     a cool rim light from the left, falloff into black at top and bottom.
     The ground and type are tokens (dark theme pinned). Metal, glass and band gradients are
     art, outside the tokens on purpose. The watch screens are the real renders, corners already cut. */
  html, body { margin: 0; }
  body {
    width: 1600px; height: 900px; overflow: hidden; position: relative;
    background: var(--ds-color-surface-sunken);
    font-family: var(--ds-font-family-text);
    color: var(--ds-color-text-primary);
    -webkit-font-smoothing: antialiased;
  }
  .backdrop {
    position: absolute; inset: 0;
    background:
      radial-gradient(46% 62% at 50% 46%, var(--ds-color-neutral-dark-5) 0%, var(--ds-color-neutral-dark-3) 42%, transparent 78%),
      radial-gradient(30% 40% at 18% 40%, color-mix(in oklab, var(--ds-color-accent-dark-6) 45%, transparent), transparent 70%),
      var(--ds-color-surface-sunken);
  }
  /* falloff so the bands sink into the dark at the frame edges */
  .falloff { position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: linear-gradient(180deg, var(--ds-color-surface-sunken) 0%, transparent 20%, transparent 78%, var(--ds-color-surface-sunken) 100%); }

  .watch { --s: 1.5; position: absolute; top: 50%; width: calc(205px * var(--s) + 44px); height: calc(251px * var(--s) + 44px);
    transform: translate(-50%, -50%); }
  /* bands: narrower than the case, rounded edges, darker where the case shades them */
  .band { position: absolute; left: 50%; width: 60%; transform: translateX(-50%); z-index: 0; border-radius: 14px; /* od-ignore: device or photo art */
    background:
      linear-gradient(90deg, rgb(0 0 0 / .55) 0%, rgb(255 255 255 / .07) 12%, rgb(255 255 255 / .03) 40%, rgb(0 0 0 / .08) 75%, rgb(0 0 0 / .6) 100%), /* od-ignore: device or photo art */
      var(--band); }
  .band.top { bottom: 86%; height: 400px; }
  .band.top::after, .band.bot::after { content: ""; position: absolute; left: 0; right: 0; height: 90px; }
  .band.top::after { bottom: 0; background: linear-gradient(0deg, rgb(0 0 0 / .55), transparent); } /* od-ignore: device or photo art */
  .band.bot { top: 86%; height: 400px;
    background:
      radial-gradient(circle, rgb(0 0 0 / .55) 0 4px, transparent 4.5px) center 150px / 100% 34px repeat-y, /* od-ignore: device or photo art */
      linear-gradient(90deg, rgb(0 0 0 / .55) 0%, rgb(255 255 255 / .07) 12%, rgb(255 255 255 / .03) 40%, rgb(0 0 0 / .08) 75%, rgb(0 0 0 / .6) 100%), /* od-ignore: device or photo art */
      var(--band); }
  .band.bot::after { top: 0; background: linear-gradient(180deg, rgb(0 0 0 / .6), transparent); } /* od-ignore: device or photo art */
  .case {
    position: absolute; inset: 0; z-index: 1;
    border-radius: calc(48px * var(--s) + 22px);
    background:
      radial-gradient(70% 40% at 30% 0%, rgb(255 255 255 / .45), transparent 70%), /* od-ignore: device or photo art */
      linear-gradient(180deg, rgb(255 255 255 / .35) 0%, rgb(255 255 255 / 0) 8%, transparent 88%, rgb(0 0 0 / .45) 100%), /* od-ignore: device or photo art */
      linear-gradient(90deg, rgb(200 225 255 / .55) 0%, rgb(255 255 255 / .08) 6%, transparent 45%, rgb(0 0 0 / .3) 95%, rgb(0 0 0 / .55) 100%), /* od-ignore: device or photo art */
      var(--metal);
    box-shadow:
      inset 0 0 0 1px rgb(255 255 255 / .18), /* od-ignore: device or photo art */
      0 30px 60px -10px rgb(0 0 0 / .75), /* od-ignore: device or photo art */
      0 60px 120px -20px rgb(0 0 0 / .6); /* od-ignore: device or photo art */
  }
  .glass { position: absolute; inset: 9px; border-radius: calc(48px * var(--s) + 13px); background: #000; /* od-ignore: device or photo art */
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / .1), inset 0 2px 6px rgb(255 255 255 / .06); } /* od-ignore: device or photo art */
  .screen { position: absolute; left: 22px; top: 22px; width: calc(205px * var(--s)); height: calc(251px * var(--s)); }
  .screen img { display: block; width: 100%; height: 100%; }
  .sheen { position: absolute; inset: 9px; border-radius: calc(48px * var(--s) + 13px); pointer-events: none; z-index: 2;
    background: linear-gradient(160deg, rgb(255 255 255 / .09) 0%, rgb(255 255 255 / .03) 32%, transparent 32.5%); } /* od-ignore: device or photo art */
  .crown { position: absolute; right: -14px; top: 26%; width: 18px; height: 70px; border-radius: 6px; z-index: 0; /* od-ignore: device or photo art */
    background:
      repeating-linear-gradient(180deg, rgb(0 0 0 / .35) 0 2px, transparent 2px 5px), /* od-ignore: device or photo art */
      linear-gradient(90deg, rgb(0 0 0 / .4), rgb(255 255 255 / .35) 45%, rgb(0 0 0 / .3)), /* od-ignore: device or photo art */
      var(--metal); }
  .button { position: absolute; right: -6px; top: 52%; width: 10px; height: 96px; border-radius: 5px; z-index: 0; /* od-ignore: device or photo art */
    background: linear-gradient(90deg, rgb(0 0 0 / .3), rgb(255 255 255 / .25) 50%, rgb(0 0 0 / .4)), var(--metal); } /* od-ignore: device or photo art */

  .w1 { left: 360px; --s: 1.42; --metal: #3a3e46; --band: #24272c; margin-top: 14px; } /* od-ignore: device or photo art */
  .w2 { left: 800px; --s: 1.6;  --metal: #aeb4bd; --band: #3d4652; z-index: 3; } /* od-ignore: device or photo art */
  .w3 { left: 1240px; --s: 1.42; --metal: #17181b; --band: #15171b; margin-top: 14px; } /* od-ignore: device or photo art */

  .caption { position: absolute; left: var(--ds-space-64); right: var(--ds-space-64); bottom: var(--ds-space-40); z-index: 6;
    display: flex; justify-content: space-between; font: var(--ds-text-body-sm); }
  .caption b { font-weight: var(--ds-font-weight-heading); }
  .caption span { color: var(--ds-color-text-secondary); }
</style>
</head>
<body>
  <div class="backdrop"></div>

  <figure class="watch w1" style="margin:0"><div class="band top"></div><div class="band bot"></div><div class="crown"></div><div class="button"></div>
    <div class="case"><div class="glass"></div><div class="screen"><img src="../../watch/01-ridgeline-trail/shot.png" alt="Fellrise: pace 4'52 per kilometre, 312 metres to the summit, and the climb profile"></div><div class="sheen"></div></div></figure>
  <figure class="watch w2" style="margin:0"><div class="band top"></div><div class="band bot"></div><div class="crown"></div><div class="button"></div>
    <div class="case"><div class="glass"></div><div class="screen"><img src="../../watch/03-tidemark-face/shot.png" alt="Tidemark watch face: 6:18 over a dawn sea, 2.1 m and rising, high tide at 9:42"></div><div class="sheen"></div></div></figure>
  <figure class="watch w3" style="margin:0"><div class="band top"></div><div class="band bot"></div><div class="crown"></div><div class="button"></div>
    <div class="case"><div class="glass"></div><div class="screen"><img src="../../watch/04-headway-transit/shot.png" alt="Headway: the next tram to Northgate in 2 minutes, with the stops between"></div><div class="sheen"></div></div></figure>

  <div class="falloff"></div>
  <p class="caption" style="margin:0"><b>Three faces, read in a second</b><span>Fellrise, Tidemark, Headway</span></p>
</body>
</html>
