<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sounding · API monitoring for on-call engineers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opendesigner/build/css/tokens.css">
<style>
/* Sounding's own system (the product's state, extended with display sizes: Q-brand-06 two-sets; the display family is still Inter), dark theme. */
:root {
  --page: var(--ds-color-surface-base);
  --ink: var(--ds-color-text-primary);
  --muted: var(--ds-color-text-secondary);
  --primary: var(--ds-color-bg-inverse);       /* the product's near-black primary, inverted on the dark page */
  --on-primary: var(--ds-color-text-inverse);
  --grid: 1344px;                               /* 12 columns, 48 px margins at 1440 */
  --shot-scale: 0.93333;                        /* the product's 1440 px layout shown at 1344 px: 14 px body reads 13 px */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--page); }
body { font: var(--ds-text-body-lg); color: var(--ink); -webkit-font-smoothing: antialiased; min-width: 1440px; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: var(--ds-focus-ring-width) solid var(--ds-color-text-primary); outline-offset: var(--ds-focus-ring-offset); border-radius: var(--ds-radius-control-sm); }
.wrap { width: var(--grid); margin: 0 auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Nav */
.nav { height: 56px; /* od-ignore: marketing nav bar, no nav-height token */ display: flex; align-items: center; gap: var(--ds-space-40); }
.brand { display: inline-flex; align-items: center; gap: var(--ds-space-8); font: var(--ds-text-title-md); letter-spacing: -0.01em; }
.mark { width: var(--ds-size-icon-lg); height: var(--ds-size-icon-lg); border-radius: var(--ds-radius-control-sm); background: var(--primary); display: grid; place-items: center; }
.links { margin-left: auto; display: flex; gap: var(--ds-space-32); font: var(--ds-text-label-lg); font-weight: 400; color: var(--muted); }
@media (hover: hover) and (pointer: fine) { .links a:hover, .signin:hover { color: var(--ink); } }
.signin { padding-left: var(--ds-space-24); border-left: 1px solid var(--ds-color-neutral-dark-6); font: var(--ds-text-label-lg); font-weight: 400; }

/* The product first: the 1440 px screen at 1344 px. 548 px shows 587 product px: the chart legend and its footnote with
   ~11 px of air, and none of the endpoints card below it (its top edge is at 602) */
.shot { margin-top: var(--ds-space-32); }
.screen { --h: 548px; width: var(--grid); height: var(--h); overflow: hidden; border-radius: var(--ds-radius-overlay); background: var(--ds-color-neutral-light-1); outline: 1px solid var(--ds-color-neutral-dark-6); }
.screen iframe { display: block; width: 1440px; height: calc(var(--h) / var(--shot-scale)); border: 0; transform: scale(var(--shot-scale)); transform-origin: 0 0; pointer-events: none; }

/* Then the claim, as wide as the picture: one line of display type that spans the grid under the screen.
   107 px is outside the scale on purpose (72 x 1.49): it makes the line as wide as the window above (it ends at ~1390 px);
   at 72 the line stops two thirds across and reads as a caption. */
.copy { margin-top: var(--ds-space-40); }
h1 { font-optical-sizing: auto; margin-left: -0.045em; /* optical: the F's side bearing */ font-family: var(--ds-font-family-display); font-size: calc(var(--ds-font-size-72) * 1.49); line-height: 1; font-weight: 400; letter-spacing: -0.03em; color: var(--ink); white-space: nowrap; }
.row { margin-top: var(--ds-space-32); display: flex; align-items: center; justify-content: space-between; }
.sub { font-size: var(--ds-font-size-20); line-height: 28px; /* od-ignore: title-lg line */ color: var(--muted); }
.sub code { font-family: var(--ds-font-family-mono); font-size: 0.94em; color: var(--ink); }
.btn { display: inline-flex; align-items: center; gap: var(--ds-space-8); height: var(--ds-size-control-lg); padding: 0 var(--ds-space-24); border-radius: var(--ds-radius-control); background: var(--ds-color-white); color: var(--on-primary); font: var(--ds-text-label-lg); font-size: var(--ds-font-size-17); font-weight: 500; white-space: nowrap; }
.btn svg { width: var(--ds-size-icon-sm); height: var(--ds-size-icon-sm); fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
@media (hover: hover) and (pointer: fine) { .btn:hover { background: var(--ds-color-neutral-dark-11); } }
</style>
</head>
<body data-density="comfortable"><!-- on body: on <html>, the later ":root, [data-density=compact]" block wins -->
<div class="wrap">
  <header class="nav">
    <a class="brand" href="#" aria-label="Sounding home">
      <span class="mark" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 12 12"><path d="M6 1v6.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="color:var(--on-primary)"/><circle cx="6" cy="9.2" r="1.9" fill="currentColor" style="color:var(--on-primary)"/></svg></span>
      Sounding
    </a>
    <nav class="links" aria-label="Main">
      <a href="#">Product</a>
      <a href="#">Pricing</a>
      <a href="#">Changelog</a>
    </nav>
    <a class="signin" href="#">Sign in</a>
  </header>

  <main>
    <figure class="shot">
      <div class="screen" inert>
        <iframe src="../../product/04-sounding-observability/index.html" title="Sounding service overview" tabindex="-1" aria-hidden="true" scrolling="no"></iframe>
      </div>
      <figcaption class="sr-only">Sounding's overview of the payments-api service at 14:02 UTC: p95 latency above its 450 ms objective since 13:21 UTC, with the v2.41.0 deploy at 13:12 UTC marked on the request, latency and error charts.</figcaption>
    </figure>

    <section class="copy" aria-labelledby="h">
      <h1 id="h">Find the deploy that broke p95.</h1>
      <div class="row">
        <p class="sub">API monitoring for on-call teams. <code>v2.41.0</code> deployed at 13:12 UTC; nine minutes later, p95 passed 450 ms.</p>
        <a class="btn" href="#">Connect a service
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
        </a>
      </div>
    </section>
  </main>
</div>
</body>
</html>
