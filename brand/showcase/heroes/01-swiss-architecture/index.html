<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halde Architekten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opendesigner/build/css/tokens.css">
<style>
  :root {
    /* Page ground: the off-white paper. The engine's base surface is always near-white, so the
       ground uses the subtle neutral fill (step 3), which also flips correctly in dark mode. */
    --ground: var(--ds-color-bg-neutral-subtle);
    --ink: var(--ds-color-text-primary);
    --ink-2: var(--ds-color-text-secondary);
    --rule: var(--ds-color-border-strong);
    --signal: var(--ds-color-brand-seed);
    /* Earth in the section: a flat tone of the ink, the way a section drawing fills cut ground. */
    --earth: color-mix(in oklab, var(--ink) 7%, var(--ground));
    --m: var(--ds-space-32);          /* outer margin */
    --g: var(--ds-space-16);          /* gutter */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--ds-font-family-text);
    font-feature-settings: "tnum" 1, "ss01" 1;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .page {
    height: 100vh; height: 100svh; min-height: 720px;
    padding: 0 var(--m);
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: var(--g);
    grid-template-rows: 64px 1fr auto;
  }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: var(--ds-focus-ring-width) solid var(--ds-color-border-focus); outline-offset: var(--ds-focus-ring-offset); }

  /* top bar */
  .bar { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center; border-bottom: 1px solid var(--ink); }
  .mark { grid-column: 1 / 4; font-weight: 600; font-size: var(--ds-font-size-16); letter-spacing: -0.01em; display: flex; gap: var(--ds-space-8); align-items: center; min-height: var(--ds-size-target-min); }
  .mark b { width: 14px; height: 14px; background: var(--ink); display: inline-block; }
  .meta { font-size: var(--ds-font-size-13); color: var(--ink-2); }
  .loc { grid-column: 4 / 7; }
  .nav { grid-column: 7 / 10; display: flex; gap: var(--ds-space-24); font-size: var(--ds-font-size-13); font-weight: 500; }
  .nav a { min-height: var(--ds-size-target-min); display: inline-flex; align-items: center; gap: var(--ds-space-4); }
  .nav a[aria-current] span { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
  .nav small { font-size: var(--ds-font-size-13); color: var(--ink-2); font-weight: 400; }
  .time { grid-column: 10 / 13; text-align: right; }

  /* the drawing: the one object */
  .drawing { grid-column: 1 / -1; min-height: 0; position: relative; }
  .drawing svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* headline band, ruled off from the drawing: the ground line of the section */
  .band { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: end; border-top: 1px solid var(--ink); padding: var(--ds-space-24) 0 var(--ds-space-32); }
  h1 {
    grid-column: 1 / 10;
    font-family: var(--ds-font-family-display);
    font-weight: 500;
    /* Display size outside the scale on purpose: one line across nine grid columns,
       between the 49 and 95 px tokens (95 px does not leave room for the statement). */
    font-size: min(88px, 6.1vw); /* od-ignore: one-line display set to nine grid columns */
    line-height: .9;
    letter-spacing: -0.03em;
    margin-left: -0.04em;
    white-space: nowrap;
  }
  h1 .dot { color: var(--signal); }
  .say { grid-column: 10 / 13; display: flex; flex-direction: column; gap: var(--ds-space-8); }
  .say p { font-size: var(--ds-font-size-16); line-height: 1.5; text-wrap: pretty; }
  .say a { align-self: flex-start; font-size: var(--ds-font-size-16); font-weight: 600; min-height: var(--ds-size-target-min); display: inline-flex; align-items: center; text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; transition: color var(--ds-motion-duration-medium) var(--ds-motion-easing-standard); }
  @media (hover: hover) and (pointer: fine) { .say a:hover, .nav a:hover { color: var(--signal); } }

  @media (prefers-reduced-motion: no-preference) {
    .ray { animation: drift 8s linear infinite; }
    @keyframes drift { to { stroke-dashoffset: -72; } }
  }
</style>
</head>
<body>
<main class="page">
  <header class="bar">
    <a class="mark" href="#" aria-label="Halde Architekten, home"><b aria-hidden="true"></b>Halde Architekten</a>
    <span class="meta loc">Zurich and Chur, since 1998</span>
    <nav class="nav" aria-label="Main">
      <a href="#" aria-current="page"><span>Work</span> <small>24</small></a><a href="#">Studio</a><a href="#">Writing</a><a href="#">Contact</a>
    </nav>
    <span class="meta time">47.37° N &nbsp;8.54° E &nbsp;&nbsp;Sunrise 07:41</span>
  </header>

  <figure class="drawing" aria-label="Section A–A of Haus am Hang in Flims, completed 2025: three storeys terraced into a south slope, each 12 metres deep, stepping back 8 metres. At solar noon on 21 December the sun stands at 19.7 degrees and its light passes under each roof overhang to reach 7.24 metres into the rooms. On 21 June it stands at 66.6 degrees and the 1.40 metre overhangs stop it at the glass.">
    <svg id="section" viewBox="0 0 1376 680" preserveAspectRatio="xMidYMax meet" aria-hidden="true"></svg>
  </figure>

  <section class="band">
    <h1>Houses that follow the sun<span class="dot">.</span></h1>
    <div class="say">
      <p>We are eleven architects. We place every room by the path of the sun across its site.</p>
      <a href="#">Start a project&nbsp;→</a>
    </div>
  </section>
</main>

<script>
/* Section A–A, drawn in code at 1 m = 32 px. Deterministic; every color is a token. */
(function () {
  const svg = document.getElementById('section');
  const W = 1376, H = Math.round(svg.parentNode.getBoundingClientRect().height) || 656;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a, p = svg) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const INK = 'var(--ink)', INK2 = 'var(--ink-2)', SIG = 'var(--signal)', GROUND = 'var(--ground)', EARTH = 'var(--earth)';
  const txt = (x, y, s, o = {}) => { const t = el('text', Object.assign({ x, y, 'font-size': 13, fill: INK, 'font-family': 'var(--ds-font-family-text)' }, o)); t.textContent = s; return t; };

  const M = 32;                                    // px per metre
  const D = 12 * M, S = 8 * M;                     // storey depth, step back per storey
  const FF = 3.6 * M, SLAB = 0.5 * M, CLR = 3.1 * M, WALL = 0.4 * M, P = 1.4 * M;
  const X0 = 280, Y0 = H - 190;
  const tw = Math.tan(19.74 * Math.PI / 180), ts = Math.tan(66.62 * Math.PI / 180);
  const F = [0, 1, 2].map(i => ({ x: X0 + i * S, y: Y0 - i * FF }));
  const back = F[2].x + D + WALL, roofTop = F[2].y - FF;
  const GW = X0 - 4 * M, yG = Y0 + 56;            // garden wall 4 m in front of the glass, 1.75 m high
  const slope = (yG - (roofTop + 6)) / (back - GW);
  const g = x => x < GW ? yG + 0.05 * (GW - x) : x < back ? yG - slope * (x - GW) : roofTop + 6 - 0.1 * (x - back);

  // earth: one band, 0.8 m deep, along the cut ground and under and behind the building (a stroke clipped to the earth side)
  const meadow = []; for (let x = 0; x <= GW; x += 38) meadow.push([x, g(x)]); meadow.push([GW, g(GW)]);
  const cut = [...meadow, [GW, Y0], [X0, Y0], [X0, Y0 + SLAB]];
  F.forEach(({ x, y }, i) => { cut.push([x + D + WALL, y + SLAB]); cut.push([x + D + WALL, i < 2 ? F[i + 1].y + SLAB : roofTop]); });
  cut.push([back, g(back)], [W, g(W)]);
  const cutPts = cut.map(q => q.join(',')).join(' ');
  const defs = el('defs', {});
  const hatch = el('pattern', { id: 'earthhatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
  el('line', { x1: 0, y1: 0, x2: 0, y2: 6, stroke: INK2, 'stroke-width': .8 }, hatch);   // the section convention for cut earth
  const cp = el('clipPath', { id: 'earthside' }, defs);
  el('polygon', { points: `${cutPts} ${W},${H} 0,${H}` }, cp);
  const cb = el('clipPath', { id: 'earthdepth' }, defs); el('rect', { x: 0, y: 0, width: W, height: Y0 + 3 * M }, cb);   // no deeper than 3 m below ±0.00
  el('polyline', { points: cutPts, fill: 'none', stroke: 'url(#earthhatch)', 'stroke-width': 2 * 0.8 * M, 'stroke-linejoin': 'miter', 'stroke-miterlimit': 4, 'clip-path': 'url(#earthside)' }, el('g', { 'clip-path': 'url(#earthdepth)' }));
  // cut ground line and the garden wall
  el('polyline', { points: meadow.map(q => q.join(',')).join(' '), fill: 'none', stroke: INK, 'stroke-width': 1.5 });
  el('line', { x1: GW, y1: Y0, x2: X0, y2: Y0, stroke: INK, 'stroke-width': 1.5 });
  el('line', { x1: back, y1: g(back), x2: W, y2: g(W), stroke: INK, 'stroke-width': 1.5 });
  el('rect', { x: GW - 0.3 * M, y: Y0, width: 0.3 * M, height: yG - Y0 + 14, fill: INK });

  // a tree on the meadow, drawn the way a 1:200 section draws one: trunk, forking limbs, the crown's outline
  const tree = (x, h) => {
    const gy = g(x), t = el('g', { stroke: INK2, fill: 'none', 'stroke-linecap': 'round' });
    const limb = (x0, y0, len, ang, w, depth) => {
      const x1 = x0 + Math.cos(ang) * len, y1 = y0 - Math.sin(ang) * len;
      el('path', { d: `M${x0},${y0} Q${(x0 + x1) / 2 + Math.cos(ang + 1.57) * len * .08},${(y0 + y1) / 2} ${x1},${y1}`, 'stroke-width': w }, t);
      if (depth) [-0.42, 0.38].forEach(d => limb(x1, y1, len * .62, ang + d, w * .7, depth - 1));
    };
    limb(x, gy, h * .42, Math.PI / 2, 2.2, 0);
    [[1.98, .21], [1.55, .25], [1.18, .2]].forEach(([ang, l], i) => limb(x, gy - h * (.42 - i * .04), h * l, ang, 1.4, 2));
    el('ellipse', { cx: x, cy: gy - h * .7, rx: h * .3, ry: h * .34, 'stroke-dasharray': '3 3', 'stroke-width': 1 }, t);
  };
  tree(74, 6 * M);

  // the building: rooms, glazing, slabs, overhangs and back walls; cut elements in solid ink
  F.forEach(({ x, y }, i) => {
    el('rect', { x, y: y - CLR, width: D, height: CLR, fill: GROUND });
    el('rect', { x, y, width: D + WALL, height: SLAB, fill: INK });
    el('rect', { x: x - P, y: y - CLR - SLAB, width: D + WALL + P, height: SLAB, fill: INK });
    el('rect', { x: x + D, y: y - CLR, width: WALL, height: CLR, fill: INK });
    el('rect', { x: x - 2, y: y - CLR, width: 6, height: CLR, fill: GROUND, stroke: INK, 'stroke-width': 1 });
    if (i > 0) el('line', { x1: F[i - 1].x - P + 1.5, y1: y, x2: F[i - 1].x - P + 1.5, y2: y - 1.0 * M, stroke: INK, 'stroke-width': 1.2 });
  });

  // winter sun at solar noon: the ray past each overhang, and the light it lets into the room
  F.forEach(({ x, y }) => {
    const tipx = x - P, tipy = y - CLR, land = tipx + CLR / tw, glassY = tipy + P * tw;
    el('polygon', { points: `${x + 4},${glassY} ${land},${y} ${x + 4},${y}`, fill: SIG, opacity: .18 });
    const xs = tipx - 6 * M, ys = tipy - 6 * M * tw;   // each ray drawn 6 m back from its overhang
    el('line', { class: 'ray', x1: xs, y1: ys, x2: tipx, y2: tipy, stroke: SIG, 'stroke-width': 1.2, 'stroke-dasharray': '6 5' });
  });
  // summer sun: the steep ray past each overhang tip lands on the terrace, just short of the glass
  F.forEach(({ x, y }) => { const tipx = x - P, tipy = y - CLR, up = 40; el('line', { x1: tipx - up / ts, y1: tipy - up, x2: tipx + CLR / ts, y2: y, stroke: INK, 'stroke-width': 1 }); });

  // people for scale (1.75 m), drawn in outline, kept clear of the rays
  const STAND = [[-5,-150],[-19,-145],[-23,-130],[-25,-105],[-24,-82],[-19,-80],[-18,-104],[-15,-122],[-15,-95],[-14,-60],[-13,-4],[-17,0],[-5,0],[-5,-55],[0,-86],[5,-55],[5,0],[17,0],[13,-4],[14,-60],[15,-95],[15,-122],[18,-104],[19,-80],[24,-82],[25,-105],[23,-130],[19,-145],[5,-150]];
  const WALK = [[-8,-150],[-18,-143],[-22,-122],[-28,-100],[-30,-84],[-24,-83],[-20,-102],[-15,-118],[-14,-92],[-22,-52],[-32,-8],[-40,0],[-26,0],[-14,-50],[0,-86],[8,-52],[14,-8],[16,0],[26,-2],[26,-10],[18,-54],[15,-94],[16,-120],[24,-108],[30,-88],[34,-90],[28,-112],[22,-140],[6,-150]];
  const person = (x, y, pts, h = 1.75, flip = 1, head = 0) => {
    const k = h * M / 175, gp = el('g', { transform: `translate(${x},${y}) scale(${k * flip},${k})`, fill: GROUND, stroke: INK2, 'stroke-width': 1 / k, 'stroke-linejoin': 'round' });
    el('polygon', { points: pts.map(q => q.join(',')).join(' ') }, gp);
    el('ellipse', { cx: head, cy: -162, rx: 10, ry: 12 }, gp);
  };
  const thin = { stroke: INK2, 'stroke-width': 1.2, fill: 'none' };
  person(F[0].x + 1.3 * M, Y0, STAND); person(F[0].x + 2.3 * M, Y0, STAND, 1.15, -1);
  const ty = F[1].y - 0.75 * M, tx = F[1].x + 7.8 * M;
  el('path', Object.assign({ d: `M${tx},${ty} h${3.0 * M} M${tx + 8},${ty} V${F[1].y} M${tx + 3.0 * M - 8},${ty} V${F[1].y}` }, thin));
  person(tx + 3.5 * M, F[1].y, STAND, 1.75, -1);
  person(F[2].x + 1.5 * M, F[2].y, WALK, 1.75, 1, -3);
  const bx0 = F[2].x + D - 0.45 * M, bt = F[2].y - 2.4 * M;
  el('rect', Object.assign({ x: bx0, y: bt, width: 0.45 * M, height: 2.4 * M }, thin));
  [1, 2, 3].forEach(k => el('line', Object.assign({ x1: bx0, y1: bt + k * 0.6 * M, x2: bx0 + 0.45 * M, y2: bt + k * 0.6 * M }, thin)));

  // levels, on each terrace
  const level = (x, y, s) => { el('path', { d: `M${x},${y - 2} l-5,-8 h10 z`, fill: 'none', stroke: INK, 'stroke-width': 1 }); txt(x + 10, y - 4, s, { fill: INK2 }); };
  level(GW + 22, Y0, '±0.00'); level(F[0].x + 2 * M, F[1].y, '+3.60'); level(F[1].x + 2 * M, F[2].y, '+7.20');

  // the winter angle where the lowest ray lands
  const land0 = F[0].x - P + CLR / tw, r = 72, a = 19.74 * Math.PI / 180;
  el('path', { d: `M${land0 - r},${Y0 - 1} A${r},${r} 0 0 1 ${land0 - r * Math.cos(a)},${Y0 - 1 - r * Math.sin(a)}`, fill: 'none', stroke: INK, 'stroke-width': 1 });
  txt(land0 - r - 46, Y0 - 9, '19.7°', { 'font-weight': 600 });
  const sl = F[2].x - P + CLR / ts, rs = 44, as = 66.62 * Math.PI / 180;   // where the top summer ray lands on the terrace
  el('path', { d: `M${sl - rs},${F[2].y - 1} A${rs},${rs} 0 0 1 ${sl - rs * Math.cos(as)},${F[2].y - 1 - rs * Math.sin(as)}`, fill: 'none', stroke: INK, 'stroke-width': 1 });
  txt(sl - rs - 50, F[2].y - 9, '66.6°', { 'font-weight': 600 });

  // dimension lines with extension lines
  const dim = (x0, x1, y, label, from) => {
    el('line', { x1: x0 - 10, y1: y, x2: x1 + 10, y2: y, stroke: INK, 'stroke-width': .8 });
    [x0, x1].forEach((x, k) => {
      el('line', { x1: x - 4, y1: y + 4, x2: x + 4, y2: y - 4, stroke: INK, 'stroke-width': 1.2 });
      const f = Array.isArray(from) ? from[k] : from;
      if (f != null) el('line', { x1: x, y1: f, x2: x, y2: f > y ? y - 6 : y + 6, stroke: INK2, 'stroke-width': .6 });
    });
    if (label) txt((x0 + x1) / 2, y - 7, label, { 'text-anchor': 'middle' });
  };
  const yo = roofTop - 86, yi = roofTop - 34;   // outer chain, inner chain (above the rays' start)
  dim(F[0].x, F[1].x, yo, '8.00', [F[1].y - 6, F[2].y - 6]);
  dim(F[1].x, F[2].x, yo, '8.00', [null, roofTop - 6]);
  dim(F[2].x, back, yo, '12.40', [null, roofTop - 6]);
  dim(F[2].x - P, F[2].x, yi, '1.40', [roofTop - 6, null]);
  dim(F[0].x, land0, Y0 + SLAB + 0.8 * M + 26, '7.24', [Y0 + SLAB + 4, Y0 + SLAB + 4]);   // below the hatched earth

  // key, on the paper at bottom left
  const ky = H - 48;
  el('line', { x1: 0, y1: ky - 5, x2: 30, y2: ky - 5, stroke: SIG, 'stroke-width': 1.4, 'stroke-dasharray': '6 5' });
  txt(44, ky, '21 Dec, solar noon', { 'font-size': 16, 'font-weight': 600 });
  txt(232, ky, 'Low winter sun: the light reaches deep into each room.', { 'font-size': 16, fill: INK2 });
  el('line', { x1: 0, y1: ky + 23, x2: 30, y2: ky + 23, stroke: INK, 'stroke-width': 1 });
  txt(44, ky + 28, '21 Jun, solar noon', { 'font-size': 16, 'font-weight': 600 });
  txt(232, ky + 28, 'High summer sun: the overhang stops it at the glass.', { 'font-size': 16, fill: INK2 });

  // title block on grid columns 10 to 12, standing on the band's rule
  const bx = 1044, bw = W - bx, bh = 112, by = H - bh;
  el('rect', { x: bx + .5, y: by + .5, width: bw - 1, height: bh, fill: GROUND, stroke: INK, 'stroke-width': 1 });
  txt(bx + 16, by + 24, 'Haus am Hang, Flims', { 'font-weight': 600 });
  txt(bx + bw - 16, by + 24, '2025', { 'text-anchor': 'end' });
  txt(bx + 16, by + 44, 'Section A–A, looking west', { fill: INK2 });
  txt(bx + bw - 16, by + 44, '01 of 24', { fill: INK2, 'text-anchor': 'end' });
  txt(bx + 16, by + 64, '±0.00 = 1,081.40 m above sea level', { fill: INK2 });
  el('line', { x1: bx, y1: by + 76, x2: bx + bw, y2: by + 76, stroke: INK, 'stroke-width': .6 });
  const sx = bx + 16, sy = by + 86;
  [[0, 1], [1, 2], [2, 5]].forEach(([a0, b0], k) => el('rect', { x: sx + a0 * M, y: sy, width: (b0 - a0) * M, height: 5, fill: k % 2 ? GROUND : INK, stroke: INK, 'stroke-width': .8 }));
  [[0, '0'], [1, '1'], [2, '2'], [5, '5 m']].forEach(([m, s]) => txt(sx + m * M + (m === 5 ? 4 : 0), sy + 20, s, { fill: INK2, 'text-anchor': m === 0 ? 'start' : 'middle' }));
  txt(bx + bw - 16, sy + 12, 'S → N', { 'text-anchor': 'end', 'font-weight': 600 });
})();
</script>
</body>
</html>
