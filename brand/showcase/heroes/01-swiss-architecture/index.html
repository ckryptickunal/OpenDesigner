<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halde Architekten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opendesigner/build/css/tokens.css">
<style>
  :root {
    /* Page ground: the off-white paper. The engine's base surface is always near-white, so the
       ground uses the subtle neutral fill (step 3), which also flips correctly in dark mode. */
    --ground: var(--ds-color-bg-neutral-subtle);
    --ink: var(--ds-color-text-primary);
    --ink-2: var(--ds-color-text-secondary);
    --rule: var(--ds-color-border-strong);
    --signal: var(--ds-color-brand-seed);
    /* Earth in the section: a flat tone of the ink, the way a section drawing fills cut ground. */
    --earth: color-mix(in oklab, var(--ink) 7%, var(--ground));
    --m: var(--ds-space-32);          /* outer margin */
    --g: var(--ds-space-16);          /* gutter */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--ds-font-family-text);
    font-feature-settings: "tnum" 1, "ss01" 1;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .page {
    height: 100vh; height: 100svh; min-height: 720px;
    padding: 0 var(--m);
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: var(--g);
    grid-template-rows: 64px auto 1fr;
  }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: var(--ds-focus-ring-width) solid var(--ds-color-border-focus); outline-offset: var(--ds-focus-ring-offset); }

  /* top bar */
  .bar { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center; border-bottom: 1px solid var(--ink); }
  .mark { grid-column: 1 / 5; font-weight: 600; font-size: var(--ds-font-size-16); letter-spacing: -0.01em; display: flex; gap: var(--ds-space-8); align-items: center; min-height: var(--ds-size-target-min); }
  .mark b { width: 14px; height: 14px; background: var(--ink); display: inline-block; }
  .nav { grid-column: 7 / 13; justify-content: flex-end; display: flex; gap: var(--ds-space-32); font-size: var(--ds-font-size-16); font-weight: 500; }
  .nav a { min-height: var(--ds-size-target-min); display: inline-flex; align-items: center; gap: var(--ds-space-4); }
  .nav a[aria-current] span { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
  .nav small { font-size: var(--ds-font-size-13); color: var(--ink-2); font-weight: 400; }

  /* the drawing: the one object */
  .drawing { grid-column: 1 / -1; min-height: 0; position: relative; margin: 0 calc(-1 * var(--m)); } /* the section runs to the frame edges */
  .drawing svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* headline band at the top; the drawing below runs to the foot of the frame */
  .band { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: end; padding: var(--ds-space-48) 0 0; }
  h1 {
    grid-column: 1 / 9;
    font-family: var(--ds-font-family-display);
    font-weight: 500;
    font-size: var(--ds-font-size-95);
    line-height: .94;
    letter-spacing: -0.035em;
    margin-left: -0.05em;
  }
  .say { grid-column: 9 / 13; display: flex; flex-direction: column; gap: var(--ds-space-8); padding-bottom: var(--ds-space-4); }
  .say p { font-size: var(--ds-font-size-16); line-height: 1.5; color: var(--ink-2); text-wrap: pretty; }
  .say a { align-self: flex-start; font-size: var(--ds-font-size-16); font-weight: 600; min-height: var(--ds-size-target-min); display: inline-flex; align-items: center; text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; transition: color var(--ds-motion-duration-medium) var(--ds-motion-easing-standard); }
  @media (hover: hover) and (pointer: fine) { .say a:hover, .nav a:hover { color: var(--signal); } }

  </style>
</head>
<body>
<main class="page">
  <header class="bar">
    <a class="mark" href="#" aria-label="Halde Architekten, home"><b aria-hidden="true"></b>Halde Architekten</a>
    <nav class="nav" aria-label="Main">
      <a href="#" aria-current="page"><span>Work</span> <small>24</small></a><a href="#">Studio</a><a href="#">Writing</a><a href="#">Contact</a>
    </nav>
  </header>

  <section class="band">
    <h1>Houses that<br>follow the sun</h1>
    <div class="say">
      <p>Eleven architects in Zurich and Chur. We place every room by the path of the sun across its site.</p>
      <a href="#">Start a project&nbsp;→</a>
    </div>
  </section>

  <figure class="drawing" aria-label="Section of Haus am Hang in Flims, completed 2025: three storeys terraced into a south slope, each 12 metres deep, stepping back 8 metres. At noon on 21 December the sun stands at 19.7 degrees and its light passes under each roof overhang to reach 7.24 metres into the rooms.">
    <svg id="section" viewBox="0 0 1376 680" preserveAspectRatio="xMidYMax meet" aria-hidden="true"></svg>
  </figure>

</main>

<script>
/* Section, drawn in code at 1 m = 36 px. Deterministic; every color is a token. */
(function () {
  const svg = document.getElementById('section');
  const W = 1376, H = Math.round(svg.parentNode.getBoundingClientRect().height) || 656;
  svg.setAttribute('viewBox', `-32 0 ${W + 64} ${H}`);   // the page margin is 32 px; the earth runs to the frame edges
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a, p = svg) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const INK = 'var(--ink)', INK2 = 'var(--ink-2)', SIG = 'var(--signal)', GROUND = 'var(--ground)', EARTH = 'var(--earth)';
  const txt = (x, y, s, o = {}) => { const t = el('text', Object.assign({ x, y, 'font-size': 13, fill: INK, 'font-family': 'var(--ds-font-family-text)' }, o)); t.textContent = s; return t; };

  const M = 36;                                    // px per metre
  const D = 12 * M, S = 8 * M;                     // storey depth, step back per storey
  const FF = 3.6 * M, SLAB = 0.5 * M, CLR = 3.1 * M, WALL = 0.4 * M, P = 1.4 * M;
  const X0 = 300, Y0 = H - 4.2 * M;
  const tw = Math.tan(19.74 * Math.PI / 180), ts = Math.tan(66.62 * Math.PI / 180);
  const F = [0, 1, 2].map(i => ({ x: X0 + i * S, y: Y0 - i * FF }));
  const back = F[2].x + D + WALL, roofTop = F[2].y - FF;
  const GW = X0 - 4 * M, yG = Y0 + 1.6 * M;       // garden wall 4 m in front of the glass
  const slope = (yG - (roofTop + 6)) / (back - GW);
  const g = x => x < GW ? yG + 0.05 * (GW - x) : x < back ? yG - slope * (x - GW) : roofTop + 6 - 0.1 * (x - back);

  // earth: one band, 0.8 m deep, along the cut ground and under and behind the building (a stroke clipped to the earth side)
  const meadow = []; for (let x = -32; x <= GW; x += 38) meadow.push([x, g(x)]); meadow.push([GW, g(GW)]);
  const cut = [...meadow, [GW, Y0], [X0, Y0], [X0, Y0 + SLAB]];
  F.forEach(({ x, y }, i) => { cut.push([x + D + WALL, y + SLAB]); cut.push([x + D + WALL, i < 2 ? F[i + 1].y + SLAB : roofTop]); });
  cut.push([back, g(back)], [W + 32, g(W + 32)]);
  const cutPts = cut.map(q => q.join(',')).join(' ');
  // earth: one flat tone of the ink, from the cut ground down to the foot of the frame, the way a section fills cut ground
  el('polygon', { points: `${cutPts} ${W + 32},${H} -32,${H}`, fill: EARTH });
  // cut ground line and the garden wall
  el('polyline', { points: meadow.map(q => q.join(',')).join(' '), fill: 'none', stroke: INK, 'stroke-width': 1.5 });
  el('line', { x1: GW, y1: Y0, x2: X0, y2: Y0, stroke: INK, 'stroke-width': 1.5 });
  el('line', { x1: back, y1: g(back), x2: W + 32, y2: g(W + 32), stroke: INK, 'stroke-width': 1.5 });
  el('rect', { x: GW - 0.3 * M, y: Y0, width: 0.3 * M, height: yG - Y0 + 14, fill: INK });

  // a tree on the meadow, drawn the way a 1:200 section draws one: trunk, forking limbs, the crown's outline
  const tree = (x, h) => {
    const gy = g(x), t = el('g', { stroke: INK2, fill: 'none', 'stroke-linecap': 'round' });
    const limb = (x0, y0, len, ang, w, depth) => {
      const x1 = x0 + Math.cos(ang) * len, y1 = y0 - Math.sin(ang) * len;
      el('path', { d: `M${x0},${y0} Q${(x0 + x1) / 2 + Math.cos(ang + 1.57) * len * .08},${(y0 + y1) / 2} ${x1},${y1}`, 'stroke-width': w }, t);
      if (depth) [-0.42, 0.38].forEach(d => limb(x1, y1, len * .62, ang + d, w * .7, depth - 1));   // one fork per limb: a trunk and three limbs, as 1:200 entourage
    };
    limb(x, gy, h * .42, Math.PI / 2, 2.2, 0);
    [[1.98, .26], [1.55, .3], [1.18, .25]].forEach(([ang, l], i) => limb(x, gy - h * (.42 - i * .04), h * l, ang, 1.4, 0));
    el('ellipse', { cx: x, cy: gy - h * .7, rx: h * .3, ry: h * .34, 'stroke-dasharray': '3 3', 'stroke-width': 1 }, t);
  };

  // the building: rooms, glazing, slabs, overhangs and back walls; cut elements in solid ink
  F.forEach(({ x, y }, i) => {
    el('rect', { x, y: y - CLR, width: D, height: CLR, fill: GROUND });
    el('rect', { x, y, width: D + WALL, height: SLAB, fill: INK });
    el('rect', { x: x - P, y: y - CLR - SLAB, width: D + WALL + P, height: SLAB, fill: INK });
    el('rect', { x: x + D, y: y - CLR, width: WALL, height: CLR, fill: INK });
    el('rect', { x: x - 2, y: y - CLR, width: 6, height: CLR, fill: GROUND, stroke: INK, 'stroke-width': 1 });
  });

  // winter sun at solar noon: the ray past each overhang, and the light it lets into the room
  F.forEach(({ x, y }) => {
    const tipx = x - P, tipy = y - CLR, land = tipx + CLR / tw, glassY = tipy + P * tw;
    el('polygon', { points: `${x + 4},${glassY} ${land},${y} ${x + 4},${y}`, fill: SIG, opacity: .2 });
    el('line', { x1: x + 4, y1: glassY, x2: land, y2: y, stroke: SIG, 'stroke-width': 1.2, opacity: .75 });   // the ray's edge, inside the room only
    // no ray in the open air: the light's edge inside each room carries the angle
  });
  // people for scale (1.75 m), drawn in outline, kept clear of the rays
  const STAND = [[-5,-150],[-19,-145],[-23,-130],[-25,-105],[-24,-82],[-19,-80],[-18,-104],[-15,-122],[-15,-95],[-14,-60],[-13,-4],[-17,0],[-5,0],[-5,-55],[0,-86],[5,-55],[5,0],[17,0],[13,-4],[14,-60],[15,-95],[15,-122],[18,-104],[19,-80],[24,-82],[25,-105],[23,-130],[19,-145],[5,-150]];
  const WALK = [[-8,-150],[-18,-143],[-22,-122],[-28,-100],[-30,-84],[-24,-83],[-20,-102],[-15,-118],[-14,-92],[-22,-52],[-32,-8],[-40,0],[-26,0],[-14,-50],[0,-86],[8,-52],[14,-8],[16,0],[26,-2],[26,-10],[18,-54],[15,-94],[16,-120],[24,-108],[30,-88],[34,-90],[28,-112],[22,-140],[6,-150]];
  const person = (x, y, pts, h = 1.75, flip = 1, head = 0) => {
    const k = h * M / 175, gp = el('g', { transform: `translate(${x},${y}) scale(${k * flip},${k})`, fill: GROUND, stroke: INK2, 'stroke-width': 1 / k, 'stroke-linejoin': 'round' });
    el('polygon', { points: pts.map(q => q.join(',')).join(' ') }, gp);
    el('ellipse', { cx: head, cy: -162, rx: 10, ry: 12 }, gp);
  };
  const thin = { stroke: INK2, 'stroke-width': 1.2, fill: 'none' };
  person(F[0].x + 1.3 * M, Y0, STAND);
  const ty = F[1].y - 0.75 * M, tx = F[1].x + 7.8 * M;
  el('path', Object.assign({ d: `M${tx},${ty} h${3.0 * M} M${tx + 8},${ty} V${F[1].y} M${tx + 3.0 * M - 8},${ty} V${F[1].y}` }, thin));
  person(tx + 3.5 * M, F[1].y, STAND, 1.75, -1);
  person(F[2].x + 1.5 * M, F[2].y, WALK, 1.75, 1, -3);
  const bx0 = F[2].x + D - 0.45 * M, bt = F[2].y - 2.4 * M;
  el('rect', Object.assign({ x: bx0, y: bt, width: 0.45 * M, height: 2.4 * M }, thin));
  [1, 2, 3].forEach(k => el('line', Object.assign({ x1: bx0, y1: bt + k * 0.6 * M, x2: bx0 + 0.45 * M, y2: bt + k * 0.6 * M }, thin)));

  // the project, named once, on the earth under the hill
  txt(W, H - 28, 'Haus am Hang, Flims, 2025 · noon, 21 December', { 'text-anchor': 'end', 'font-size': 16, fill: INK2 });
})();
</script>
</body>
</html>
