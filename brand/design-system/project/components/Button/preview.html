<!-- @dsCard group="Actions" height=300 width=1000 subtitle="Primary, secondary, text; one primary per screen" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300..700&family=Source+Code+Pro:wght@400;500&display=block" rel="stylesheet"><title>preview</title>
<style>html,body{margin:0} body{background:transparent}</style></head>
<body>
<div id="root" class="od-post" style=""><div style='display:grid;width:1000px'><div data-theme="light" style="background:var(--surface);color:var(--ink);padding:var(--space-24);display:flex;gap:var(--space-16);align-items:center;flex-wrap:wrap">
  <span class="caption od-muted" style="width:72px">Light</span>
  <button class="od-btn od-btn--primary label">Create a design system</button>
  <button class="od-btn od-btn--secondary label">Read how it works</button>
  <button class="od-btn od-btn--text label">See an example</button>
  <button class="od-btn od-btn--primary label" style="outline:2px solid var(--focus-ring);outline-offset:2px">Focused</button>
  <button class="od-btn od-btn--secondary label" disabled>Disabled</button>
</div><div data-theme="dark" style="background:var(--surface);color:var(--ink);padding:var(--space-24);display:flex;gap:var(--space-16);align-items:center;flex-wrap:wrap">
  <span class="caption od-muted" style="width:72px">Dark</span>
  <button class="od-btn od-btn--primary label">Create a design system</button>
  <button class="od-btn od-btn--secondary label">Read how it works</button>
  <button class="od-btn od-btn--text label">See an example</button>
  <button class="od-btn od-btn--primary label" style="outline:2px solid var(--focus-ring);outline-offset:2px">Focused</button>
  <button class="od-btn od-btn--secondary label" disabled>Disabled</button>
</div><div data-theme="cobalt" style="background:var(--surface);color:var(--ink);padding:var(--space-24);display:flex;gap:var(--space-16);align-items:center;flex-wrap:wrap">
  <span class="caption od-muted" style="width:72px">Cobalt</span>
  <button class="od-btn od-btn--primary label">Create a design system</button>
  <button class="od-btn od-btn--secondary label">Read how it works</button>
  <button class="od-btn od-btn--text label">See an example</button>
  <button class="od-btn od-btn--primary label" style="outline:2px solid var(--focus-ring);outline-offset:2px">Focused</button>
  <button class="od-btn od-btn--secondary label" disabled>Disabled</button>
</div></div></div>
</body>
</html>
