<style>
.odl-event-ticket { box-sizing: border-box; inline-size: 100%; max-inline-size: 24rem; margin-inline: auto; container-type: inline-size; color: var(--ds-color-text-primary); font: var(--ds-text-body-md); text-wrap: pretty; }
.odl-event-ticket *, .odl-event-ticket *::before, .odl-event-ticket *::after { box-sizing: border-box; }
.odl-event-ticket .odl-card { display: grid; overflow: hidden; background: var(--ds-color-surface-raised); border: var(--ds-border-width-default) solid var(--ds-color-border-subtle);
  border-radius: var(--ds-radius-container); box-shadow: var(--ds-elevation-floating); }
.odl-event-ticket .odl-art { position: relative; display: grid; align-content: end; gap: var(--ds-space-4); min-block-size: calc(var(--ds-size-control-lg) * 4.6); padding: var(--ds-space-inset-lg);
  color: var(--ds-color-white); background: linear-gradient(200deg, var(--ds-color-accent-light-9) 0%, var(--ds-color-accent-light-11) 45%, var(--ds-color-info-light-12) 100%); isolation: isolate; }
.odl-event-ticket .odl-art svg { position: absolute; inset: 0; z-index: -1; inline-size: 100%; block-size: 100%; }
.odl-event-ticket .odl-art .f-beam { fill: var(--ds-color-white); opacity: 0.12; }
.odl-event-ticket .odl-art .f-ring { fill: none; stroke: var(--ds-color-warning-light-5); stroke-width: 1.5; opacity: 0.5; }
.odl-event-ticket .odl-art .f-orb { fill: var(--ds-color-warning-light-4); }
.odl-event-ticket .odl-art .f-crowd { fill: var(--ds-color-info-light-12); }
.odl-event-ticket .odl-art::after { content: ""; position: absolute; inset: 40% 0 0; z-index: -1; background: linear-gradient(transparent, var(--ds-color-neutral-alpha-light-11)); }
.odl-event-ticket .odl-kind { justify-self: start; margin: 0 0 auto; padding: var(--ds-space-2) var(--ds-space-8); border-radius: var(--ds-radius-control-sm); background: var(--ds-color-white); color: var(--ds-color-neutral-light-12);
  font: var(--ds-text-label-sm); letter-spacing: var(--ds-text-label-sm-tracking); text-transform: uppercase; }
.odl-event-ticket .odl-art > .odl-kind { position: absolute; inset-block-start: var(--ds-space-inset-lg); inset-inline-start: var(--ds-space-inset-lg); }
.odl-event-ticket .odl-tour { margin: 0; font: var(--ds-text-label-md); opacity: 0.9; }
.odl-event-ticket h3 { margin: 0; font: var(--ds-text-headline-sm); letter-spacing: var(--ds-text-headline-sm-tracking); }
.odl-event-ticket .odl-venue { display: flex; align-items: center; gap: var(--ds-space-4); margin: 0; font: var(--ds-text-body-sm); opacity: 0.9; }
.odl-event-ticket .odl-venue svg { flex: none; position: static; inline-size: var(--ds-size-icon-sm); block-size: var(--ds-size-icon-sm); z-index: auto; }
.odl-event-ticket .odl-body { display: grid; gap: var(--ds-space-stack-md); padding: var(--ds-space-inset-lg); }
.odl-event-ticket dl { margin: 0; }
.odl-event-ticket .odl-when { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--ds-space-inline-sm); }
.odl-event-ticket .odl-when div, .odl-event-ticket .odl-seat div { display: grid; gap: var(--ds-space-2); min-inline-size: 0; }
.odl-event-ticket dt { color: var(--ds-color-text-secondary); font: var(--ds-text-label-sm); letter-spacing: var(--ds-text-label-sm-tracking); text-transform: uppercase; }
.odl-event-ticket dd { margin: 0; font: var(--ds-text-title-sm); font-variant-numeric: tabular-nums; white-space: nowrap; }
.odl-event-ticket .odl-seat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: var(--ds-space-inset-md); border-radius: var(--ds-radius-nested); background: var(--ds-color-surface-sunken); }
.odl-event-ticket .odl-seat div { justify-items: center; text-align: center; }
.odl-event-ticket .odl-seat div + div { border-inline-start: var(--ds-border-width-default) solid var(--ds-color-border-subtle); }
.odl-event-ticket .odl-seat dd { font: var(--ds-text-title-lg); }
.odl-event-ticket .odl-qr { display: grid; justify-items: center; gap: var(--ds-space-8); }
.odl-event-ticket .odl-qr div { padding: var(--ds-space-12); border-radius: var(--ds-radius-nested); background: var(--ds-color-white); border: var(--ds-border-width-default) solid var(--ds-color-border-subtle); }
.odl-event-ticket .odl-qr svg { display: block; inline-size: calc(var(--ds-size-control-lg) * 3.4); aspect-ratio: 1; }
.odl-event-ticket .odl-qr path { fill: var(--ds-color-black); }
.odl-event-ticket .odl-qr p { margin: 0; color: var(--ds-color-text-secondary); font: var(--ds-text-label-sm); font-variant-numeric: tabular-nums; text-align: center; }
.odl-event-ticket .odl-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--ds-space-inline-sm); }
.odl-event-ticket button { display: inline-flex; align-items: center; justify-content: center; gap: var(--ds-space-inline-xs); min-block-size: max(var(--ds-size-control-lg), var(--ds-size-target-min)); padding: 0 var(--ds-space-inset-md);
  border: var(--ds-border-width-default) solid var(--ds-color-border-default); border-radius: var(--ds-radius-control); background: var(--ds-color-surface-raised); color: var(--ds-color-text-primary); font: var(--ds-text-label-lg); cursor: pointer; white-space: nowrap;
  transition: background-color var(--ds-motion-duration-short) var(--ds-motion-easing-standard); }
.odl-event-ticket button:hover { background: var(--ds-color-bg-neutral-subtle); }
.odl-event-ticket button svg { flex: none; inline-size: var(--ds-size-icon-md); block-size: var(--ds-size-icon-md); }
.odl-event-ticket .odl-wallet { border-color: var(--ds-color-bg-inverse); background: var(--ds-color-bg-inverse); color: var(--ds-color-text-inverse); }
.odl-event-ticket .odl-wallet:hover { background: var(--ds-color-bg-inverse); opacity: 0.9; }
.odl-event-ticket .odl-wallet .is-done, .odl-event-ticket .odl-wallet[aria-pressed="true"] .is-add { display: none; }
.odl-event-ticket .odl-wallet[aria-pressed="true"] .is-done { display: inline; }
.odl-event-ticket .odl-wallet[aria-pressed="true"] { border-color: var(--ds-color-border-success); background: var(--ds-color-bg-success-subtle); color: var(--ds-color-text-success); opacity: 1; }
.odl-event-ticket button:focus-visible { outline: var(--ds-focus-ring-width) solid var(--ds-color-border-focus); outline-offset: var(--ds-focus-ring-offset); }
@container (max-width: 21rem) {
  .odl-event-ticket .odl-body, .odl-event-ticket .odl-art { padding: var(--ds-space-inset-md); }
  .odl-event-ticket .odl-actions { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .odl-event-ticket, .odl-event-ticket *, .odl-event-ticket *::before { transition: none !important; animation: none !important; } }
