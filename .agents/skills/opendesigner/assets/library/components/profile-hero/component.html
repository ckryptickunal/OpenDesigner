<script>
document.querySelectorAll(".odl-profile-hero").forEach((root) => {
  if (root.dataset.odlReady) return; // wire once, even if the file is pasted twice
  root.dataset.odlReady = "1";
  const follow = root.querySelector(".odl-follow"), label = follow.querySelector("span"), count = root.querySelector(".odl-fol");
  const base = 1208, fmt = new Intl.NumberFormat("en");
  follow.addEventListener("click", () => {
    const on = follow.getAttribute("aria-pressed") !== "true";
    follow.setAttribute("aria-pressed", String(on)); label.textContent = on ? "Following" : "Follow";
    count.textContent = fmt.format(base + (on ? 1 : 0));
  });
});
</script>
