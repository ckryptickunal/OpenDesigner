<style>
.odl-file-card { box-sizing: border-box; inline-size: 100%; max-inline-size: 36rem; margin-inline: auto; container-type: inline-size; color: var(--ds-color-text-primary); font: var(--ds-text-body-md); text-wrap: pretty; }
.odl-file-card *, .odl-file-card *::before { box-sizing: border-box; }
.odl-file-card .odl-card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--ds-space-stack-md) var(--ds-space-inline-md); align-items: center;
  padding: var(--ds-space-inset-lg) var(--ds-space-inset-xl); background: var(--ds-color-surface-raised); border: var(--ds-border-width-default) solid var(--ds-color-border-subtle);
  border-radius: var(--ds-radius-container); box-shadow: var(--ds-elevation-raised); }
.odl-file-card svg { flex: none; fill: none; stroke: currentColor; stroke-width: var(--ds-icon-stroke-md); }
.odl-file-card .odl-icon { display: grid; place-items: center; inline-size: var(--ds-size-control-lg); block-size: var(--ds-size-control-lg); border-radius: var(--ds-radius-nested);
  background: var(--ds-color-surface-sunken); border: var(--ds-border-width-default) solid var(--ds-color-border-subtle); color: var(--ds-color-icon-default); }
.odl-file-card .odl-icon svg { display: none; inline-size: var(--ds-size-icon-md); block-size: var(--ds-size-icon-md); }
/* One icon per kind of file; anything else gets the plain page. */
.odl-file-card[data-kind="pdf"] .odl-i-pdf, .odl-file-card[data-kind="sheet"] .odl-i-sheet, .odl-file-card[data-kind="image"] .odl-i-image,
.odl-file-card[data-kind="doc"] .odl-i-doc, .odl-file-card[data-kind="other"] .odl-i-other { display: block; }
.odl-file-card .odl-info { display: grid; gap: var(--ds-space-stack-xs); min-inline-size: 0; }
.odl-file-card h3 { margin: 0; font: var(--ds-text-title-md); overflow-wrap: anywhere; }
.odl-file-card .odl-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--ds-space-2) var(--ds-space-inline-sm); margin: 0; color: var(--ds-color-text-secondary);
  font: var(--ds-text-label-md); font-variant-numeric: tabular-nums; }
.odl-file-card .odl-meta > span + span::before { content: "·"; margin-inline-end: var(--ds-space-inline-sm); color: var(--ds-color-text-tertiary); }
.odl-file-card .odl-kind { color: var(--ds-color-text-primary); font-weight: var(--ds-font-weight-label); letter-spacing: var(--ds-text-label-md-tracking); }
.odl-file-card .odl-acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--ds-space-inline-sm); }
.odl-file-card button { display: inline-flex; align-items: center; justify-content: center; gap: var(--ds-space-inline-sm); max-inline-size: 100%;
  min-block-size: max(var(--ds-size-control-md), var(--ds-size-target-min)); padding: var(--ds-space-inset-xs) var(--ds-space-inset-lg); border-radius: var(--ds-radius-control);
  font: var(--ds-text-label-lg); font-weight: var(--ds-font-weight-label); text-align: center; overflow-wrap: anywhere; cursor: pointer;
  transition: background-color var(--ds-motion-duration-short) var(--ds-motion-easing-standard); }
.odl-file-card button svg { inline-size: var(--ds-size-icon-sm); block-size: var(--ds-size-icon-sm); }
.odl-file-card .odl-download { border: var(--ds-border-width-default) solid transparent; background: var(--ds-color-bg-action-primary); color: var(--ds-color-text-on-action); }
.odl-file-card .odl-download:hover { background: var(--ds-color-bg-action-primary-hover); }
.odl-file-card .odl-preview { border: var(--ds-border-width-default) solid var(--ds-color-border-default); background: var(--ds-color-surface-raised); color: var(--ds-color-text-primary); }
.odl-file-card .odl-preview:hover { background: var(--ds-color-bg-neutral-subtle); }
.odl-file-card button:focus-visible { outline: var(--ds-focus-ring-width) solid var(--ds-color-border-focus); outline-offset: var(--ds-focus-ring-offset); }
/* Narrower: the buttons drop under the name and share the row. */
@container (max-width: 34rem) {
  .odl-file-card .odl-card { grid-template-columns: auto minmax(0, 1fr); }
  .odl-file-card .odl-acts { grid-column: 1 / -1; justify-content: stretch; }
  .odl-file-card button { flex: 1 1 8rem; }
}
@container (max-width: 26rem) { .odl-file-card .odl-card { padding: var(--ds-space-inset-lg); } }
/* Disabled or still loading: quiet but readable (AA), never the faint disabled pair. */
.odl-file-card button:disabled { cursor: not-allowed; background: var(--ds-color-bg-neutral-subtle); border-color: var(--ds-color-border-subtle); color: var(--ds-color-text-secondary); }
@media (prefers-reduced-motion: reduce) { .odl-file-card, .odl-file-card *, .odl-file-card *::before { transition: none !important; animation: none !important; } }
</style>
