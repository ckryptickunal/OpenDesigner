<style>
.odl-article-card { box-sizing: border-box; position: relative; inline-size: 100%; max-inline-size: 760px; container-type: inline-size; display: grid; grid-template-columns: minmax(0, 1fr);
  background: var(--ds-color-surface-raised); color: var(--ds-color-text-primary); border: var(--ds-border-width-default) solid var(--ds-color-border-subtle);
  border-radius: var(--ds-radius-container); box-shadow: var(--ds-elevation-raised); font: var(--ds-text-body-md); text-wrap: pretty; overflow: hidden;
  transition: border-color var(--ds-motion-duration-short) var(--ds-motion-easing-standard), box-shadow var(--ds-motion-duration-short) var(--ds-motion-easing-standard); }
.odl-article-card *, .odl-article-card *::before, .odl-article-card *::after { box-sizing: border-box; }
.odl-article-card:hover { border-color: var(--ds-color-border-default); box-shadow: var(--ds-elevation-floating); }
.odl-article-card:has(.odl-link:focus-visible) { outline: var(--ds-focus-ring-width) solid var(--ds-color-border-focus); outline-offset: var(--ds-focus-ring-offset); }
.odl-article-card .odl-inner { display: grid; grid-template-columns: minmax(0, 1fr); }
.odl-article-card .odl-cover { display: block; inline-size: 100%; aspect-ratio: 2 / 1; border-block-end: var(--ds-border-width-default) solid var(--ds-color-border-subtle); }
.odl-article-card .odl-cover .c-bg { fill: var(--ds-color-bg-accent-subtle); }
.odl-article-card .odl-cover .c-ring { fill: none; stroke: var(--ds-color-border-accent); stroke-width: 1; opacity: 0.55; }
.odl-article-card .odl-cover .c-sun { fill: var(--ds-color-bg-accent-bold); }
.odl-article-card .odl-cover .c-sheet { fill: var(--ds-color-surface-raised); stroke: var(--ds-color-border-subtle); stroke-width: 1; }
.odl-article-card .odl-cover .c-bar { fill: var(--ds-color-bg-neutral-subtle); }
.odl-article-card .odl-cover .c-bar-strong { fill: var(--ds-color-text-tertiary); }
.odl-article-card .odl-cover .c-chip { fill: var(--ds-color-bg-success-subtle); }
.odl-article-card .odl-cover .c-chip-dot { fill: var(--ds-color-bg-success-bold); }
.odl-article-card .odl-cover .c-tick { fill: none; stroke: var(--ds-color-icon-on-accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.odl-article-card .odl-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--ds-space-stack-sm); padding: var(--ds-space-inset-lg); }
.odl-article-card .odl-kicker { margin: 0; color: var(--ds-color-text-accent); font: var(--ds-text-label-md); letter-spacing: var(--ds-text-label-md-tracking); font-variant-numeric: tabular-nums; }
.odl-article-card .odl-kicker span { color: var(--ds-color-text-secondary); }
.odl-article-card h3 { margin: 0; font: var(--ds-text-title-lg); text-wrap: balance; }
.odl-article-card .odl-link { color: inherit; text-decoration: none; outline: none; }
.odl-article-card .odl-link::after { content: ""; position: absolute; inset: 0; }
.odl-article-card:hover .odl-link { text-decoration: underline; text-decoration-thickness: var(--ds-border-width-default); text-underline-offset: var(--ds-space-4); }
.odl-article-card .odl-dek { margin: 0; color: var(--ds-color-text-secondary); }
.odl-article-card footer { display: flex; align-items: center; gap: var(--ds-space-inline-sm); margin-block-start: var(--ds-space-stack-xs); padding-block-start: var(--ds-space-stack-sm);
  border-block-start: var(--ds-border-width-default) solid var(--ds-color-border-subtle); }
.odl-article-card .odl-initials { flex: none; display: grid; place-items: center; inline-size: var(--ds-size-control-sm); block-size: var(--ds-size-control-sm); border-radius: var(--ds-radius-person);
  background: var(--ds-color-bg-accent-subtle); color: var(--ds-color-text-accent); font: var(--ds-text-label-md); font-weight: var(--ds-font-weight-heading); }
.odl-article-card .odl-byline { flex: 1; min-inline-size: 0; display: grid; font: var(--ds-text-body-sm); }
.odl-article-card .odl-byline strong { font-weight: var(--ds-font-weight-label); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.odl-article-card .odl-byline time { color: var(--ds-color-text-tertiary); font-variant-numeric: tabular-nums; }
.odl-article-card .odl-save { position: relative; z-index: 1; flex: none; display: inline-flex; align-items: center; justify-content: center; gap: var(--ds-space-inline-xs);
  min-inline-size: max(var(--ds-size-control-sm), var(--ds-size-target-min)); min-block-size: var(--ds-size-target-min); padding: 0 var(--ds-space-inset-sm);
  border: var(--ds-border-width-default) solid var(--ds-color-border-default); border-radius: var(--ds-radius-control); background: var(--ds-color-surface-raised);
  color: var(--ds-color-text-secondary); font: var(--ds-text-label-lg); cursor: pointer; transition: background-color var(--ds-motion-duration-short) var(--ds-motion-easing-standard); }
.odl-article-card .odl-save:hover { background: var(--ds-color-bg-neutral-subtle); color: var(--ds-color-text-primary); }
.odl-article-card .odl-save svg { inline-size: var(--ds-size-icon-sm); block-size: var(--ds-size-icon-sm); fill: none; }
.odl-article-card .odl-save[aria-pressed="true"] { border-color: var(--ds-color-border-accent); background: var(--ds-color-bg-accent-subtle); color: var(--ds-color-text-accent); }
.odl-article-card .odl-save[aria-pressed="true"] svg { fill: currentColor; }
.odl-article-card .odl-save .odl-on { display: none; }
.odl-article-card .odl-save[aria-pressed="true"] .odl-on { display: inline; }
.odl-article-card .odl-save[aria-pressed="true"] .odl-off { display: none; }
.odl-article-card .odl-save:focus-visible { outline: var(--ds-focus-ring-width) solid var(--ds-color-border-focus); outline-offset: var(--ds-focus-ring-offset); }
@container (min-width: 34rem) {
  .odl-article-card .odl-inner { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }
  .odl-article-card .odl-cover { block-size: 100%; aspect-ratio: auto; min-block-size: 100%; border-block-end: 0; border-inline-end: var(--ds-border-width-default) solid var(--ds-color-border-subtle); }
  .odl-article-card .odl-body { align-content: center; padding: var(--ds-space-inset-xl); }
  .odl-article-card footer { margin-block-start: var(--ds-space-stack-sm); }
}
@container (max-width: 20rem) { .odl-article-card .odl-body { padding: var(--ds-space-inset-md); } }
@media (prefers-reduced-motion: reduce) { .odl-article-card, .odl-article-card *, .odl-article-card *::before, .odl-article-card *::after { transition: none !important; animation: none !important; } }
</style>
<article class="odl-article-card">

    <rect class="c-sheet" x="86" y="52" width="180" height="172" rx="10"/>

    <rect class="c-chip" x="190" y="102" width="46" height="14" rx="7"/><circle class="c-chip-dot" cx="199" cy="109" r="3"/>
    <rect class="c-chip" x="190" y="132" width="46" height="14" rx="7"/><circle class="c-chip-dot" cx="199" cy="139" r="3"/>

<script>
document.querySelectorAll(".odl-article-card").forEach((root) => {
  if (root.dataset.odlReady) return; // wire once, even if the file is pasted twice
  root.dataset.odlReady = "1";
  const save = root.querySelector(".odl-save");
  save.addEventListener("click", () => save.setAttribute("aria-pressed", save.getAttribute("aria-pressed") === "true" ? "false" : "true"));
});
</script>
