<style>

.odl-sign-in-form .odl-control input::placeholder { color: var(--ds-color-text-tertiary); }
.odl-sign-in-form .odl-field.is-invalid .odl-control { border-color: var(--ds-color-border-danger); }
.odl-sign-in-form .odl-field.is-invalid .odl-control:has(input:focus-visible) { box-shadow: 0 0 0 var(--ds-border-width-default) var(--ds-color-border-danger); }

  margin: var(--ds-space-2); padding: 0 var(--ds-space-inset-sm); border: 0; border-radius: var(--ds-radius-control-sm); background: transparent; color: var(--ds-color-text-secondary); font: var(--ds-text-label-md); cursor: pointer; }
.odl-sign-in-form .odl-reveal:hover { background: var(--ds-color-bg-neutral-subtle-hover); color: var(--ds-color-text-primary); }
.odl-sign-in-form .odl-reveal svg { inline-size: var(--ds-size-icon-sm); block-size: var(--ds-size-icon-sm); }
.odl-sign-in-form .odl-reveal .odl-off, .odl-sign-in-form .odl-reveal[aria-pressed="true"] .odl-on { display: none; }
.odl-sign-in-form .odl-reveal[aria-pressed="true"] .odl-off { display: block; }
.odl-sign-in-form a { color: var(--ds-color-text-link); font: var(--ds-text-label-md); text-underline-offset: var(--ds-space-2); border-radius: var(--ds-radius-detail); }
.odl-sign-in-form .odl-label-row a { display: inline-flex; align-items: center; min-block-size: var(--ds-size-target-min); text-decoration: none; }
.odl-sign-in-form .odl-label-row a:hover { text-decoration: underline; }
.odl-sign-in-form .odl-check { display: flex; align-items: center; gap: var(--ds-space-inline-sm); min-block-size: var(--ds-size-target-min); font: var(--ds-text-body-md); font-weight: var(--ds-font-weight-body); cursor: pointer; }
.odl-sign-in-form .odl-check input { flex: none; inline-size: var(--ds-size-icon-sm); block-size: var(--ds-size-icon-sm); margin: 0; accent-color: var(--ds-color-bg-action-primary); cursor: pointer; }
.odl-sign-in-form .odl-check small { color: var(--ds-color-text-tertiary); font: var(--ds-text-body-sm); }
.odl-sign-in-form .odl-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--ds-space-inline-sm); inline-size: 100%; min-block-size: max(var(--ds-size-control-md), var(--ds-size-target-min));
  padding: 0 var(--ds-space-inset-md); border-radius: var(--ds-radius-control); font: var(--ds-text-label-lg); font-weight: var(--ds-font-weight-label); cursor: pointer;
  transition: background-color var(--ds-motion-duration-short) var(--ds-motion-easing-standard); }
.odl-sign-in-form .odl-btn svg { inline-size: var(--ds-size-icon-sm); block-size: var(--ds-size-icon-sm); }
.odl-sign-in-form .odl-primary { border: 0; background: var(--ds-color-bg-action-primary); color: var(--ds-color-text-on-action); }
.odl-sign-in-form .odl-primary:hover { background: var(--ds-color-bg-action-primary-hover); }
.odl-sign-in-form .odl-primary:active { background: var(--ds-color-bg-action-primary-pressed); }
.odl-sign-in-form .odl-secondary { border: var(--ds-border-width-default) solid var(--ds-color-border-default); background: var(--ds-color-surface-raised); color: var(--ds-color-text-primary); }
.odl-sign-in-form .odl-secondary:hover { background: var(--ds-color-bg-neutral-subtle-hover); }
.odl-sign-in-form .odl-divider { display: flex; align-items: center; gap: var(--ds-space-inline-md); color: var(--ds-color-text-tertiary); font: var(--ds-text-label-md); }
.odl-sign-in-form .odl-divider::before, .odl-sign-in-form .odl-divider::after { content: ""; flex: 1; border-block-start: var(--ds-border-width-default) solid var(--ds-color-border-separator); }
.odl-sign-in-form .odl-foot { margin: 0; padding-block-start: var(--ds-space-stack-md); border-block-start: var(--ds-border-width-default) solid var(--ds-color-border-separator); color: var(--ds-color-text-secondary); font: var(--ds-text-body-sm); text-align: center; }
.odl-sign-in-form .odl-btn:focus-visible, .odl-sign-in-form .odl-reveal:focus-visible, .odl-sign-in-form a:focus-visible, .odl-sign-in-form .odl-check input:focus-visible {
  outline: var(--ds-focus-ring-width) solid var(--ds-color-border-focus); outline-offset: var(--ds-focus-ring-offset); }
@container (max-width: 300px) { .odl-sign-in-form .odl-reveal span { display: none; } }
@media (prefers-reduced-motion: reduce) { .odl-sign-in-form, .odl-sign-in-form *, .odl-sign-in-form *::before { transition: none !important; animation: none !important; } }
</style>
<section class="odl-sign-in-form" aria-labelledby="odl-sif-title">
  <div class="odl-head">
    <h2 id="odl-sif-title">Sign in to Oskarby Analytics</h2>
    <p>Use the work email your admin invited.</p>
  </div>
  <form novalidate>
    <div class="odl-field">
      <label for="odl-sif-email">Work email</label>
      <div class="odl-control"><input id="odl-sif-email" type="email" autocomplete="username" value="jonas.ekdahl@oskarby.example" required></div>
    </div>
    <div class="odl-field is-invalid">
      <div class="odl-label-row"><label for="odl-sif-pass">Password</label><a href="#odl-sif-title">Forgot password?</a></div>
      <div class="odl-control"><input id="odl-sif-pass" type="password" autocomplete="current-password" value="winter-ledger-26" aria-invalid="true" aria-describedby="odl-sif-err" required>
        <button type="button" class="odl-reveal" aria-pressed="false" aria-controls="odl-sif-pass"><svg class="odl-on" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg><svg class="odl-off" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 2l12 12M6.6 4a6.7 6.7 0 0 1 1.4-.5c4 0 6.5 4.5 6.5 4.5a11 11 0 0 1-1.9 2.4M10.3 11.9A6 6 0 0 1 8 12.5C4 12.5 1.5 8 1.5 8a11 11 0 0 1 2.7-3.1"/></svg><span>Show</span></button></div>
      <p class="odl-error" id="odl-sif-err"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.75v4M8 10.75v.5"/></svg><span>That password does not match this email. 2 tries left before a 15-minute pause.</span></p>
    </div>
    <label class="odl-check"><input type="checkbox" checked><span>Remember this device <small>for 30 days</small></span></label>
    <button type="submit" class="odl-btn odl-primary">Sign in</button>
  </form>
  <div class="odl-divider" role="separator">or</div>
  <button type="button" class="odl-btn odl-secondary"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="5.5" cy="10.5" r="3"/><path d="m7.6 8.4 6-6M11.5 4.5l2 2M10 6l1.5 1.5"/></svg>Continue with single sign-on</button>
  <p class="odl-foot">New to the team? <a href="#odl-sif-title">Ask an admin for an invite</a></p>
</section>
<script>
document.querySelectorAll(".odl-sign-in-form").forEach((root) => {
  if (root.dataset.odlReady) return; root.dataset.odlReady = "1";
  const btn = root.querySelector(".odl-reveal"), input = root.querySelector('input[autocomplete="current-password"]'), label = btn.querySelector("span");
  btn.addEventListener("click", () => {
    const show = btn.getAttribute("aria-pressed") !== "true";
    btn.setAttribute("aria-pressed", String(show)); input.type = show ? "text" : "password"; label.textContent = show ? "Hide" : "Show";
  });
  root.querySelector("form").addEventListener("submit", (e) => e.preventDefault());
});
</script>
