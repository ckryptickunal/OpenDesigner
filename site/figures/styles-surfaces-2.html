<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Skeuomorphism</span>
<p style="margin:10px 0">The screen imitates real objects and materials: knobs, metal, wood, leather, tape.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>realistic, knobs, dials, “like a real object”</dd>
<dt><b>In code</b></dt><dd>layered gradients for light, stacked shadows, texture art</dd>
<dt><b>Fits</b></dt><dd>music and audio tools, cameras, games, one special screen</dd>
<dt><b>Goes wrong when</b></dt><dd>fake materials cover forms and lists, or the drawn device copies a real brand’s hardware</dd>
</dl></div></div>
<div id="flat-design" style="border:1px solid var(--line);min-width:0">
<div aria-hidden="true" style="aspect-ratio:7/5;width:100%;max-height:180px;overflow:hidden;display:flex;gap:16px;align-items:center;justify-content:center;background:#ffd84d">
<svg width="76" height="76" viewBox="0 0 76 76"><rect width="76" height="76" fill="#1c2a6b"/><circle cx="52" cy="24" r="11" fill="#ffd84d"/><path d="M0 76V54l20-20 22 22 12-10 22 18v12z" fill="#2bb59a"/><path d="M0 76V64l16-12 30 24z" fill="#fff"/></svg>
<div style="display:grid;gap:10px;justify-items:start;font-size:14px;line-height:20px"><span style="padding:8px 14px;background:#1c2a6b;color:#fff;font-weight:600;border-radius:4px">Continue</span><span style="color:#1c2a6b;text-decoration:underline;text-underline-offset:3px;font-weight:500">Skip for now</span></div>
</div>
<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Flat design</span>
<p style="margin:10px 0">Solid colors only: no shadows, shine or texture. Color, size and weight do the work.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>simple, clean, flat, “no shadows”</dd>
<dt><b>In code</b></dt><dd><code>box-shadow: none</code>, solid fills, 1 px borders</dd>
<dt><b>Fits</b></dt><dd>almost everything, from student projects to enterprise dashboards</dd>
<dt><b>Goes wrong when</b></dt><dd>buttons look like labels and links look like text</dd>
</dl></div></div>
<div id="material-elevation" style="border:1px solid var(--line);min-width:0">
<div aria-hidden="true" style="aspect-ratio:7/5;width:100%;max-height:180px;overflow:hidden;position:relative;display:flex;gap:12px;align-items:center;justify-content:center;padding:0 44px 22px 0;background:#eef0f4;font:500 13px/1 'Source Code Pro',monospace;color:#3a3f4a">
<span style="width:40px;height:52px;display:grid;place-items:center;background:#fff;border-radius:6px;box-shadow:0 0 2px rgb(0 0 0/.12),0 1px 2px rgb(0 0 0/.14)">1</span>
<span style="width:40px;height:52px;display:grid;place-items:center;background:#fff;border-radius:6px;box-shadow:0 0 2px rgb(0 0 0/.12),0 4px 8px rgb(0 0 0/.14)">3</span>
<span style="width:40px;height:52px;display:grid;place-items:center;background:#fff;border-radius:6px;box-shadow:0 0 2px rgb(0 0 0/.12),0 14px 28px rgb(0 0 0/.2)">5</span>
<span style="position:absolute;right:12px;bottom:14px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#00695c;box-shadow:0 0 2px rgb(0 0 0/.12),0 4px 8px rgb(0 0 0/.24)"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M8 2h2v6h6v2h-6v6H8v-6H2V8h6z" fill="#fff"/></svg></span>
</div>
<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Material elevation</span>
<p style="margin:10px 0">Cards float at set heights; the higher one floats, the bigger its shadow.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>“like Android”, floating cards, “the round plus button”</dd>
<dt><b>In code</b></dt><dd><code>box-shadow</code> from a fixed ladder of 5 or 6 levels</dd>
<dt><b>Fits</b></dt><dd>Android apps, admin panels, Workspace-style tools</dd>
<dt><b>Goes wrong when</b></dt><dd>every card has a big shadow, or a floating button lands on a desktop web page</dd>
</dl></div></div>
</div>
<figcaption>Surface styles, part two. Skeuomorphism: a brushed-metal knob with tick marks on a dark panel. Flat design: a flat drawing, a solid button and an underlined link, with no shadows. Material elevation: cards at heights 1, 3 and 5 with growing shadows, and a round floating action button.</figcaption>
</figure>
