<figure class="fig">
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px">
<div id="glassmorphism" style="border:1px solid var(--line);min-width:0">
<div aria-hidden="true" style="aspect-ratio:7/5;width:100%;max-height:180px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 24% 28%,#ff9a3c 0 30px,transparent 31px),radial-gradient(circle at 78% 78%,#2fe0c0 0 38px,transparent 39px),linear-gradient(135deg,#1a2a8c,#0b6aa6 55%,#11a982)">
<div style="width:72%;padding:12px 14px;border-radius:14px;background:rgb(255 255 255/.55);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgb(255 255 255/.55);color:#111833;font-size:13px;line-height:18px">Now playing<br><b style="font-size:16px;line-height:22px">Night drive</b></div>
</div>
<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Glassmorphism</span>
<p style="margin:10px 0">Panels look like frosted glass: you see a blurred version of what is behind them.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>frosty, see-through, icy, “like my phone”</dd>
<dt><b>In code</b></dt><dd><code>backdrop-filter: blur(20px)</code></dd>
<dt><b>Fits</b></dt><dd>bars, menus and sheets over photos, maps or music</dd>
<dt><b>Goes wrong when</b></dt><dd>it covers reading surfaces, or sits on a flat color where the blur shows nothing</dd>
</dl></div></div>
<div id="neumorphism" style="border:1px solid var(--line);min-width:0">
<div aria-hidden="true" style="aspect-ratio:7/5;width:100%;max-height:180px;overflow:hidden;display:flex;gap:30px;align-items:center;justify-content:center;background:#e6e9ef;color:#4a5263;font-size:12px;line-height:16px;text-align:center">
<div><div style="width:60px;height:60px;border-radius:20px;display:grid;place-items:center;background:#e6e9ef;box-shadow:-8px -8px 16px rgb(255 255 255/.85),8px 8px 16px rgb(0 0 0/.18)"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M5 3l10 6-10 6z" fill="#4a5263"/></svg></div><div style="margin-top:14px">Raised</div></div>
<div><div style="width:60px;height:60px;border-radius:20px;display:grid;place-items:center;background:#e6e9ef;box-shadow:inset -8px -8px 16px rgb(255 255 255/.85),inset 8px 8px 16px rgb(0 0 0/.18)"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M4 3h3.5v12H4zM10.5 3H14v12h-3.5z" fill="#3b5bdb"/></svg></div><div style="margin-top:14px">Pressed</div></div>
</div>
<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Neumorphism</span>
<p style="margin:10px 0">Buttons look pushed up out of the page, or pressed into it, as if molded from one soft material.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>soft buttons, pillowy, pressed in, “like a remote”</dd>
<dt><b>In code</b></dt><dd>a light and a dark <code>box-shadow</code> on opposite sides; <code>inset</code> when pressed</dd>
<dt><b>Fits</b></dt><dd>a small physical-feeling panel: a timer, a player, a smart-home remote</dd>
<dt><b>Goes wrong when</b></dt><dd>everything is soft, so nothing reads as clickable. It fails 3:1 edge contrast by design</dd>
</dl></div></div>
<div id="claymorphism" style="border:1px solid var(--line);min-width:0">
<div aria-hidden="true" style="aspect-ratio:7/5;width:100%;max-height:180px;overflow:hidden;display:flex;gap:16px;align-items:center;justify-content:center;background:#f3ecff">
<div style="padding:15px 26px;border-radius:32px;background:linear-gradient(160deg,#ffc2da,#ff8fb8);color:#4d0d2f;font-size:16px;font-weight:700;box-shadow:0 14px 28px rgb(80 20 60/.18),inset -6px -6px 12px rgb(120 0 60/.16),inset 6px 6px 12px rgb(255 255 255/.7)">Start</div>
<div style="width:58px;height:58px;border-radius:50%;background:linear-gradient(160deg,#b8f5df,#5fd3b0);box-shadow:0 14px 28px rgb(0 80 60/.18),inset -6px -6px 12px rgb(0 70 50/.18),inset 6px 6px 12px rgb(255 255 255/.75)"></div>
</div>
<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Claymorphism</span>
<p style="margin:10px 0">Shapes look puffy and soft, like modeling clay or plastic toys.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>puffy, squishy, cute, 3D, “made of clay”</dd>
<dt><b>In code</b></dt><dd><code>border-radius: 32px</code>, a soft drop shadow and two <code>inset</code> shadows</dd>
<dt><b>Fits</b></dt><dd>onboarding, kids and learning, wellness; carried mostly by 3D art</dd>
<dt><b>Goes wrong when</b></dt><dd>a clay icon decorates every row, or white text sits on pastel</dd>
</dl></div></div>
</div>
<figcaption>Surface styles, part one. Glassmorphism: a frosted card blurs the shapes behind it, which stay sharp outside its edge. Neumorphism: a raised and a pressed button molded from the page color. Claymorphism: a puffy pastel button and ball, lit from inside by two inner shadows.</figcaption>
</figure>
