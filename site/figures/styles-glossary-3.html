<figure class="fig">
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px">
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;display:grid;place-items:center;background:#c3c7cf"><span style="padding:6px 22px;border:2px solid;border-color:#fff #4b515c #4b515c #fff;background:#d6d9df;font-size:14px;line-height:20px;color:#111">Print</span></div>
<p style="margin:0;padding:8px 12px 12px"><b>Bevel</b><br>Edges lighter on top and darker below, so it looks raised.<br>a light and a dark <code>border-color</code></p></div>
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;display:grid;place-items:center;background:#d9dde5"><span style="font-size:42px;line-height:46px;font-weight:700;letter-spacing:.02em;color:#d9dde5;text-shadow:0 1px 0 rgb(255 255 255/.8),0 -1px 0 rgb(0 0 0/.3)">Aa</span></div>
<p style="margin:0;padding:8px 12px 12px"><b>Emboss</b><br>A shape raised out of the surface, in the same color.<br><code>text-shadow</code>, light and dark</p></div>
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;display:grid;place-items:center;background:#e3ecff"><svg width="70" height="66" viewBox="0 0 70 66" style="transform:rotate(-8deg);filter:drop-shadow(0 3px 3px rgb(20 21 23/.3))"><path d="M35 6l8 18 20 2-15 13 5 20-18-11-18 11 5-20L7 26l20-2z" fill="#ff5fa2" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke"/></svg></div>
<p style="margin:0;padding:8px 12px 12px"><b>Sticker, die-cut</b><br>A shape with a white outline, as if cut out and stuck on.<br>a thick white SVG stroke and a small shadow</p></div>
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;background:radial-gradient(closest-side,#777,#fff) 0 0/8px 8px,linear-gradient(90deg,#fff,#8a8a8a);background-blend-mode:multiply;filter:contrast(14)"></div>
<p style="margin:0;padding:8px 12px 12px"><b>Halftone</b><br>Shading made of dots that grow larger where it is darker.<br>a <code>radial-gradient</code> dot grid</p></div>
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;position:relative;overflow:hidden;background:linear-gradient(120deg in oklab,#ffb46b,#3f6fd8)"><svg style="position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:overlay;opacity:.8"><filter id="gl-gn"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#gl-gn)"/></svg></div>
<p style="margin:0;padding:8px 12px 12px"><b>Grain, noise</b><br>A fine speckle, like film or paper.<br>SVG <code>feTurbulence</code> at low opacity</p></div>
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;display:grid;place-items:center;background:repeating-linear-gradient(0deg,rgb(0 0 0/.4) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,#16352a,#06110c);color:#8ff5b5;font:500 18px/24px 'Source Code Pro',monospace;letter-spacing:.1em">READY_</div>
<p style="margin:0;padding:8px 12px 12px"><b>Scanlines</b><br>Thin horizontal stripes, like an old TV screen.<br><code>repeating-linear-gradient()</code></p></div>
</div>
<figcaption>Six textures and reliefs: a beveled button, embossed letters in the surface’s own color, a die-cut sticker star, halftone dots that grow toward the dark side, film grain over a gradient, and scanlines over a dark screen. None of them counts as a visible edge or a state on its own.</figcaption>
</figure>
