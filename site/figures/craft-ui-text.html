<div class="do"><p class="dd-h">Interface habits</p><p class="dd-why">One ellipsis character, weight for emphasis, and underlines kept for links, so an underline always means “you can click this”.</p>
<div class="dd-art"><div class="cr-pop cr-settings cr-ui">
<div><span>Saving…</span><span class="cr-dim">one character: …</span></div>

<figcaption>Three small text habits. Use the single ellipsis character instead of three periods, emphasize interface text with weight instead of italics or underlines, and underline only links, so an underline stays a promise that the words can be clicked.</figcaption>
