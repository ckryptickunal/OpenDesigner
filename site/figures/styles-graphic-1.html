<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Neo-brutalism</span>
<p style="margin:10px 0">Bold flat colors with thick black outlines and hard black shadows, like stickers or cut paper.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>bold, loud, chunky, “black borders”, punk</dd>
<dt><b>In code</b></dt><dd><code>border: 3px solid</code> and <code>box-shadow: 4px 4px 0</code>; press moves into the shadow</dd>
<dt><b>Fits</b></dt><dd>creator tools, indie products, marketing pages, events</dd>
<dt><b>Goes wrong when</b></dt><dd>everything gets a border and a shadow, or four colors clash</dd>
</dl></div></div>
<div id="brutalism" style="border:1px solid var(--line);min-width:0">
<div aria-hidden="true" style="aspect-ratio:7/5;width:100%;max-height:180px;overflow:hidden;display:grid;align-content:center;padding:0 16px 12px;background:#fff;color:#000;font-family:'Source Code Pro',monospace;font-size:13px;line-height:18px">

<div style="display:grid;grid-template-columns:auto 1fr;border-bottom:1px solid #000"><span style="padding:4px 10px 4px 0;border-right:1px solid #000">02</span><span style="padding:4px 8px;color:#551a8b;text-decoration:underline">Notes</span></div>
</div>
<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Brutalism</span>
<p style="margin:10px 0">Raw and unpolished on purpose: default fonts, plain links, visible structure, giant type.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>raw, ugly on purpose, “like an old website”</dd>
<dt><b>In code</b></dt><dd>a system font, <code>border-radius: 0</code>, underlined blue links, little else</dd>
<dt><b>Fits</b></dt><dd>portfolios, studios, art and culture sites, playful changelogs</dd>
<dt><b>Goes wrong when</b></dt><dd>“unfinished” becomes an excuse for no focus, no states or no grid</dd>
</dl></div></div>

<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Comic and pop art</span>
<p style="margin:10px 0">Like a comic book: thick ink outlines, few flat colors, dot shading and speech balloons.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>comic, cartoon, dots, speech bubbles, “POW”</dd>
<dt><b>In code</b></dt><dd>halftone from <code>radial-gradient</code> dots, <code>border: 3px solid</code>, SVG balloons</dd>
<dt><b>Fits</b></dt><dd>learning and kids, games, onboarding stories, campaign pages</dd>
<dt><b>Goes wrong when</b></dt><dd>balloons say nothing, or dots decorate every surface</dd>
</dl></div></div>

<figcaption>Graphic styles, part one. Neo-brutalism: a white card with a thick black outline and a hard offset shadow, and a button pressed into its shadow. Brutalism: giant monospace type, plain rules and underlined links. Comic and pop art: an inked panel with halftone dots that grow toward the dark corner, a speech balloon and a burst.</figcaption>
