<figure class="fig cr">
<div class="dodont">
<div class="dont"><p class="dd-h">Text that sinks into its fill</p><p class="dd-why">Dark text on bright cobalt, white on a pale tint, white on mid gray. Measured, none reaches 4.5:1, the floor for body text.</p>
<div class="dd-art cr-fills">
<div class="cr-fill"><span class="s" style="background:var(--accent);color:var(--ink)">Publish</span><span class="m">dark ink on cobalt<br><span class="mono">#222428 on #2338ff</span></span><span class="chip bad num">2.28:1</span></div>
<div class="cr-fill"><span class="s" style="background:var(--accent-soft);color:var(--on-accent)">Draft</span><span class="m">white on a pale tint<br><span class="mono">#ffffff on #e3ecff</span></span><span class="chip bad num">1.18:1</span></div>
<div class="cr-fill"><span class="s" style="background:var(--line-strong);color:var(--on-accent)">Archived</span><span class="m">white on mid gray, large text only<br><span class="mono">#ffffff on #808793</span></span><span class="chip warn num">3.61:1</span></div>
</div></div>
<div class="do"><p class="dd-h">Each fill with its own text color</p><p class="dd-why">Each fill gets a text color chosen for it: white on the strong fill, a dark shade of the same hue on the pale ones. Every pair clears 4.5:1.</p>
<div class="dd-art cr-fills">
<div class="cr-fill"><span class="s" style="background:var(--accent);color:var(--on-accent)">Publish</span><span class="m">white on cobalt<br><span class="mono">#ffffff on #2338ff</span></span><span class="chip ok num">6.81:1</span></div>
<div class="cr-fill"><span class="s" style="background:var(--accent-soft);color:var(--accent-text)">Draft</span><span class="m">dark cobalt on a pale tint<br><span class="mono">#1c31ce on #e3ecff</span></span><span class="chip ok num">7.44:1</span></div>
<div class="cr-fill"><span class="s" style="background:var(--ok-soft);color:var(--ok)">Paid</span><span class="m">dark green on a pale green<br><span class="mono">#00652c on #ebf7ed</span></span><span class="chip ok num">6.57:1</span></div>
</div></div>
</div>
<figcaption>Text on colored fills, from this site's own palette, measured with the WCAG 2 formula and never rounded up. Dark text on bright cobalt, white on a pale tint and white on mid gray fail the 4.5:1 floor for body text; pairing each fill with its own text color passes.</figcaption>
</figure>
