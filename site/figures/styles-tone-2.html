<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Playful and toy-like</span>
<p style="margin:10px 0">Chunky, bright and bouncy, like a toy: big rounded buttons with a thick bottom edge.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>fun, for kids, chunky, bouncy, cute</dd>
<dt><b>In code</b></dt><dd><code>box-shadow: 0 4px 0</code> a darker shade; pressed moves down 4 px</dd>
<dt><b>Fits</b></dt><dd>kids and learning, habit trackers, games, celebration moments</dd>
<dt><b>Goes wrong when</b></dt><dd>the mascot is on every screen, everything bounces, or confetti fills space</dd>
</dl></div></div>

<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Organic and natural</span>
<p style="margin:10px 0">Earthy colors, soft irregular shapes and natural pictures: calm, warm, made by hand.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>natural, earthy, eco, plants, “calm and warm”</dd>
<dt><b>In code</b></dt><dd>warm neutral ramps; shapes from 8-value <code>border-radius</code></dd>
<dt><b>Fits</b></dt><dd>food, wellness, agriculture, sustainability, outdoor brands</dd>
<dt><b>Goes wrong when</b></dt><dd>it is cream, serif and terracotta, or blobs and wavy dividers fill space</dd>
</dl></div></div>

<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Frutiger Aero</span>
<p style="margin:10px 0">The glossy, hopeful look of mid-2000s computers: aqua bubbles, blue skies, green grass, shiny buttons.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>aqua, bubbles, “sky and grass”, glossy, nostalgic</dd>
<dt><b>In code</b></dt><dd>a white gradient over the top half for gloss; glass as above</dd>
<dt><b>Fits</b></dt><dd>nostalgia brands, weather and outdoor apps, eco-tech, music</dd>
<dt><b>Goes wrong when</b></dt><dd>stock bubbles and grass decorate screens about something else, or every control shines</dd>
</dl></div></div>

<figcaption>Tone styles, part two. Playful and toy-like: a round mascot and a chunky button with a darker ledge beside its pressed state. Organic and natural: a leaf in an irregular olive shape on pale sand. Frutiger Aero: a glossy aqua button with bubbles over sky and a green hill.</figcaption>
