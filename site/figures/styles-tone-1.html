<figure class="fig">
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px">
<div id="minimal-monochrome" style="border:1px solid var(--line);min-width:0">
<div aria-hidden="true" style="aspect-ratio:7/5;width:100%;max-height:180px;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;padding:12px 16px 24px;background:#f7f7f7;color:#111;font-size:12px;line-height:16px">
<div style="display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid #d6d6d6"><span>Index</span><span style="color:#5c5c5c">Work · Info</span></div>
<div style="align-self:center;font-size:14px;line-height:20px;font-weight:500">Quiet by design.</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;color:#5c5c5c"><span style="height:30px;background:#e2e2e2"></span><span style="height:30px;background:#cfcfcf"></span><span style="height:30px;background:#e9e9e9"></span><span>01</span><span>02</span><span>03</span></div>
</div>
<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Minimal monochrome</span>
<p style="margin:10px 0">Black, white and grays only, with lots of empty space and small, quiet type.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>black and white, “no color”, gallery, quiet</dd>
<dt><b>In code</b></dt><dd>one neutral ramp; the accent set to the darkest neutral</dd>
<dt><b>Fits</b></dt><dd>fashion and premium retail, portfolios, writing and developer tools</dd>
<dt><b>Goes wrong when</b></dt><dd>nothing looks clickable, or gray text sits on gray</dd>
</dl></div></div>
<div id="dark-luxe" style="border:1px solid var(--line);min-width:0">
<div aria-hidden="true" style="aspect-ratio:7/5;width:100%;max-height:180px;overflow:hidden;padding:14px 16px 24px;background:radial-gradient(ellipse 70% 60% at 50% 0,rgb(255 255 255/.1),transparent 70%),#0b0b0d;color:#f4f4f5">
<div style="font-size:17px;line-height:22px;font-weight:500;letter-spacing:-.03em">Design system</div>
<div style="font-size:12px;line-height:16px;color:#a1a1aa">Tokens, CSS and DESIGN.md</div>
<div style="margin-top:10px;border:1px solid rgb(255 255 255/.09);border-radius:8px;background:#141417;font:12px/16px 'Source Code Pro',monospace;color:#d4d4d8"><div style="display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid rgb(255 255 255/.07)"><span style="width:7px;height:7px;border-radius:50%;background:#8b9cff"></span>color.text.primary</div><div style="display:flex;align-items:center;gap:8px;padding:5px 10px"><span style="width:7px;height:7px;border-radius:50%;border:1px solid #71717a"></span>radius.control</div></div>
</div>
<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Dark luxe</span>
<p style="margin:10px 0">Near-black and quiet: soft gray text, thin lines, one soft light and real product screens.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>sleek dark, moody, high-end, “premium SaaS”</dd>
<dt><b>In code</b></dt><dd><code>#0b0b0d</code> page, lighter layers, borders in white at 8%</dd>
<dt><b>Fits</b></dt><dd>B2B SaaS, developer and pro creative tools, AI products</dd>
<dt><b>Goes wrong when</b></dt><dd>it is near-black with one neon accent and glows, or gray text drops below 4.5:1</dd>
</dl></div></div>
<div id="mesh-and-aurora" style="border:1px solid var(--line);min-width:0">
<div aria-hidden="true" style="aspect-ratio:7/5;width:100%;max-height:180px;overflow:hidden;display:grid;align-content:center;padding:0 18px 14px;background:radial-gradient(circle at 12% 18% in oklab,#86e3c8,transparent 58%),radial-gradient(circle at 88% 12% in oklab,#ffd36e,transparent 52%),radial-gradient(circle at 78% 92% in oklab,#ff9a82,transparent 58%),radial-gradient(circle at 18% 95% in oklab,#86c8ff,transparent 58%),#f4f1ec;color:#14161b">
<div style="font-size:22px;line-height:26px;font-weight:600;letter-spacing:-.03em">Color that<br>drifts like light</div>
</div>
<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Mesh and aurora</span>
<p style="margin:10px 0">Soft clouds of several colors blend into each other, like the northern lights.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>dreamy colors, northern lights, “gradient background”</dd>
<dt><b>In code</b></dt><dd>stacked <code>radial-gradient</code> layers, mixed <code>in oklab</code></dd>
<dt><b>Fits</b></dt><dd>one marketing hero, music and AI products, events; never the dashboard</dd>
<dt><b>Goes wrong when</b></dt><dd>it is blue-to-purple, or blobs have no job</dd>
</dl></div></div>
</div>
<figcaption>Tone styles, part one. Minimal monochrome: grays only, hairlines and one quiet line of type. Dark luxe: near-black with a faint light from the top, gray secondary text and a hairline panel of token names. Mesh and aurora: four soft color clouds behind a dark headline.</figcaption>
</figure>
