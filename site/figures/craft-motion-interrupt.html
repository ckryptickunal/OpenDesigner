<div class="dont"><p class="dd-h">Keyframes restart from zero</p><p class="dd-why">Click it twice, quickly. The knob jumps to the far side before it heads back, because a keyframe animation always starts from its first frame.</p>
<div class="dd-art"><div class="cr-switches">
<label class="cr-switch cr-sw-k"><input type="checkbox"><span class="cr-sw" aria-hidden="true"><span class="cr-knob"></span></span><span>Email alerts</span></label>
<div class="cr-meta"><span>@keyframes · 400&nbsp;ms ease</span></div>
</div></div></div>
<div class="do"><p class="dd-h">Transitions turn around mid-way</p><p class="dd-why">Click it twice, quickly. The knob turns back from wherever it is, because a transition always starts from the current value.</p>
<div class="dd-art"><div class="cr-switches">
<label class="cr-switch cr-sw-t"><input type="checkbox"><span class="cr-sw" aria-hidden="true"><span class="cr-knob"></span></span><span>Email alerts</span></label>
<div class="cr-meta"><span>transition: transform 400ms ease</span></div>
</div></div></div>
</div>
<figcaption>Two real switches with the same timing, slower than usual so you can catch them mid-way. Interrupted, the keyframe switch jumps back to its first frame, while the transition switch reverses smoothly from where it is. Use transitions, or springs, for anything people can trigger quickly.</figcaption>
