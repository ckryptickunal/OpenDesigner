<figure class="fig cr">
<div class="dodont">
<div class="dont"><p class="dd-h">Slow both ways</p><p class="dd-why">Hold, then let go halfway. The fill drains as slowly as it filled, so stopping is as slow as deciding.</p>
<div class="dd-art cr-press-art"><button type="button" class="cr-btn cr-hold even"><span>Hold to delete</span><span class="cr-hold-fill" aria-hidden="true">Hold to delete</span></button>
<div class="cr-meta"><span>press 2&nbsp;s linear · release 2&nbsp;s linear</span></div></div></div>
<div class="do"><p class="dd-h">Slow to decide, fast to cancel</p><p class="dd-why">Hold, then let go halfway. The fill takes 2&nbsp;s while you decide and snaps back the moment you stop.</p>
<div class="dd-art cr-press-art"><button type="button" class="cr-btn cr-hold snappy"><span>Hold to delete</span><span class="cr-hold-fill" aria-hidden="true">Hold to delete</span></button>
<div class="cr-meta"><span>press 2&nbsp;s linear · release 200&nbsp;ms ease-out</span></div></div></div>
</div>
<figcaption>Two hold-to-confirm buttons for a destructive action. Both fill over 2 s while held. The one on the right snaps back in 200 ms when you let go: slow where the person decides, fast where the system answers. The fill is a clip-path, the one reveal the standards allow besides transform and opacity.</figcaption>
</figure>
