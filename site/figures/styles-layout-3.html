<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Terminal and ASCII</span>
<p style="margin:10px 0">Looks like a command line: monospace letters, a prompt, and pictures made of text characters.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>hacker, code, nerdy, “like a terminal”</dd>
<dt><b>In code</b></dt><dd><code>font-family: ui-monospace</code>, sizes in <code>ch</code>, <code>white-space: pre</code></dd>
<dt><b>Fits</b></dt><dd>developer tools, CLI products, infrastructure, docs</dd>
<dt><b>Goes wrong when</b></dt><dd>mono is used for long reading, or typing animations delay real content</dd>
</dl></div></div>

<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Pixel art</span>
<p style="margin:10px 0">Everything drawn from visible square pixels, like an old video game.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>8-bit, retro games, pixels, arcade, blocky</dd>
<dt><b>In code</b></dt><dd><code>image-rendering: pixelated</code>, whole-number scaling, <code>steps()</code> motion</dd>
<dt><b>Fits</b></dt><dd>games, developer culture, playful tech brands, onboarding moments</dd>
<dt><b>Goes wrong when</b></dt><dd>pixel fonts set small text, or pixels scale by uneven amounts and blur</dd>

<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Y2K</span>
<p style="margin:10px 0">The shiny future as imagined around 2000: chrome, holographic colors, bubbly shapes, old computer windows.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>2000s, chrome, holographic, glossy, vaporwave</dd>
<dt><b>In code</b></dt><dd>gradients with <code>background-clip: text</code>; <code>inset</code> highlights</dd>
<dt><b>Fits</b></dt><dd>youth social apps, music, fashion, creator tools; not B2B</dd>
