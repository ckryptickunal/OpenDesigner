<figure class="fig">

</svg></div>
<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Memphis</span>
<p style="margin:10px 0">Playful 1980s patterns: squiggles, zigzags, dots and confetti in clashing bright colors.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>80s, squiggles, confetti, zigzags, funky</dd>
<dt><b>In code</b></dt><dd>SVG pattern tiles as <code>background-image</code>, out of the reading order</dd>
<dt><b>Fits</b></dt><dd>events, youth brands, music and fashion campaigns; not product UI</dd>
<dt><b>Goes wrong when</b></dt><dd>confetti fills empty space, or patterns sit behind text</dd>
</dl></div></div>
<div id="bauhaus" style="border:1px solid var(--line);min-width:0">
<div aria-hidden="true" style="aspect-ratio:7/5;width:100%;max-height:180px;overflow:hidden;background:#f1ece0">
<svg viewBox="0 0 210 150" width="100%" height="100%"><rect x="22" y="0" width="9" height="150" fill="#111"/>
<circle cx="76" cy="68" r="46" fill="#d62828"/>
<polygon points="31,22 76,22 31,67" fill="#111"/>
<rect x="124" y="14" width="64" height="64" fill="#1d4fa3"/>
<text x="156" y="51" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#fff">FORM</text>
<path d="M124 124a32 32 0 0 1 64 0z" fill="#f5c518"/>
<rect x="112" y="124" width="88" height="3" fill="#111"/>
</svg></div>
<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Bauhaus</span>
<p style="margin:10px 0">Big simple shapes, circles, squares and triangles, in red, yellow, blue and black, with plain bold type.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>primary colors, art school, “circles, squares and triangles”</dd>
<dt><b>In code</b></dt><dd>shapes from <code>border-radius: 50%</code> and <code>clip-path</code> on a CSS grid</dd>
<dt><b>Fits</b></dt><dd>design tools, education, museums, architecture</dd>
<dt><b>Goes wrong when</b></dt><dd>shapes have no job, or a red shape sits next to a red error</dd>
</dl></div></div>
<div id="art-deco" style="border:1px solid var(--line);min-width:0">
<div aria-hidden="true" style="aspect-ratio:7/5;width:100%;max-height:180px;overflow:hidden;position:relative;display:grid;place-items:center;padding-bottom:14px;background:#0e1b17">
<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 100%,#d9b76e 0 20px,#0e1b17 21px 27px,transparent 28px),repeating-conic-gradient(from -90deg at 50% 100%,#c9a85c 0 .7deg,transparent .7deg 9deg);-webkit-mask:radial-gradient(circle at 50% 100%,#000 45%,transparent 80%);mask:radial-gradient(circle at 50% 100%,#000 45%,transparent 80%)"></div>
<div style="position:absolute;inset:8px;border:1px solid #c9a85c;outline:1px solid #c9a85c;outline-offset:-6px"></div>
<div style="position:relative;display:grid;justify-items:center;gap:6px"><span style="padding:6px 6px 6px 14px;background:#0e1b17;border:1px solid #d9b76e;color:#e6c77f;font-size:20px;line-height:24px;font-weight:300;letter-spacing:.34em">GRAND</span><svg width="64" height="10" viewBox="0 0 64 10"><path d="M2 2l10 6 10-6 10 6 10-6 10 6 10-6" fill="none" stroke="#d9b76e" stroke-width="1.5"/></svg></div>
</div>
<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Art Deco</span>
<p style="margin:10px 0">1920s glamour: gold lines on black or deep green, fans and sunbursts, tall elegant capitals.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>Gatsby, gold, 1920s, grand hotel, theatre</dd>
<dt><b>In code</b></dt><dd>SVG ornament, <code>border-image</code> frames, a gold plus a lighter step</dd>
<dt><b>Fits</b></dt><dd>hotels, bars and restaurants, events, theatre, jewelry</dd>
<dt><b>Goes wrong when</b></dt><dd>gold gradient text is everywhere, or every card gets ornament</dd>
</dl></div></div>
</div>
<figcaption>Graphic styles, part two. Memphis: squiggles, a zigzag, dots, stripes and confetti in clashing colors. Bauhaus: a red circle, a blue square, a yellow half circle and black bars on off-white. Art Deco: a gold sunburst, a double-line frame and spaced capitals on deep green.</figcaption>
</figure>
