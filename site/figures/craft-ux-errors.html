<figure class="fig cr">
<div class="dodont">
<div class="dont"><p class="dd-h">An alert after you press the button</p><p class="dd-why">The mistake shows up only on submit, in a dialog that covers the form and does not say which field is wrong.</p>
<div class="dd-art"><div class="cr-win cr-modalwin cr-ui" aria-hidden="true">
<div class="cr-form"><span class="lab">Work email</span><span class="cr-field">dana.lee@</span><span class="cr-pill solid">Create account</span></div>
<div class="cr-scrim"></div>
<div class="cr-alert"><b>Something went wrong</b><span>Please correct the errors in the form.</span><span class="cr-pill solid">OK</span></div>
</div></div></div>
<div class="do"><p class="dd-h">A message under the field, as you go</p><p class="dd-why">The field is checked inline, not on submit. The message sits next to the problem and uses an icon as well as color.</p>
<div class="dd-art"><div class="cr-win cr-modalwin cr-ui" aria-hidden="true">
<div class="cr-form"><span class="lab">Work email</span><span class="cr-field bad">dana.lee@</span>
<span class="cr-err"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.6v4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.2" r="1" fill="currentColor"/></svg><span>Add the part after the @, like name@example.com.</span></span>
<span class="cr-pill solid">Create account</span></div>
</div></div></div>
</div>
<figcaption>The same sign-up mistake shown two ways. An alert after submit hides the form and names no field. An inline check before submit puts the message right under the problem, with an icon so it does not rely on color alone.</figcaption>
</figure>
