<figure class="fig">
<div class="dodont">
  <div class="do">
    <p class="dd-h">Say why</p>
    <p class="dd-why">The reason goes into the decision log, so a later session knows what the value protects before it changes it.</p>
    <div class="dd-art" style="display:grid;gap:10px">
      <pre class="code-lines" style="background:var(--surface-raised);white-space:pre-wrap;overflow-wrap:anywhere"><span class="c">$</span> engine.py set dials.roundness 60 <span class="k"><span class="nw">--why</span> "softer corners for a friendlier feel"</span>
<span class="nw">D-0009</span> set dials.roundness = 60 (chosen)
  tokens: 6 values change (radius.container, radius.control, radius.control-sm, ...)</pre>
      <span class="kicker">opendesigner/decisions.md</span>
      <pre class="code-lines" style="background:var(--surface-raised);white-space:pre-wrap;overflow-wrap:anywhere">## <span class="nw">D-0009</span>&nbsp;· dials.roundness = 60
- set_by: chosen&nbsp;· locked: no&nbsp;· date: <span class="nw">2026-10-14</span>&nbsp;· supersedes: <span class="nw">D-0008</span>&nbsp;· source_ref: none
- <span class="ok">reason: softer corners for a friendlier feel</span>
- previous value: 45</pre>
    </div>
  </div>
  <div class="dont">
    <p class="dd-h">Leave the reason out</p>
    <p class="dd-why">The value is saved, but the log can't say what it was for. The next change has nothing to weigh it against.</p>
    <div class="dd-art" style="display:grid;gap:10px">
      <pre class="code-lines" style="background:var(--surface-raised);white-space:pre-wrap;overflow-wrap:anywhere"><span class="c">$</span> engine.py set dials.roundness 45
<span class="nw">D-0008</span> set dials.roundness = 45 (chosen)
  tokens: 6 values change (radius.container, radius.control, radius.control-sm, ...)</pre>
      <span class="kicker">opendesigner/decisions.md</span>
      <pre class="code-lines" style="background:var(--surface-raised);white-space:pre-wrap;overflow-wrap:anywhere">## <span class="nw">D-0008</span>&nbsp;· dials.roundness = 45
- set_by: chosen&nbsp;· locked: no&nbsp;· date: <span class="nw">2026-10-14</span>&nbsp;· supersedes: none&nbsp;· source_ref: none
- <span class="bad">reason: (no reason given)</span></pre>
    </div>
  </div>
</div>
<figcaption>Both commands record the decision and change the same six radius tokens. Only the first tells the next session why, which is what stops a later change from quietly undoing it.</figcaption>
</figure>
