<figure class="fig">
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px">
<div id="swiss" style="border:1px solid var(--line);min-width:0">
<div aria-hidden="true" style="aspect-ratio:7/5;width:100%;max-height:180px;overflow:hidden;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:auto 1fr auto;padding:14px 0 24px;background:linear-gradient(90deg,rgb(214 40 40/.3) 1px,transparent 1px) 0 0/calc(100%/6) 100%,#f6f6f3;color:#111">
<div style="grid-column:1/6;grid-row:1;padding-left:6px;font-size:28px;line-height:28px;font-weight:700;letter-spacing:-.04em">Form<br>and grid</div>
<div style="grid-column:6/7;grid-row:1;width:18px;height:18px;margin-left:6px;background:#d62828"></div>
<div style="grid-column:4/7;grid-row:3;padding-left:6px;font-size:12px;line-height:16px">Flush left,<br>ragged right.</div>
</div>
<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Swiss style</span>
<p style="margin:10px 0">A strict grid, plain bold sans-serif type set flush left, lots of empty space and one strong accent.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>grid, poster, orderly, “sharp and serious”</dd>
<dt><b>In code</b></dt><dd><code>grid-template-columns: repeat(12, 1fr)</code>, <code>text-align: start</code></dd>
<dt><b>Fits</b></dt><dd>enterprise and B2B tools, finance, wayfinding, documentation</dd>
<dt><b>Goes wrong when</b></dt><dd>the look is copied without a grid, or tiny tracked mono labels are everywhere</dd>
</dl></div></div>
<div id="editorial" style="border:1px solid var(--line);min-width:0">
<div aria-hidden="true" style="aspect-ratio:7/5;width:100%;max-height:180px;overflow:hidden;padding:12px 16px 22px;background:#fff;color:#1a1a1a">
<div style="font-size:12px;line-height:16px;font-weight:700;letter-spacing:.08em;color:#b3261e">ESSAY</div>
<div style="font-size:25px;line-height:28px;font-weight:300;letter-spacing:-.03em;margin:2px 0 8px">Naming the look</div>
<div style="border-top:1px solid #1a1a1a;padding-top:7px;font-size:12px;line-height:16px"><span style="float:left;font-size:38px;line-height:30px;font-weight:300;margin:2px 5px 0 0">M</span>ost people have no word for the look they want. They say “frosty”.</div>
</div>
<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Editorial</span>
<p style="margin:10px 0">It reads like a good magazine: big headlines, calm columns of text, large photos.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>magazine, newspaper, bookish, “long reads”</dd>
<dt><b>In code</b></dt><dd><code>max-width: 65ch</code>, a serif for headings, <code>text-wrap: pretty</code></dd>
<dt><b>Fits</b></dt><dd>publications, blogs, reports, case studies</dd>
<dt><b>Goes wrong when</b></dt><dd>it is cream, serif and terracotta by default, or the words are filler in a nice font</dd>
</dl></div></div>
<div id="isometric" style="border:1px solid var(--line);min-width:0">
<div aria-hidden="true" style="aspect-ratio:7/5;width:100%;max-height:180px;overflow:hidden;background:#f7f8fb">
<svg viewBox="0 0 210 150" width="100%" height="100%" font-size="13" fill="#222428"><g stroke="#9aa3b5" stroke-dasharray="2 3"><path d="M18 43v64M106 43v64M62 65v64"/></g>
<path d="M62 84l44 22-44 22-44-22z" fill="#d3dae8"/><path d="M18 106l44 22v7l-44-22z" fill="#a6b1c7"/><path d="M62 128l44-22v7l-44 22z" fill="#7c88a3"/>
<path d="M62 52l44 22-44 22-44-22z" fill="#b9c6ff"/><path d="M18 74l44 22v7l-44-22z" fill="#8597ff"/><path d="M62 96l44-22v7l-44 22z" fill="#5f73e8"/>
<path d="M62 20l44 22-44 22-44-22z" fill="#7487ff"/><path d="M18 42l44 22v7l-44-22z" fill="#2338ff"/><path d="M62 64l44-22v7l-44 22z" fill="#1a29c2"/>
<g stroke="#222428"><path d="M110 42h10M110 74h10M110 106h10"/></g>
<text x="124" y="46">component</text><text x="124" y="78">semantic</text><text x="124" y="110">primitive</text></svg></div>
<div style="padding:0 14px 14px"><span class="sticker ink" style="display:flex;width:fit-content;position:relative;margin-top:-13px">Isometric</span>
<p style="margin:10px 0">Things drawn in 3D from above at a fixed angle, with no vanishing point, so parallel lines stay parallel.</p>
<dl class="kv" style="grid-template-columns:1fr;gap:2px">
<dt><b>People say</b></dt><dd>3D diagram, little city, stacked layers, blocks</dd>
<dt><b>In code</b></dt><dd>SVG drawings on a 2:1 slope; best kept as assets</dd>
<dt><b>Fits</b></dt><dd>explaining layers or architecture: infrastructure, fintech, security</dd>
<dt><b>Goes wrong when</b></dt><dd>the clip art has nothing to do with the product, or invents parts the words never mention</dd>
</dl></div></div>
</div>
<figcaption>Layout and drawing styles. Swiss: a bold headline flush left on a visible six-column grid, with one red square. Editorial: a section label, a large headline, a hairline rule and a drop cap. Isometric: the three tiers of design tokens, primitive, semantic and component, drawn as stacked plates lit from one side.</figcaption>
</figure>
