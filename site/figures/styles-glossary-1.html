<figure class="fig">
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px">
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;background:linear-gradient(90deg in oklab,#2338ff,#ffc6e3)"></div>
<p style="margin:0;padding:8px 12px 12px"><b>Linear gradient</b><br>One color fades into another along a straight line.<br><code>linear-gradient()</code></p></div>
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;background:radial-gradient(circle at 72% 40%,#ffcf70,rgb(255 207 112/0) 62%),#1d2340"></div>
<p style="margin:0;padding:8px 12px 12px"><b>Radial gradient</b><br>Color spreads out from a point, like light from a lamp.<br><code>radial-gradient()</code></p></div>
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;display:flex;gap:18px;align-items:center;justify-content:center;background:#f2f4f9"><span style="width:58px;height:58px;border-radius:50%;background:conic-gradient(#ff3b3b,#ffd23f,#3fd16b,#2ec5ff,#2338ff,#e84bd8,#ff3b3b)"></span><span style="width:58px;height:58px;border-radius:50%;background:conic-gradient(#2338ff 0 45%,#ffc6e3 0 75%,#222428 0)"></span></div>
<p style="margin:0;padding:8px 12px 12px"><b>Conic gradient</b><br>Colors turn around a center, like a color wheel or a pie.<br><code>conic-gradient()</code></p></div>
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;background:radial-gradient(circle at 10% 20% in oklab,#ff9a82,transparent 60%),radial-gradient(circle at 90% 10% in oklab,#86c8ff,transparent 60%),radial-gradient(circle at 60% 100% in oklab,#ffe07a,transparent 60%),#c9f0dc"></div>
<p style="margin:0;padding:8px 12px 12px"><b>Mesh gradient</b><br>Several colors blend in many directions at once.<br>several <code>radial-gradient</code> layers</p></div>
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;display:grid;place-items:center;background:#fff"><span style="padding:8px 22px;border:3px solid transparent;border-radius:10px;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#2338ff,#ff5fa2) border-box;font-size:14px;line-height:20px;font-weight:600;color:#222428">Outline</span></div>
<p style="margin:0;padding:8px 12px 12px"><b>Gradient border</b><br>The outline itself fades from one color to another.<br>a gradient <code>border-box</code></p></div>
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;display:grid;place-items:center;background:#fff"><span style="font-size:46px;line-height:50px;font-weight:700;letter-spacing:-.03em;background:linear-gradient(90deg,#2338ff,#ff5fa2);-webkit-background-clip:text;background-clip:text;color:transparent">Aa</span></div>
<p style="margin:0;padding:8px 12px 12px"><b>Gradient text</b><br>The letters fade from one color to another.<br><code>background-clip: text</code></p></div>
</div>
<figcaption>Six kinds of gradient: linear along a line, radial from a point, conic around a center (a color wheel and a pie), mesh in many directions, a gradient border and gradient text. Gradients belong on marketing and illustration surfaces, never on buttons or forms.</figcaption>
</figure>
