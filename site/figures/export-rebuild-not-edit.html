<figure class="fig">
<div class="dodont">
<div class="dont">
<p class="dd-h">Edit an export by hand</p>
<p class="dd-why">The change lives in one file. The next <span class="mono">build</span> overwrites it, and Swift, Compose and Figma never saw it.</p>
<div class="dd-art">
<div class="kicker" style="font-size:12px;margin-bottom:6px">build/css/tokens.css</div>
<pre class="code-lines" style="white-space:pre-wrap;overflow-wrap:anywhere;margin:0"><span class="c">/* ... do not edit by hand. */</span>
--ds-radius-container: <span class="bad" style="text-decoration:line-through">12px</span> <span class="bad">16px</span>;</pre>
<dl class="kv mono" style="font-size:12.5px;margin:10px 0 0;gap:4px 14px"><dt>css</dt><dd><span class="num">16px</span> <span class="chip bad">until the next build</span></dd><dt>swift</dt><dd class="num">12px</dd><dt>compose</dt><dd class="num">12px</dd><dt>figma</dt><dd class="num">12px</dd></dl>
</div>
</div>
<div class="do">
<p class="dd-h">Change the decision, then rebuild</p>
<p class="dd-why">One command records the reason, and one build rewrites every export together.</p>
<div class="dd-art">
<pre class="code-lines" style="white-space:pre-wrap;overflow-wrap:anywhere;margin:0"><span class="c">$</span> engine.py set dials.roundness 60 <span class="nw">--why</span> "softer corners for a friendlier feel"
<span class="c">$</span> engine.py build</pre>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><span class="chip ok">css</span><span class="chip ok">tailwind</span><span class="chip ok">swift</span><span class="chip ok">compose</span><span class="chip ok">figma</span><span class="chip ok">paper</span><span class="chip ok">dtcg</span><span class="chip ok">DESIGN.md</span></div>
</div>
</div>
</div>
<figcaption>Every export is made from the token files, so a hand edit to one of them lasts until the next build and never reaches the others. Changing the decision and rebuilding updates all of them at once, with the reason on record.</figcaption>
</figure>
