<figure class="fig cr">
<div class="dodont">
<div class="dont"><p class="dd-h">No press state</p><p class="dd-why">Press and hold it. Nothing changes until you let go, so the button feels dead under your finger.</p>
<div class="dd-art cr-press-art"><button type="button" class="cr-btn">Save changes</button>
<div class="cr-meta"><span>no :active style</span></div></div></div>
<div class="do"><p class="dd-h">Scales to 0.97 while pressed</p><p class="dd-why">Press and hold it. The whole button, label included, gives a little the moment you press.</p>
<div class="dd-art cr-press-art"><button type="button" class="cr-btn pressable">Save changes</button>
<div class="cr-meta"><span>:active { scale(0.97) } · 160&nbsp;ms · house ease-out</span></div></div></div>
</div>
<figcaption>Two real buttons to press. One has no pressed state; the other scales to 0.97 while pressed, over 160 ms on the house ease-out curve, so it answers the moment your finger or mouse goes down. With reduced motion on, it darkens instead of scaling.</figcaption>
</figure>
