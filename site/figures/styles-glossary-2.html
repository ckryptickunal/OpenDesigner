<figure class="fig">
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px">
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;display:grid;place-items:center;background:repeating-linear-gradient(120deg,#2338ff 0 14px,#ff9a3c 14px 28px,#2fe0c0 28px 42px)"><span style="width:56%;height:46%;border-radius:12px;background:rgb(255 255 255/.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgb(255 255 255/.6)"></span></div>
<p style="margin:0;padding:8px 12px 12px"><b>Frosted glass</b><br>A see-through panel that blurs what is behind it.<br><code>backdrop-filter: blur()</code></p></div>
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;display:grid;place-items:center;background:#f2f4f9"><span style="width:84px;height:44px;border-radius:8px;background:#fff;box-shadow:0 6px 16px rgb(20 21 23/.18)"></span></div>
<p style="margin:0;padding:8px 12px 12px"><b>Drop shadow</b><br>A soft shadow underneath, so something looks lifted.<br><code>box-shadow: 0 4px 12px</code></p></div>
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;display:grid;place-items:center;background:#e9ecf2"><span style="width:84px;height:44px;border-radius:8px;background:#e9ecf2;box-shadow:inset 0 3px 7px rgb(20 21 23/.28)"></span></div>
<p style="margin:0;padding:8px 12px 12px"><b>Inner shadow</b><br>A shadow inside the edge, so something looks pressed in.<br><code>box-shadow: inset</code></p></div>
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;display:grid;place-items:center;background:#d4f53c"><span style="width:80px;height:40px;background:#fff;border:2px solid #111;box-shadow:5px 5px 0 #111"></span></div>
<p style="margin:0;padding:8px 12px 12px"><b>Hard shadow</b><br>A sharp, solid shadow shifted to one side, with no blur.<br><code>box-shadow: 4px 4px 0</code></p></div>
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;overflow:hidden;background:#4c5cff"><svg viewBox="0 0 200 100" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><path d="M114.1 31.9L314 232 286 260 85.9 60.1z" fill="#2b38c4"/><circle cx="100" cy="46" r="20" fill="#fff"/></svg></div>
<p style="margin:0;padding:8px 12px 12px"><b>Long shadow</b><br>A flat shadow that stretches far out at 45 degrees.<br>stacked shadows or an SVG shape</p></div>
<div style="border:1px solid var(--line);min-width:0"><div aria-hidden="true" style="aspect-ratio:2/1;max-height:110px;display:grid;align-content:center;padding:0 16px;background:#fff"><span style="height:6px;width:60%;background:#cdd2dc;margin:8px 0"></span><span style="border-top:1px solid #cdd2dc"></span><span style="height:6px;width:75%;background:#cdd2dc;margin:8px 0"></span><span style="border-top:1px solid #cdd2dc"></span><span style="height:6px;width:45%;background:#cdd2dc;margin:8px 0"></span></div>
<p style="margin:0;padding:8px 12px 12px"><b>Hairline</b><br>The thinnest possible line, 1 px or less, between rows.<br><code>border-top: 1px solid</code></p></div>
</div>
<figcaption>Six ways to show depth and edges: frosted glass over stripes, a soft drop shadow, an inner shadow, a hard offset shadow, a long 45-degree shadow behind a circle, and hairlines between rows.</figcaption>
</figure>
