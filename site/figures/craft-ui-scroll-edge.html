<div class="dont"><p class="dd-h">A hard line under the header, always</p><p class="dd-why">The 1&nbsp;px divider is there even when nothing is underneath, and it cuts the scrolling content with a sharp edge.</p>
<div class="dd-art"><div class="cr-win cr-edgewin cr-ui" aria-hidden="true">
<div class="cr-bar line"><span>Activity</span><span class="cr-pill" style="min-height:26px;font-size:12px">Filter</span></div>
<div class="cr-feed"><div><i></i><span>Dana commented on Q3 plan</span></div><div><i></i><span>Build 482 passed</span></div><div><i></i><span>Ana joined the workspace</span></div><div><i></i><span>Invoice 1043 was paid</span></div></div>
</div></div></div>
<div class="do"><p class="dd-h">A soft edge where content passes under</p><p class="dd-why">The header is translucent and a short fade appears only where content slides beneath it. No permanent line.</p>
<div class="dd-art"><div class="cr-win cr-edgewin cr-ui" aria-hidden="true">
<div class="cr-bar fadeedge"><span>Activity</span><span class="cr-pill" style="min-height:26px;font-size:12px">Filter</span></div>
<div class="cr-feed"><div><i></i><span>Dana commented on Q3 plan</span></div><div><i></i><span>Build 482 passed</span></div><div><i></i><span>Ana joined the workspace</span></div><div><i></i><span>Invoice 1043 was paid</span></div></div>
</div></div></div>
</div>
<figcaption>A list scrolled under a sticky header. A permanent 1 px divider cuts the content with a hard edge; a translucent header with a short fade where content passes beneath separates the two only where they overlap.</figcaption>
