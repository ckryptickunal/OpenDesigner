<figure class="fig">
<div class="fig-panel">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
<div style="display:grid;align-content:start;gap:8px;padding:14px;border-radius:var(--radius-detail);background:var(--surface-raised);box-shadow:0 0 0 1px var(--line)">
<span class="chip num" style="justify-self:start">under 1 s</span><strong>Show nothing new</strong><span style="color:var(--ink-muted);font-size:14px;line-height:20px">The button says “Saving…” and the old view stays. A spinner that flashes for a moment reads as a glitch.</span></div>
<div style="display:grid;align-content:start;gap:8px;padding:14px;border-radius:var(--radius-detail);background:var(--surface-raised);box-shadow:0 0 0 1px var(--line)">
<span class="chip accent num" style="justify-self:start">1 to 10 s</span><strong>A spinner, or a skeleton</strong><span style="color:var(--ink-muted);font-size:14px;line-height:20px">A small spinner in the control the person pressed. A whole area that's loading gets a skeleton of its own shape.</span></div>
<div style="display:grid;align-content:start;gap:8px;padding:14px;border-radius:var(--radius-detail);background:var(--surface-raised);box-shadow:0 0 0 1px var(--line)">
<span class="chip ink num" style="justify-self:start">over 10 s</span><strong>Progress with steps</strong><span style="color:var(--ink-muted);font-size:14px;line-height:20px">A bar with a percentage, the time left, each step done, now and next, and a way to keep working.</span></div>
</div>
</div>
<figcaption>Three ways to show a wait, picked by how long it takes. Under a second, nothing new appears; from 1 to 10 seconds, a spinner in the control or a skeleton of the area; over 10 seconds, a progress bar with steps and the time left.</figcaption>
</figure>
