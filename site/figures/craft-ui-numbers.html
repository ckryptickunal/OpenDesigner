<figure class="fig cr">
<div class="dodont">
<div class="dont"><p class="dd-h">Digits of different widths</p><p class="dd-why">The narrow 1s pull some amounts to the right, so the decimal points no longer line up and the column is hard to scan.</p>
<div class="dd-art">
<div class="cr-meta" style="margin-bottom:8px"><span>proportional digits</span></div>
<div class="cr-amounts cr-guide cr-ui">
<div><span>Hosting</span><span class="v">$<span class="pn1">1</span>,204.50</span></div>
<div><span>Design tools</span><span class="v">$6<span class="pn1">1</span><span class="pn1">1</span>.<span class="pn1">1</span><span class="pn1">1</span></span></div>
<div><span>Contractors</span><span class="v">$8,4<span class="pn1">1</span>0.00</span></div>
<div><span>Travel</span><span class="v">$<span class="pn1">1</span>,<span class="pn1">1</span><span class="pn1">1</span><span class="pn1">1</span>.<span class="pn1">1</span>9</span></div>
</div></div></div>
<div class="do"><p class="dd-h">Tabular digits</p><p class="dd-why">Every digit takes the same width, so the decimal points sit on one line and a changing number does not jiggle.</p>
<div class="dd-art">
<div class="cr-meta" style="margin-bottom:8px"><span>font-variant-numeric: tabular-nums</span></div>
<div class="cr-amounts cr-guide cr-ui">
<div><span>Hosting</span><span class="v tab">$1,204.50</span></div>
<div><span>Design tools</span><span class="v tab">$611.11</span></div>
<div><span>Contractors</span><span class="v tab">$8,410.00</span></div>
<div><span>Travel</span><span class="v tab">$1,111.19</span></div>
</div></div></div>
</div>
<figcaption>The same expense column twice, with a dashed line where the decimal points should sit. The left column is drawn with narrow 1s, the way many typefaces set digits by default, and the amounts drift. With tabular digits they line up, and counters and timers stop shifting as they change.</figcaption>
</figure>
