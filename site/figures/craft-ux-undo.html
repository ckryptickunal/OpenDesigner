<figure class="fig cr">
<div class="dodont">
<div class="dont"><p class="dd-h">“Are you sure?” for something you can undo</p><p class="dd-why">Archiving can be reversed, yet it asks every time. Asked that often, people learn to click through without reading.</p>
<div class="dd-art"><div class="cr-win cr-modalwin cr-ui" aria-hidden="true">
<div class="cr-inbox"><div><i></i><span>Invoice for September</span></div><div><i></i><span>Team offsite plan</span></div><div><i></i><span>Contract renewal</span></div><div><i></i><span>Weekly metrics</span></div></div>
<div class="cr-scrim"></div>
<div class="cr-alert"><b>Archive this conversation?</b><span>You can find it later in Archive.</span><span class="cr-dialog-row"><span class="cr-pill ghost">Cancel</span><span class="cr-pill solid">Archive</span></span></div>
</div></div></div>
<div class="do"><p class="dd-h">Do it, then offer Undo</p><p class="dd-why">The conversation is archived at once. A toast offers Undo and stays until the person uses it or closes it.</p>
<div class="dd-art"><div class="cr-win cr-modalwin cr-ui" aria-hidden="true">
<div class="cr-inbox"><div class="gone"><i></i><span>Invoice for September</span></div><div><i></i><span>Team offsite plan</span></div><div><i></i><span>Contract renewal</span></div><div><i></i><span>Weekly metrics</span></div></div>
<div class="cr-toast still"><span>Conversation archived</span><span class="cr-pill">Undo</span></div>
</div></div></div>
</div>
<figcaption>Archiving a conversation, a slip that can be reversed. A confirmation dialog every time trains people to click through it. Doing it at once and offering Undo in a toast that waits for the person is faster and safer; keep confirmation for actions that cannot be undone.</figcaption>
</figure>
